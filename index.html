/* ---------------------------------------------------------------------------
   Browser storage shim
   ---------------------------------------------------------------------------
   Two backends, split by the "shared" flag the app already passes on every
   call (this matches the same meaning it has in Claude's own storage API):

   - PERSONAL data (shared=false) -- your signed-in session, theme choice,
     admin-unlock flag -- always stays in this browser's own localStorage.
     It's meant to be per-browser, so there's no reason to send it anywhere.

   - SHARED data (shared=true) -- orders, customer accounts, ingredients,
     settings, the audit log, everything admin and every customer need to
     see in common -- goes to a small Google Sheet over HTTP, *if* one is
     configured below. Until you set SHEETS_API_URL, shared data falls
     back to localStorage too, so the app still works out of the box --
     it just won't be shared across devices/browsers until you connect a
     real backend. See google_sheets_backend/Code.gs for the one-time
     Apps Script setup this pairs with.
   ------------------------------------------------------------------------- */

const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycby7Uy6wHaJKMBGoHFLT-8GjBnEhudrfsBJcaYkil5xX3Fx7XYxoG04rePHniU4c10UFXA/exec"; // <-- paste your deployed Apps Script "Web app URL" here
const SHEETS_TOKEN = "sb_9f2a71";   // <-- paste the same TOKEN value you set in Code.gs (leave blank if you left it blank there too)

const SHEETS_ENABLED = /^https:\/\//.test(SHEETS_API_URL);
window.__STORAGE_BACKEND__ = SHEETS_ENABLED ? "sheets" : "local";
// Google Apps Script quotas are generous but not infinite -- back off the
// live-refresh polling interval when every poll is a real network round
// trip to Sheets, instead of an instant local read.
window.__STORAGE_POLL_MS__ = SHEETS_ENABLED ? 20000 : 5000;

function localGet_(key) {
  const raw = localStorage.getItem(key);
  if (raw == null) throw new Error("not found");
  return { key, value: raw };
}
function localSet_(key, value) {
  localStorage.setItem(key, value);
  return { key, value };
}
function localDelete_(key) {
  localStorage.removeItem(key);
  return { key, deleted: true };
}
function localList_(prefix) {
  const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
  return { keys, prefix };
}

// Every Sheets call reads the response as text first, then tries to parse
// it as JSON. If that fails, the error includes the actual HTTP status and
// a slice of whatever came back -- usually an Apps Script HTML error page
// (e.g. from an unhandled exception server-side, like writing a value
// larger than a single Sheets cell can hold on an un-updated deployment).
// A bare "Unexpected token" error hides exactly the detail needed to tell
// a stale-deployment problem apart from a size problem apart from a token
// problem, so this is deliberately more verbose than a normal JSON parse.
async function parseSheetsResponse_(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error(`Backend returned a non-JSON response (HTTP ${res.status}): ${text.slice(0, 400)}`);
  }
}

// Keys the app treats as a whole array, now stored one row per record in
// their own sheet tab instead of one cell holding the entire array. This
// mapping is what makes that transparent to the rest of the app: get/set
// for these keys still hand back/accept a single JSON array string, same
// as always, just backed by a different shape on the Sheets side.
const COLLECTION_SHEETS = {
  "dfp:orders": "Orders",
  "dfp:dogs": "Dogs",
  "dfp:ingredients": "Ingredients",
  "dfp:breeds": "Breeds",
  "dfp:locations": "Locations",
  "dfp:faqs": "FAQs",
  "dfp:audit": "AuditLog",
  "dfp:slotOverrides": "SlotOverrides",
  "dfp:cancelledSlots": "CancelledSlots",
  "dfp:forceOpenSlots": "ForceOpenSlots",
  "dfp:addresses": "Addresses",
  "dfp:orderItems": "OrderItems",
  "dfp:communityTopics": "CommunityTopics",
  "dfp:communityPosts": "CommunityPosts",
  "dfp:communityComments": "CommunityComments",
  "dfp:communityLikes": "CommunityLikes",
};

async function sheetsGet_(key) {
  const url = `${SHEETS_API_URL}?action=get&key=${encodeURIComponent(key)}${SHEETS_TOKEN ? `&token=${encodeURIComponent(SHEETS_TOKEN)}` : ""}`;
  const res = await fetch(url);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return { key: data.key, value: data.value };
}
// A single request covering any mix of plain scalar keys and whole
// collections -- this is what keeps a page load or the refresh button
// down to one round trip even though data now lives across several tabs.
async function sheetsGetBundle_(scalarKeys, collKeys) {
  const params = new URLSearchParams({ action: "getBundle" });
  if (scalarKeys.length) params.set("keys", scalarKeys.join(","));
  if (collKeys.length) params.set("collKeys", collKeys.join(","));
  if (SHEETS_TOKEN) params.set("token", SHEETS_TOKEN);
  const res = await fetch(`${SHEETS_API_URL}?${params.toString()}`);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return data; // { values: { key: string|null, ... } }
}
async function sheetsSet_(key, value) {
  // text/plain avoids a CORS preflight request, which Apps Script web apps
  // don't handle -- this is a deliberate workaround, not an oversight.
  const res = await fetch(SHEETS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key, value, token: SHEETS_TOKEN }),
  });
  const data = await parseSheetsResponse_(res);
  // Apps Script returns errors as ordinary 200 JSON, not an HTTP failure --
  // without this check, a rejected write (bad token, quota, etc.) looks
  // exactly like a successful one to the caller.
  if (data.error) throw new Error(`Sheets write failed: ${data.error}`);
  return data;
}
async function sheetsDelete_(key) {
  const res = await fetch(SHEETS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key, token: SHEETS_TOKEN }),
  });
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(`Sheets delete failed: ${data.error}`);
  return data;
}
async function sheetsList_(prefix) {
  const url = `${SHEETS_API_URL}?action=list&prefix=${encodeURIComponent(prefix || "")}${SHEETS_TOKEN ? `&token=${encodeURIComponent(SHEETS_TOKEN)}` : ""}`;
  const res = await fetch(url);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return data;
}

window.storage = {
  async get(key, shared) {
    if (shared && SHEETS_ENABLED) return sheetsGet_(key);
    return localGet_(key);
  },
  async set(key, value, shared) {
    if (shared && SHEETS_ENABLED) return sheetsSet_(key, value);
    return localSet_(key, value);
  },
  async delete(key, shared) {
    if (shared && SHEETS_ENABLED) return sheetsDelete_(key);
    return localDelete_(key);
  },
  async list(prefix, shared) {
    if (shared && SHEETS_ENABLED) return sheetsList_(prefix);
    return localList_(prefix);
  },
  // Extra batch helper -- not part of Claude's own storage API, only used
  // by this app's own polling code, and only wired up to do anything
  // useful when Sheets is the active backend (see loadManyOrSeed in the
  // app body: it feature-detects this and safely no-ops without it).
  async getMany(keys, shared) {
    if (shared && SHEETS_ENABLED) {
      const scalarKeys = keys.filter((k) => !COLLECTION_SHEETS[k]);
      const collKeys = keys.filter((k) => COLLECTION_SHEETS[k]);
      return sheetsGetBundle_(scalarKeys, collKeys);
    }
    const values = {};
    for (const k of keys) {
      try { values[k] = localGet_(k).value; } catch { values[k] = null; }
    }
    return { values };
  },
};

// capability to fall back to locally. Left unset (and therefore not
// available) when running without Sheets configured; the app body's
// requestPasswordReset/resetPasswordWithToken functions detect that and
// fail with a clear message instead of crashing.
if (SHEETS_ENABLED) {
  window.__sendPasswordResetEmail__ = async function (email) {
    const res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "requestReset", email, token: SHEETS_TOKEN }),
    });
    const data = await parseSheetsResponse_(res);
    if (data.error) throw new Error(data.error);
    return data;
  };
  window.__resetPasswordWithToken__ = async function (resetToken, newPassword) {
    const res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "resetPassword", resetToken, passwordHash: simpleHash(newPassword), token: SHEETS_TOKEN }),
    });
    const data = await parseSheetsResponse_(res);
    if (data.error) throw new Error(data.error);
    return data;
  };
}

const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = (n) => String(n).padStart(2, "0");
const toDateStr = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return toDateStr(d);
};
const todayStr = () => toDateStr(new Date());
const timeToMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const fmtTime = (t) => {
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad2(m)} ${ap}`;
};
const fmtDateLabel = (dateStr) => {
  if (dateStr === todayStr()) return "Today";
  if (dateStr === addDays(todayStr(), 1)) return "Tomorrow";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
};
// Set at the top of App's render on every render, before any children (and

// so admin's currency choice doesn't require threading config through
// dozens of call sites that just want to format a number as money.
let CURRENCY_SYMBOL = "₹";
const rupee = (n) => `${CURRENCY_SYMBOL}${Math.round(n).toLocaleString("en-IN")}`;
const fmtDateTime = (ts) => (ts ? new Date(ts).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "");
const formatAge = (totalMonths) => {
  const y = Math.floor(totalMonths / 12);
  const m = totalMonths % 12;
  const parts = [];
  if (y > 0) parts.push(`${y} ${y === 1 ? "year" : "years"}`);
  if (m > 0 || y === 0) parts.push(`${m} ${m === 1 ? "month" : "months"}`);
  return parts.join(" ");
};
// Whole months between a date of birth and today -- used so a dog's age
// keeps advancing on its own once a birth date is on file, instead of
// staying frozen at whatever number was entered when the dog was added.
const monthsBetween = (dobStr) => {
  const dob = new Date(dobStr + "T00:00:00");
  if (isNaN(dob.getTime())) return 0;
  const now = new Date();
  let months = (now.getFullYear() - dob.getFullYear()) * 12 + (now.getMonth() - dob.getMonth());
  if (now.getDate() < dob.getDate()) months -= 1;
  return Math.max(0, months);
};
// The age actually used for feeding calculations: computed fresh from the
// date of birth when one's on file, otherwise the directly-entered age.
const effectiveAgeMonths = (dog) => (dog.dob ? monthsBetween(dog.dob) : dog.ageMonths);
const haversineKm = (lat1, lon1, lat2, lon2) => {
  const toRad = (d) => (d * Math.PI) / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};
// A simple non-cryptographic string hash. This app runs entirely in the
// browser with no real backend, so this is only meant to keep a password
// from sitting around as obvious plain text -- it is not real security.
const simpleHash = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
};
const slugify = (name) => name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
// A plain <a href={dataUrl} download> is unreliable on mobile browsers once
// the data: URL gets large -- several mobile browsers try to navigate to
// it instead of downloading it, which looks like the page reloading. This
// converts the data URL to a Blob and downloads that instead, which mobile
// browsers handle far more consistently. Falls back to opening the image
// in a new tab (so it can still be long-press-saved) if anything goes wrong.
function downloadDataUrl(dataUrl, filename) {
  try {
    const [header, base64] = dataUrl.split(",");
    const mime = (header.match(/data:(.*?);base64/) || [])[1] || "image/png";
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch {
    window.open(dataUrl, "_blank");
  }
}

/* ---------------------------- Domain logic -------------------------------- */

function ageCategory(ageMonths) {
  if (ageMonths < 12) return "puppy";
  if (ageMonths > 84) return "senior";
  return "adult";
}

function calcAutoQty(ingredient, dog, breeds, engine) {
  const breed = breeds.find((b) => b.name === dog.breed) || { sizeFactor: 1 };
  const ageF = engine.ageFactors[ageCategory(dog.ageMonths)] ?? 1;
  const actF = engine.activityFactors[dog.activity] ?? 1;
  let qty = dog.weightKg * ingredient.baseRatePerKg * breed.sizeFactor * ageF * actF;
  qty = Math.round(qty / 5) * 5;
  return Math.max(qty, 0);
}

function nextServingWindow(config, orders) {
  const today = todayStr();
  // First: is there an earlier session (today or before) that still has
  // orders that aren't done yet? If so, that's still "next up" in the
  // sense that matters -- it hasn't actually been served, regardless of
  // whether its scheduled time has technically passed.
  const relevantDates = [...new Set((orders || []).map((o) => o.date))].filter((d) => d <= today).sort();
  for (const date of relevantDates) {
    for (const key of ["morning", "evening"]) {
      const unfinished = (orders || []).some((o) => o.date === date && o.session === key && !["DELIVERED", "CANCELLED"].includes(o.status));
      if (unfinished) return { date, session: key };
    }
  }
  // Nothing outstanding -- fall back to the next upcoming slot by time.
  const nowM = nowMin();
  for (const key of ["morning", "evening"]) {
    if (timeToMin(config.sessions[key].servingTime) >= nowM) return { date: today, session: key };
  }
  return { date: addDays(today, 1), session: "morning" };
}

function buildRouteUrl(ordersWithAddress, origin) {
  const pts = ordersWithAddress.filter((o) => o.customerAddress && typeof o.customerAddress.lat === "number");
  if (pts.length === 0) return null;
  const stops = pts.map((o) => `${o.customerAddress.lat},${o.customerAddress.lng}`);
  let url = "https://www.google.com/maps/dir/?api=1&travelmode=driving";
  if (origin) {
    // Round trip: start and end at the service area, every delivery as a
    // waypoint in between -- covers "start from the service area, deliver
    // everyone, come back to the service area."
    url += `&origin=${origin.lat},${origin.lng}&destination=${origin.lat},${origin.lng}`;
    url += `&waypoints=${encodeURIComponent(stops.join("|"))}`;
  } else {
    // No fixed service area to start from (e.g. delivering anywhere, no
    // areas configured) -- let Maps use the device's current location.
    const dest = stops[stops.length - 1];
    const wp = stops.slice(0, -1).join("|");
    url += `&destination=${dest}`;
    if (wp) url += `&waypoints=${encodeURIComponent(wp)}`;
  }
  return url;
}

function resolveCapacity(dateStr, sessionKey, config, slotOverrides) {
  const override = slotOverrides.find((o) => o.date === dateStr && o.session === sessionKey);
  return override ? override.capacity : config.sessions[sessionKey].capacity;
}

function sessionState(dateStr, sessionKey, config, orders, cancelledSlots, forceOpenSlots, slotOverrides) {
  if (cancelledSlots.some((c) => c.date === dateStr && c.session === sessionKey)) return "CANCELLED";
  const sess = config.sessions[sessionKey];
  const capacity = resolveCapacity(dateStr, sessionKey, config, slotOverrides);
  const count = orders.filter((o) => o.date === dateStr && o.session === sessionKey && o.status !== "CANCELLED").length;
  if (count >= capacity) return "FULL";
  const forced = forceOpenSlots.some((f) => f.date === dateStr && f.session === sessionKey);
  const today = todayStr();
  if (dateStr < today) return forced ? "OPEN" : "CLOSED";
  if (dateStr === today) {
    if (forced) return "OPEN";
    const closeM = timeToMin(sess.closeTime);
    const n = nowMin();
    if (n >= closeM) return "CLOSED";
    if (closeM - n <= 30) return "CLOSING_SOON";
    return "OPEN";
  }
  return "OPEN";
}

function slotCount(dateStr, sessionKey, orders) {
  return orders.filter((o) => o.date === dateStr && o.session === sessionKey && o.status !== "CANCELLED").length;
}

function nextAvailableSlot(config, orders, cancelledSlots, forceOpenSlots, slotOverrides) {
  const start = todayStr();
  for (let d = 0; d < 21; d++) {
    const date = addDays(start, d);
    for (const key of ["morning", "evening"]) {
      const st = sessionState(date, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
      if (st === "OPEN" || st === "CLOSING_SOON") return { date, session: key };
    }
  }
  return null;
}

function bestFaqMatch(query, faqs) {
  const stop = new Set(["the", "a", "an", "is", "are", "do", "does", "how", "what", "can", "i", "my", "to", "for", "of", "in", "on", "you", "your", "it"]);
  const words = (s) => (s.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => w.length > 1 && !stop.has(w));
  const qWords = words(query);
  if (qWords.length === 0) return null;
  let best = null;
  for (const faq of faqs) {
    const bag = new Set([...words(faq.q), ...words(faq.a)]);
    const score = qWords.reduce((s, w) => s + (bag.has(w) ? 1 : 0), 0);
    if (score > 0 && (!best || score > best.score)) best = { faq, score };
  }
  return best ? best.faq : null;
}

// Merges freshly loaded config with defaults, and migrates any config
// saved before mealChecklist existed (when there was only a single
// mealNote string) into the new array shape, so nothing already
// configured gets silently dropped.
function mergeConfig(raw) {
  const merged = { ...SEED_CONFIG, ...raw, sessions: { ...SEED_CONFIG.sessions, ...(raw.sessions || {}) } };
  if (!Array.isArray(merged.mealChecklist) && raw.mealNote) {
    merged.mealChecklist = [{ id: "migrated_1", text: raw.mealNote }];
  }
  return merged;
}

async function loadOrSeed(key, seed) {
  try {
    const res = await window.storage.get(key, SHARED);
    if (res && res.value != null) return JSON.parse(res.value);
  } catch {
    // Missing key, or a transient read failure -- look the same from here.
    // Either way, don't write anything back on a guess.
  }
  return seed;
}
async function persist(key, value) {
  await window.storage.set(key, JSON.stringify(value), SHARED);
}
// Loads several keys at once. If the storage backend exposes getMany (only
// the Google Sheets shim does -- neither the platform-managed storage nor
// the plain localStorage shim need it), this collapses many network calls
// into one. Everywhere else it just falls back to individual loadOrSeed
// calls, so this is safe to call regardless of which backend is active.
async function loadManyOrSeed(entries) {
  if (typeof window.storage.getMany === "function") {
    try {
      const res = await window.storage.getMany(entries.map(([k]) => k), SHARED);
      return entries.map(([key, seed]) => {
        const raw = res?.values?.[key];
        if (raw != null) {
          try { return JSON.parse(raw); } catch {}
        }
        return seed;
      });
    } catch {
      // fall through to the per-key path below
    }
  }
  return Promise.all(entries.map(([key, seed]) => loadOrSeed(key, seed)));
}

function Btn({ children, onClick, variant = "primary", disabled, style, small, full, loadingText }) {
  const [busy, setBusy] = useState(false);
  const base = {
    fontFamily: "var(--font-body)", fontWeight: 600, cursor: (disabled || busy) ? "not-allowed" : "pointer",
    border: "none", borderRadius: 980, padding: small ? "7px 14px" : "11px 20px",
    fontSize: small ? 13 : 15, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
    transition: "transform 0.12s ease, opacity 0.12s ease, background 0.15s ease", opacity: (disabled || busy) ? 0.55 : 1,
    width: full ? "100%" : undefined,
  };
  const variants = {
    primary: { background: "var(--ink)", color: "var(--btn-primary-fg)" },
    accent: { background: "var(--turmeric)", color: "#1d1d1f" },
    ghost: { background: "var(--surface-muted)", color: "var(--ink)" },
    danger: { background: "var(--clay)", color: "#fff" },
    outline: { background: "transparent", color: "var(--ink)", border: "1.5px solid var(--ring-strong)" },
  };
  // If the handler is async (returns a promise), the button disables
  // itself and shows a loading label until it settles, so a slow network
  // round trip can't be mistaken for "nothing happened" and tapped again
  // mid-flight. Handlers that aren't async (plain state toggles, etc.)
  // behave exactly as before -- there's nothing to wait on.
  const handleClick = (e) => {
    if (disabled || busy || !onClick) return;
    const result = onClick(e);
    if (result && typeof result.then === "function") {
      setBusy(true);
      result.finally(() => setBusy(false));
    }
  };
  return (
    <button
      onClick={handleClick}
      disabled={disabled || busy}
      style={{ ...base, ...variants[variant], ...style }}
      onMouseDown={(e) => { if (!disabled && !busy) e.currentTarget.style.transform = "scale(0.97)"; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
    >
      {busy ? (loadingText || "Loading…") : children}
    </button>
  );
}

                <input type="email" style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="rahul@example.com" />
              </Field>
              <Field label="Create a password">
                <input type="password" style={inputStyle} value={pw} onChange={(e) => setPw(e.target.value)} placeholder="At least 4 characters" />
              </Field>
              <Field label="Confirm password">
                <input type="password" style={inputStyle} value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onSignup()} placeholder="Repeat password" />
              </Field>
            </div>
            {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 8 }}>{error}</div>}
            <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
              <Btn onClick={onSignup} disabled={busy} full>Create account</Btn>
              <Btn variant="ghost" onClick={onCancel} full>Cancel</Btn>
            </div>
            <p style={{ fontSize: 13, color: "var(--muted)", marginTop: 14 }}>
              Already have an account? <button onClick={() => onSwitchMode("login")} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 13, textDecoration: "underline" }}>Log in</button> instead.
            </p>
          </>
        )}

        {mode === "forgot" && (
          <>
            {forgotSent ? (
              <>
                <p style={{ fontSize: 14, lineHeight: 1.6 }}>If an account with that email exists, we've sent a password reset link to it. Check your inbox (and spam folder) for a message from us.</p>
                <Btn full style={{ marginTop: 14 }} onClick={onCancel}>Done</Btn>
              </>
            ) : (
              <>
                <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "0 0 12px" }}>Enter the email you signed up with, and we'll send you a link to reset your password.</p>
                <Field label="Email">
                  <input autoFocus type="email" style={inputStyle} value={forgotEmail} onChange={(e) => setForgotEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onForgotSubmit()} placeholder="rahul@example.com" />
                </Field>
                {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 8 }}>{error}</div>}
                <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
                  <Btn onClick={onForgotSubmit} disabled={busy} full>Send reset link</Btn>
                  <Btn variant="ghost" onClick={() => onSwitchMode("login")} full>Back</Btn>
                </div>
              </>
            )}
          </>
        )}
      </div>
    </Modal>
  );
}

function DogsView({ dogs, setDogs, breeds, myName, myCustomerId, allAddresses, setAllAddresses, onContinue, onReadAboutBreed }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [form, setForm] = useState(null);
  const [justAdded, setJustAdded] = useState(null);

  const startNew = () => { setJustAdded(null); setForm({ id: null, name: "", breed: breeds[0]?.name || "", ageMode: "years", ageYears: 1, ageMonthsPart: 0, dob: "", weightKg: 15, activity: "medium" }); };
  const startEdit = (dog) => { setJustAdded(null); setForm({ ...dog, ageMode: dog.dob ? "dob" : "years", ageYears: Math.floor(dog.ageMonths / 12), ageMonthsPart: dog.ageMonths % 12, dob: dog.dob || "" }); };

  const save = async () => {
    if (!form.name.trim()) return;
    const usingDob = form.ageMode === "dob" && form.dob;
    const ageMonths = usingDob ? Math.max(0, monthsBetween(form.dob)) : Math.max(1, form.ageYears * 12 + form.ageMonthsPart);
    const clean = { name: form.name, breed: form.breed, weightKg: form.weightKg, activity: form.activity, ageMonths, dob: usingDob ? form.dob : "" };
    let next, savedDog;
    if (form.id) {
      next = dogs.map((d) => (d.id === form.id ? { ...d, ...clean } : d));
      savedDog = next.find((d) => d.id === form.id);
    } else {
      savedDog = { ...clean, id: uid("dog_"), owner: myName, customerId: myCustomerId, createdAt: Date.now() };
      next = [...dogs, savedDog];
    }
    setDogs(next);
    await persist(K.dogs, next);
    const wasNew = !form.id;
    setForm(null);
    if (wasNew) setJustAdded(savedDog);
  };

  const remove = async (id) => {
    const next = dogs.filter((d) => d.id !== id);
    setDogs(next);
    await persist(K.dogs, next);
  };

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="My dogs" />
      {!myName && <Card style={{ marginBottom: 16 }}><p style={{ margin: 0, fontSize: 14 }}>Sign in up top so we know whose dogs these are.</p></Card>}

      {justAdded && (
        <Card style={{ marginBottom: 16, background: "var(--tone-good-bg)", border: "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14.5, marginBottom: 12 }}>
            <Check size={16} color="var(--leaf)" />
            <b>{justAdded.name}</b> has been added.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Btn onClick={() => onContinue(justAdded.id)}>Continue to order food <ChevronRight size={15} /></Btn>
            <Btn variant="ghost" onClick={() => { setJustAdded(null); startNew(); }}>Add another dog</Btn>
          </div>
        </Card>
      )}

      <div className="responsive-grid" style={{ marginBottom: 18 }}>
        {myDogs.map((dog) => (
          <Card key={dog.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 7, display: "flex" }}>
                  <PawPrint size={16} color="#fff" />
                </div>
                <div style={{ fontFamily: "var(--font-display)", fontSize: 18, fontWeight: 600 }}>{dog.name}</div>
              </div>
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={() => startEdit(dog)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--muted)", padding: 6 }}><Pencil size={15} /></button>
                <button onClick={() => remove(dog.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--clay)", padding: 6 }}><Trash2 size={15} /></button>
              </div>
            </div>
            <div style={{ marginTop: 10, fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", lineHeight: 1.7 }}>
              <div>{dog.breed}</div>
              <div>{formatAge(effectiveAgeMonths(dog))} &middot; {dog.weightKg} kg &middot; {ACTIVITY_LABEL[dog.activity]} activity</div>
              {onReadAboutBreed && (
                <button onClick={() => onReadAboutBreed(dog.breed)} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, marginTop: 8, textDecoration: "underline" }}>
                  Read about {dog.breed} in our Community &rarr;
                </button>
              )}
            </div>
          </Card>
        ))}
        <button onClick={startNew} className="add-tile">
          <Plus size={20} />
          <span style={{ fontSize: 13.5 }}>Add a dog</span>
        </button>
      </div>

      {form && (
        <Card style={{ maxWidth: 480 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 18, marginBottom: 14, fontWeight: 600 }}>
            {form.id ? "Edit dog" : "Add a dog"}
          </div>
          <div className="form-grid-2">
            <div style={{ gridColumn: "1 / -1" }}>
              <Field label="Name"><input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Goku" /></Field>
            </div>
            <div style={{ gridColumn: "1 / -1" }}>
              <Field label="Breed">
                <select style={inputStyle} value={form.breed} onChange={(e) => setForm({ ...form, breed: e.target.value })}>
                  {breeds.filter((b) => b.available).map((b) => <option key={b.name} value={b.name}>{b.name}</option>)}
                </select>
              </Field>
            </div>
            <Field label="How old is your dog?">
              <div style={{ display: "flex", gap: 6 }}>
                <button type="button" onClick={() => setForm({ ...form, ageMode: "years" })} className={"date-chip" + (form.ageMode !== "dob" ? " active" : "")}>Age in years/months</button>
                <button type="button" onClick={() => setForm({ ...form, ageMode: "dob" })} className={"date-chip" + (form.ageMode === "dob" ? " active" : "")}>Date of birth</button>
              </div>
            </Field>
            {form.ageMode === "dob" ? (
              <Field label="Date of birth"><input type="date" max={todayStr()} style={inputStyle} value={form.dob} onChange={(e) => setForm({ ...form, dob: e.target.value })} /></Field>

              <>

                <Field label="Age &mdash; months"><input type="number" min={0} max={11} style={inputStyle} value={form.ageMonthsPart} onChange={(e) => setForm({ ...form, ageMonthsPart: Math.max(0, Math.min(11, Number(e.target.value))) })} /></Field>
              </>
            )}
            <Field label="Weight (kg)"><input type="number" min={1} step="0.5" style={inputStyle} value={form.weightKg} onChange={(e) => setForm({ ...form, weightKg: Number(e.target.value) })} /></Field>
            <Field label="Activity level">
              <select style={inputStyle} value={form.activity} onChange={(e) => setForm({ ...form, activity: e.target.value })}>
                <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
              </select>
            </Field>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
            <Btn onClick={save} disabled={!myName}>Save dog</Btn>
            <Btn variant="ghost" onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </Card>
      )}

      <div style={{ marginTop: 28 }}>
        <AddressManager myName={myName} myCustomerId={myCustomerId} allAddresses={allAddresses} setAllAddresses={setAllAddresses} />
      </div>
    </div>
  );
}

function ProfileView({ myName, setMyName, myCustomerId, dogs, setDogs, orders, setOrders, communityPosts, setCommunityPosts, allAddresses, setAllAddresses, onMyPhoneChange, onMyPhotoChange, onGoToDogs }) {
  const [rec, setRec] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [draftName, setDraftName] = useState("");
  const [editingPhone, setEditingPhone] = useState(false);
  const [draftPhone, setDraftPhone] = useState("");
  const [editingEmail, setEditingEmail] = useState(false);
  const [draftEmail, setDraftEmail] = useState("");
  const [error, setError] = useState("");
  const [photoWarning, setPhotoWarning] = useState("");
  const photoFileRef = useRef(null);

  useEffect(() => {
    (async () => {
      if (!myName) { setRec(null); setLoaded(true); return; }
      const r = await getCustomerRecord(myName);
      setRec(r);
      setLoaded(true);
    })();
  }, [myName]);

  const saveField = async (patch) => {
    const next = { ...rec, ...patch };
    await window.storage.set(customerKey(myName), JSON.stringify(next), true);
    setRec(next);
  };

  const savePhone = async () => {
    const cleaned = draftPhone.trim();
    await saveField({ phone: cleaned });
    onMyPhoneChange?.(cleaned);
    setEditingPhone(false);
  };
  const saveEmail = async () => {
    const trimmed = draftEmail.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) { setError("Enter a valid email address."); return; }
    setError("");
    await saveField({ email: trimmed });
    setEditingEmail(false);
  };

  const onPhotoFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const dataUrl = reader.result;
      if (dataUrl.length > 1_000_000) {
        setPhotoWarning("That photo is too large -- try a smaller or more compressed image (roughly under 700KB works well).");
        if (photoFileRef.current) photoFileRef.current.value = "";
        return;
      }
      setPhotoWarning("");
      await saveField({ photoDataUrl: dataUrl });
      onMyPhotoChange?.(dataUrl);
    };
    reader.readAsDataURL(file);
  };
  const removePhoto = async () => {
    await saveField({ photoDataUrl: "" });
    onMyPhotoChange?.("");
  };

  // Renaming is safe now that every entity has a real customerId: the
  // account record just moves to a new key, and every existing dog/order/
  // Community post this customer owns gets its cached display name
  // refreshed to match -- found by customerId, not by the old name.
  const saveName = async () => {
    const newName = draftName.trim();
    if (!newName) { setError("Enter a name."); return; }
    if (newName.toLowerCase() === myName.trim().toLowerCase()) { setEditingName(false); return; }
    setError("");
    try {
      const existing = await window.storage.get(customerKey(newName), true);
      if (existing?.value) { setError("That name is already taken."); return; }
    } catch {
      // not found -- exactly what we want, fall through
    }

    const nextRec = { ...rec, name: newName };
    await window.storage.set(customerKey(newName), JSON.stringify(nextRec), true);
    await window.storage.delete(customerKey(myName), true);

    const nextDogs = dogs.map((d) => (d.customerId === myCustomerId ? { ...d, owner: newName } : d));
    setDogs(nextDogs);
    await persist(K.dogs, nextDogs);

    const nextOrders = orders.map((o) => (o.customerId === myCustomerId ? { ...o, customerName: newName } : o));
    setOrders(nextOrders);
    await persist(K.orders, nextOrders);

    const nextPosts = communityPosts.map((p) => (p.authorId === myCustomerId ? { ...p, authorName: newName } : p));
    setCommunityPosts(nextPosts);
    await persist(K.communityPosts, nextPosts);

    setRec(nextRec);
    setMyName(newName);
    window.storage.set("dfp:session", JSON.stringify({ name: newName }), false).catch(() => {});
    setEditingName(false);
  };

  if (!myName) return <div><SectionTitle eyebrow="Customer" title="Your profile" /><Card><p style={{ margin: 0 }}>Sign in up top to view your profile.</p></Card></div>;
  if (!loaded) return null;

  const myDogCount = dogs.filter((d) => d.customerId === myCustomerId).length;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Your profile" sub="The single place to manage your details -- everything here is reused automatically wherever it's needed, so you won't be asked again." />

      <Card style={{ maxWidth: 480, marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          {rec?.photoDataUrl ? (
            <img src={rec.photoDataUrl} alt="" style={{ width: 64, height: 64, borderRadius: "50%", objectFit: "cover", flexShrink: 0 }} />
          ) : (
            <div style={{ width: 64, height: 64, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 24, flexShrink: 0, background: avatarColorFor(myName) }}>
              {(myName || "?").trim().charAt(0).toUpperCase()}
            </div>
          )}
          <div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Btn small variant="ghost" onClick={() => photoFileRef.current?.click()}><Upload size={13} /> {rec?.photoDataUrl ? "Change photo" : "Add a photo"}</Btn>
              {rec?.photoDataUrl && <Btn small variant="ghost" onClick={removePhoto}><Trash2 size={13} /> Remove</Btn>}
            </div>
            {photoWarning && <div style={{ color: "var(--clay)", fontSize: 12.5, marginTop: 8 }}>{photoWarning}</div>}
          </div>
          <input ref={photoFileRef} type="file" accept="image/*" onChange={onPhotoFile} style={{ display: "none" }} />
        </div>
      </Card>

      <Card style={{ maxWidth: 480, marginBottom: 20 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Name</div>
            {editingName ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftName} onChange={(e) => setDraftName(e.target.value)} autoFocus />
                <Btn small onClick={saveName}>Save</Btn>
                <Btn small variant="ghost" onClick={() => { setEditingName(false); setError(""); }}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 16, fontWeight: 600 }}>{myName}</span>
                <button onClick={() => { setDraftName(myName); setEditingName(true); setError(""); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>

          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Phone</div>
            {editingPhone ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftPhone} onChange={(e) => setDraftPhone(e.target.value)} autoFocus />
                <Btn small onClick={savePhone}>Save</Btn>
                <Btn small variant="ghost" onClick={() => setEditingPhone(false)}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 16 }}>{rec?.phone || <span style={{ color: "var(--muted)" }}>Not set</span>}</span>
                <button onClick={() => { setDraftPhone(rec?.phone || ""); setEditingPhone(true); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>

          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Email</div>
            {editingEmail ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input type="email" style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftEmail} onChange={(e) => setDraftEmail(e.target.value)} autoFocus />
                <Btn small onClick={saveEmail}>Save</Btn>
                <Btn small variant="ghost" onClick={() => { setEditingEmail(false); setError(""); }}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontSize: 16 }}>{rec?.email || <span style={{ color: "var(--muted)" }}>Not set — add one to enable password reset</span>}</span>
                <button onClick={() => { setDraftEmail(rec?.email || ""); setEditingEmail(true); setError(""); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>
          {error && <div style={{ color: "var(--clay)", fontSize: 13 }}>{error}</div>}
        </div>
      </Card>

      <Card style={{ maxWidth: 480, marginBottom: 20 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 6 }}>Your dogs</div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 10 }}>{myDogCount} dog{myDogCount === 1 ? "" : "s"} on file.</p>
        <Btn small variant="ghost" onClick={onGoToDogs}>Manage your dogs</Btn>
      </Card>

      <AddressManager myName={myName} myCustomerId={myCustomerId} allAddresses={allAddresses} setAllAddresses={setAllAddresses} />
    </div>
  );
}

const COMMUNITY_IMAGE_CAP = 1_000_000; // ~1MB per image, base64 text length
const COMMUNITY_MAX_IMAGES = 5;
const BREED_ALL = "All Breeds / General";

function LoginPromptModal({ action, onOpenAuth, onClose }) {
  return (
    <Modal onCancel={onClose} maxWidth={380}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>

        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18 }}>Sign in to continue</div>
      </div>
      <p style={{ fontSize: 14, color: "var(--muted)", marginBottom: 18 }}>You'll need an account to {action}. It only takes a moment.</p>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn full onClick={() => onOpenAuth("login")}>Log in</Btn>
        <Btn full variant="ghost" onClick={() => onOpenAuth("signup")}>Sign up</Btn>
      </div>

function CommunityImageLightbox({ images, startIndex, onClose }) {
  const [idx, setIdx] = useState(startIndex || 0);
  if (!images || images.length === 0) return null;
  return (
    <Modal onCancel={onClose} maxWidth={640}>
      <img src={images[idx]} alt="" style={{ width: "100%", maxHeight: "65vh", objectFit: "contain", borderRadius: 12, background: "var(--surface-muted)", display: "block" }} />
      {images.length > 1 && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
          <Btn small variant="ghost" onClick={() => setIdx((i) => (i - 1 + images.length) % images.length)}>&larr; Prev</Btn>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{idx + 1} / {images.length}</span>
          <Btn small variant="ghost" onClick={() => setIdx((i) => (i + 1) % images.length)}>Next &rarr;</Btn>
        </div>
      )}
      <Btn full variant="ghost" style={{ marginTop: 14 }} onClick={onClose}>Close</Btn>
    </Modal>
  );
}

function CommunityAttachmentPicker({ attachments, setAttachments, setWarning }) {
  const fileRef = useRef(null);
  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (attachments.length >= COMMUNITY_MAX_IMAGES) {
      setWarning(`You can add up to ${COMMUNITY_MAX_IMAGES} attachments per post.`);
      if (fileRef.current) fileRef.current.value = "";
      return;
    }
    const isPdf = file.type === "application/pdf";
    const isImage = file.type.startsWith("image/");
    if (!isPdf && !isImage) {
      setWarning("Only images and PDF files are supported.");
      if (fileRef.current) fileRef.current.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if (dataUrl.length > COMMUNITY_IMAGE_CAP) {
        setWarning(`That file is too large -- try something under ${isPdf ? "a couple MB" : "700KB"}.`);
        if (fileRef.current) fileRef.current.value = "";
        return;
      }
      setWarning("");
      setAttachments([...attachments, { dataUrl, type: isPdf ? "pdf" : "image", name: file.name }]);
      if (fileRef.current) fileRef.current.value = "";
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        {attachments.map((att, i) => (
          <div key={i} style={{ position: "relative", width: 72, height: 72 }}>
            {att.type === "pdf" ? (
              <div style={{ width: "100%", height: "100%", borderRadius: 10, background: "var(--surface-muted)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, padding: 4 }}>
                <FileText size={22} color="var(--muted)" />
                <span style={{ fontSize: 9, color: "var(--muted)", textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }}>{att.name}</span>
              </div>
            ) : (
              <img src={att.dataUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: 10, display: "block" }} />
            )}
            <button onClick={() => setAttachments(attachments.filter((_, idx) => idx !== i))} style={{ position: "absolute", top: -6, right: -6, background: "var(--clay)", color: "#fff", border: "none", borderRadius: "50%", width: 20, height: 20, cursor: "pointer", fontSize: 12, lineHeight: 1 }}>&times;</button>
          </div>
        ))}
      </div>
      {attachments.length < COMMUNITY_MAX_IMAGES && (
        <Btn small variant="ghost" onClick={() => fileRef.current?.click()}><ImageIcon size={13} /> Add photo or PDF ({attachments.length}/{COMMUNITY_MAX_IMAGES})</Btn>
      )}
      <input ref={fileRef} type="file" accept="image/*,application/pdf" onChange={onFile} style={{ display: "none" }} />
    </div>
  );
}

function CreatePostForm({ myName, dogs, topics, onSubmit, onCancel }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [title, setTitle] = useState("");
  const [content, setContent] = useState("");
  const [topic, setTopic] = useState(topics[0]?.name || "");
  const [breed, setBreed] = useState(BREED_ALL);
  const [dogDetails, setDogDetails] = useState("");
  const [attachments, setAttachments] = useState([]);
  const [warning, setWarning] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const submit = async () => {
    if (!title.trim()) { setWarning("Add a title for your post."); return; }
    if (!content.trim() && attachments.length === 0) { setWarning("Add some writing, at least one photo or PDF, or both."); return; }
    setWarning("");
    setSubmitting(true);
    await onSubmit({ title: title.trim(), content: content.trim(), topic, breed, dogDetails: dogDetails.trim(), attachments });
    setSubmitting(false);
  };

  return (
    <Card style={{ maxWidth: 560 }}>
      <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 4 }}>Share with the Community</div>
      <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 16 }}>Your post is reviewed by us before it goes public -- usually quick.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="Title"><input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="What Sandy taught me about crate training" /></Field>
        <Field label="Your writing (optional if you're just sharing photos)">
          <textarea style={{ ...inputStyle, minHeight: 120, resize: "vertical" }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="Share your experience, a tip, or something you learned..." />
        </Field>
        <div className="form-grid-2">
          <Field label="Topic">
            <select style={inputStyle} value={topic} onChange={(e) => setTopic(e.target.value)}>
              {topics.map((t) => <option key={t.id} value={t.name}>{t.name}</option>)}
            </select>
          </Field>
          <Field label="Dog breed">
            <select style={inputStyle} value={breed} onChange={(e) => setBreed(e.target.value)}>
              <option value={BREED_ALL}>{BREED_ALL}</option>
              {myDogs.map((d) => <option key={d.id} value={d.breed}>{d.breed} ({d.name})</option>)}
            </select>
          </Field>
        </div>
        <Field label="Relevant dog details (optional)"><input style={inputStyle} value={dogDetails} onChange={(e) => setDogDetails(e.target.value)} placeholder="e.g. 8 months old, high energy" /></Field>
        <Field label="Photos or PDFs (optional, up to 5)"><CommunityAttachmentPicker attachments={attachments} setAttachments={setAttachments} setWarning={setWarning} /></Field>
      </div>
      {warning && <p style={{ fontSize: 13, color: "var(--clay)", marginTop: 10 }}>{warning}</p>}
      <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
        <Btn onClick={submit} disabled={submitting} loadingText="Submitting…">Submit for review</Btn>
        <Btn variant="ghost" onClick={onCancel}>Cancel</Btn>
      </div>
    </Card>
  );
}

const AVATAR_COLORS = ["#5b8a72", "#c17a4f", "#5b7a9a", "#9a5b7a", "#8a7a5b", "#5b9a8f"];
function avatarColorFor(name) {
  const s = String(name || "");
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

  const images = (post.attachments || []).filter((a) => a.type !== "pdf");
  const initial = (post.authorName || "?").trim().charAt(0).toUpperCase();
  return (
    <div className="insta-post" onClick={() => onOpen(post.id)}>
      <div className="insta-post-header">
        {post.authorPhoto ? (
          <img src={post.authorPhoto} alt="" className="insta-avatar" style={{ objectFit: "cover" }} />
        ) : (
          <div className="insta-avatar" style={{ background: avatarColorFor(post.authorName) }}>{initial}</div>
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="insta-username">{post.authorName}</div>
          <div className="insta-post-meta">
            {post.topic}{post.breed && post.breed !== BREED_ALL ? ` · ${post.breed}` : ""}
          </div>
        </div>
      </div>

      {images.length > 0 ? (
        <div className="insta-image-wrap">
          <img src={images[0].dataUrl} alt="" />
          {images.length > 1 && <span className="insta-multi-badge"><ImageIcon size={11} /> {images.length}</span>}
        </div>

        </div>
      )}

      <div className="insta-actions">
        <span><Heart size={20} /> {post.likeCount || 0}</span>
        <span><MessageCircle size={20} /> {post.commentCount || 0}</span>
        <span style={{ marginLeft: "auto" }}><Share2 size={18} /></span>

      <div className="insta-caption">

}

function CommunityPostDetail({ post, allPosts, comments, likes, myName, myCustomerId, config, onBack, onOpenPost, onRequireLogin, onToggleLike, onAddComment, onFilterBreed, onDeletePost }) {
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [commentText, setCommentText] = useState("");
  const [viewingImages, setViewingImages] = useState(null);
  const [shareCopied, setShareCopied] = useState(false);

  const postComments = comments.filter((c) => c.postId === post.id).sort((a, b) => a.createdAt - b.createdAt);
  const iLiked = myCustomerId && likes.some((l) => l.postId === post.id && l.userId === myCustomerId);

  const related = allPosts
    .filter((p) => p.id !== post.id && p.status === "approved")
    .map((p) => ({ post: p, score: (p.breed === post.breed && post.breed !== BREED_ALL ? 2 : 0) + (p.topic === post.topic ? 1 : 0) }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3)
    .map((x) => x.post);

  const postUrl = () => `${window.location.origin}${window.location.pathname}?post=${post.id}`;

  const share = async () => {
    const url = postUrl();
    const shareData = { title: post.title, text: post.content ? post.content.slice(0, 140) : post.title, url };
    if (navigator.share) {
      try { await navigator.share(shareData); return; } catch { /* cancelled or unsupported mid-flow -- fall through to copy */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      setShareCopied(true);
      setTimeout(() => setShareCopied(false), 2500);
    } catch {}
  };

  const submitComment = async () => {
    if (!myName) { onRequireLogin("comment"); return; }
    if (!commentText.trim()) return;
    await onAddComment(post.id, commentText.trim());
    setCommentText("");
  };

  const clickLike = () => {
    if (!myName) { onRequireLogin("like this post"); return; }
    onToggleLike(post.id);
  };

  const postImages = (post.attachments || []).filter((a) => a.type !== "pdf");
  const postPdfs = (post.attachments || []).filter((a) => a.type === "pdf");

  return (
    <div>
      {viewingImages !== null && <CommunityImageLightbox images={postImages.map((a) => a.dataUrl)} startIndex={viewingImages} onClose={() => setViewingImages(null)} />}
      <Btn small variant="ghost" onClick={onBack} style={{ marginBottom: 14 }}>&larr; Back to Community</Btn>

      <Card style={{ maxWidth: 640 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          <Pill>{post.topic}</Pill>
          {post.breed && post.breed !== BREED_ALL && (
            <button onClick={() => onFilterBreed(post.breed)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
              <Pill tone="good">{post.breed}</Pill>
            </button>
          )}
        </div>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 26, marginBottom: 8 }}>{post.title}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
          {post.authorPhoto ? (
            <img src={post.authorPhoto} alt="" style={{ width: 24, height: 24, borderRadius: "50%", objectFit: "cover" }} />
          ) : (
            <div style={{ width: 24, height: 24, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 11, background: avatarColorFor(post.authorName) }}>
              {(post.authorName || "?").trim().charAt(0).toUpperCase()}
            </div>
          )}
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)" }}>
            By {post.authorName} &middot; {fmtDateLabel(toDateStr(new Date(post.createdAt)))}
            {post.updatedAt && post.updatedAt !== post.createdAt && <> &middot; edited</>}
          </div>
        </div>

        {post.dogDetails && (
          <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 14, fontStyle: "italic" }}>{post.dogDetails}</div>
        )}

        {postImages.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: postImages.length === 1 ? "1fr" : "repeat(auto-fill, minmax(140px, 1fr))", gap: 8, marginBottom: 16 }}>
            {postImages.map((att, i) => (
              <img key={i} src={att.dataUrl} alt="" onClick={() => setViewingImages(i)} style={{ width: "100%", borderRadius: 12, cursor: "pointer", display: "block", maxHeight: postImages.length === 1 ? 420 : 180, objectFit: "cover" }} />
            ))}
          </div>
        )}

        {postPdfs.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
            {postPdfs.map((att, i) => (
              <a key={i} href={att.dataUrl} target="_blank" rel="noopener noreferrer" style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: "var(--surface-muted)", borderRadius: 12, textDecoration: "none", color: "var(--ink)" }}>
                <FileText size={18} color="var(--muted)" />
                <span style={{ fontSize: 13.5, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{att.name}</span>
                <span style={{ fontSize: 12, color: "var(--leaf)" }}>View</span>
              </a>
            ))}
          </div>
        )}

        {post.content && <p style={{ fontSize: 15, lineHeight: 1.7, whiteSpace: "pre-wrap", marginBottom: 20 }}>{post.content}</p>}

        <div style={{ display: "flex", gap: 10, paddingTop: 16, borderTop: "1px solid var(--ring)", flexWrap: "wrap" }}>
          <Btn small variant={iLiked ? "accent" : "ghost"} onClick={clickLike}>&hearts; {post.likeCount || 0}</Btn>
          <Btn small variant="ghost" onClick={share}>{shareCopied ? "Link copied!" : <><Link2 size={13} /> Share</>}</Btn>
          {myCustomerId && post.authorId === myCustomerId && (
            confirmingDelete ? (
              <>
                <Btn small variant="danger" onClick={() => onDeletePost(post.id)}><Trash2 size={13} /> Yes, delete it</Btn>
                <Btn small variant="ghost" onClick={() => setConfirmingDelete(false)}>Cancel</Btn>
              </>
            ) : (
              <Btn small variant="ghost" onClick={() => setConfirmingDelete(true)}><Trash2 size={13} /> Delete post</Btn>
            )
          )}
        </div>
      </Card>

      <Card style={{ maxWidth: 640, marginTop: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 14 }}>Comments ({postComments.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 16 }}>
          {postComments.length === 0 ? (
            <p style={{ fontSize: 13.5, color: "var(--muted)", margin: 0 }}>No comments yet -- be the first to share your thoughts.</p>
          ) : postComments.map((c) => (
            <div key={c.id} style={{ display: "flex", gap: 8 }}>
              {c.userPhoto ? (
                <img src={c.userPhoto} alt="" style={{ width: 26, height: 26, borderRadius: "50%", objectFit: "cover", flexShrink: 0, marginTop: 1 }} />
              ) : (
                <div style={{ width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 11.5, flexShrink: 0, marginTop: 1, background: avatarColorFor(c.userName) }}>
                  {(c.userName || "?").trim().charAt(0).toUpperCase()}
                </div>
              )}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
                  <b>{c.userName}</b>
                  <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{fmtDateTime(c.createdAt)}</span>
                </div>
                <div style={{ fontSize: 14 }}>{c.text}</div>
              </div>
            </div>
          ))}
        </div>
        {myName ? (
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...inputStyle, flex: 1 }} value={commentText} onChange={(e) => setCommentText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitComment()} placeholder="Add a comment..." />
            <Btn small onClick={submitComment}>Post</Btn>
          </div>
        ) : (
          <Btn small variant="ghost" onClick={() => onRequireLogin("comment")}>Sign in to comment</Btn>
        )}
      </Card>

      {related.length > 0 && (
        <div style={{ marginTop: 24, maxWidth: 640 }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>
            {post.breed !== BREED_ALL ? `More ${post.breed} Community posts` : "Related posts"}
          </div>
          <div className="responsive-grid">
            {related.map((p) => <CommunityPostCard key={p.id} post={p} onOpen={() => onOpenPost(p.id)} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function CommunityView({ myName, myCustomerId, myPhoto, dogs, breeds, config, communityTopics, communityPosts, setCommunityPosts, communityComments, setCommunityComments, communityLikes, setCommunityLikes, communityLoaded, initialPostId, initialBreedFilter, onConsumeInitialPost, onConsumeInitialBreedFilter, onOpenAuth }) {
  const [view, setView] = useState("list"); // list | post | create
  const [openPostId, setOpenPostId] = useState(null);
  const [topicFilter, setTopicFilter] = useState("");
  const [breedFilter, setBreedFilter] = useState("");
  const [showMine, setShowMine] = useState(false);
  const [loginPrompt, setLoginPrompt] = useState(null); // string action label, or null

  useEffect(() => {
    if (initialPostId) {
      setOpenPostId(initialPostId);
      setView("post");
      onConsumeInitialPost?.();
    }
  }, [initialPostId]);

  useEffect(() => {
    if (initialBreedFilter) {
      setBreedFilter(initialBreedFilter);
      setView("list");
      onConsumeInitialBreedFilter?.();
    }
  }, [initialBreedFilter]);

  const activeTopics = communityTopics.filter((t) => t.active !== false);
  const approved = communityPosts.filter((p) => p.status === "approved");
  const mine = communityPosts.filter((p) => p.authorId === myCustomerId);

  const visible = (showMine ? mine : approved)
    .filter((p) => !topicFilter || p.topic === topicFilter)
    .filter((p) => !breedFilter || p.breed === breedFilter)
    .sort((a, b) => b.createdAt - a.createdAt);

  const openPost = (id) => { setOpenPostId(id); setView("post"); };
  const backToList = () => { setView("list"); setOpenPostId(null); };
  const requireLogin = (action) => setLoginPrompt(action);

  const startCreate = () => {
    if (!myName) { requireLogin("share a Community post"); return; }
    setView("create");
  };

  const submitPost = async (draft) => {
    const entry = {
      id: uid("post_"), authorId: myCustomerId, authorName: myName, authorPhoto: myPhoto || "",
      title: draft.title, content: draft.content, topic: draft.topic, breed: draft.breed, dogDetails: draft.dogDetails,
      attachments: draft.attachments, createdAt: Date.now(), updatedAt: null, status: "pending", likeCount: 0, commentCount: 0,
    };
    const next = [...communityPosts, entry];
    setCommunityPosts(next);
    await persist(K.communityPosts, next);
    setView("list");
    setShowMine(true);
  };

  const toggleLike = (postId) => {
    const existing = communityLikes.find((l) => l.postId === postId && l.userId === myCustomerId);
    const nextLikes = existing
      ? communityLikes.filter((l) => l.id !== existing.id)
      : [...communityLikes, { id: uid("like_"), postId, userId: myCustomerId, createdAt: Date.now() }];
    const nextPosts = communityPosts.map((p) => (p.id === postId ? { ...p, likeCount: Math.max(0, (p.likeCount || 0) + (existing ? -1 : 1)) } : p));
    // Both update instantly -- persisting happens in the background so a
    // like feels immediate instead of waiting on two network round trips.
    setCommunityLikes(nextLikes);
    setCommunityPosts(nextPosts);
    persist(K.communityLikes, nextLikes).catch(() => {});
    persist(K.communityPosts, nextPosts).catch(() => {});
  };

  const addComment = async (postId, text) => {
    const entry = { id: uid("comment_"), postId, userId: myCustomerId, userName: myName, userPhoto: myPhoto || "", text, createdAt: Date.now(), updatedAt: null, status: "visible" };
    const nextComments = [...communityComments, entry];
    const nextPosts = communityPosts.map((p) => (p.id === postId ? { ...p, commentCount: (p.commentCount || 0) + 1 } : p));
    setCommunityComments(nextComments);
    setCommunityPosts(nextPosts);
    await persist(K.communityComments, nextComments);
    await persist(K.communityPosts, nextPosts);
  };

  const filterByBreed = (breed) => { setBreedFilter(breed); setShowMine(false); backToList(); };

  const deletePost = async (postId) => {
    const nextPosts = communityPosts.filter((p) => p.id !== postId);
    setCommunityPosts(nextPosts);
    await persist(K.communityPosts, nextPosts);
    const nextComments = communityComments.filter((c) => c.postId !== postId);
    setCommunityComments(nextComments);
    await persist(K.communityComments, nextComments);
    const nextLikes = communityLikes.filter((l) => l.postId !== postId);
    setCommunityLikes(nextLikes);
    await persist(K.communityLikes, nextLikes);
    backToList();
  };

  const openPostObj = openPostId ? communityPosts.find((p) => p.id === openPostId) : null;

  if (!communityLoaded) {
    return <div><SectionTitle eyebrow="Community" title="Community" /><LoadingScreen /></div>;
  }

  return (
    <div>
      {loginPrompt && (
        <LoginPromptModal
          action={loginPrompt}
          onOpenAuth={(mode) => { setLoginPrompt(null); onOpenAuth(mode); }}
          onClose={() => setLoginPrompt(null)}
        />
      )}

      {view === "create" ? (
        <CreatePostForm myName={myName} dogs={dogs} topics={activeTopics} onSubmit={submitPost} onCancel={backToList} />
      ) : view === "post" && openPostObj ? (
        <CommunityPostDetail
          post={openPostObj} allPosts={communityPosts} comments={communityComments} likes={communityLikes}
          myName={myName} myCustomerId={myCustomerId} config={config}
          onBack={backToList} onOpenPost={openPost} onRequireLogin={requireLogin}
          onToggleLike={toggleLike} onAddComment={addComment} onFilterBreed={filterByBreed} onDeletePost={deletePost}
        />
      ) : (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
            <SectionTitle eyebrow="Community" title="Community" sub="Discover real experiences, helpful tips, training advice, and breed-specific knowledge shared by dog owners." />
            <Btn onClick={startCreate}><Plus size={15} /> Share a post</Btn>
          </div>

          <Card style={{ marginBottom: 18 }}>
            <div className="form-grid-2">
              <Field label="Topic">
                <select style={inputStyle} value={topicFilter} onChange={(e) => setTopicFilter(e.target.value)}>
                  <option value="">All topics</option>
                  {activeTopics.map((t) => <option key={t.id} value={t.name}>{t.name}</option>)}
                </select>
              </Field>
              <Field label="Dog breed">
                <select style={inputStyle} value={breedFilter} onChange={(e) => setBreedFilter(e.target.value)}>
                  <option value="">All breeds</option>
                  <option value={BREED_ALL}>{BREED_ALL}</option>
                  {breeds.map((b) => <option key={b.name} value={b.name}>{b.name}</option>)}
                </select>
              </Field>
            </div>
            {myName && (
              <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
                <button onClick={() => setShowMine(false)} className={"date-chip" + (!showMine ? " active" : "")}>Community</button>
                <button onClick={() => setShowMine(true)} className={"date-chip" + (showMine ? " active" : "")}>My posts</button>
              </div>
            )}
          </Card>

          {visible.length === 0 ? (
            <Card><p style={{ margin: 0, color: "var(--muted)" }}>{showMine ? "You haven't posted anything yet." : "No posts match these filters yet -- be the first to share one!"}</p></Card>
          ) : (
            <div className="insta-feed">
              {visible.map((p) => (
                <div key={p.id} style={{ position: "relative" }}>
                  <CommunityPostCard post={p} onOpen={openPost} />
                  {showMine && p.status !== "approved" && (
                    <div style={{ position: "absolute", top: 10, right: 10 }}>
                      <Pill tone={p.status === "rejected" ? "bad" : "warn"}>{p.status === "rejected" ? "Not approved" : "Pending review"}</Pill>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function AddressManager({ myName, myCustomerId, allAddresses, setAllAddresses }) {
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [geoError, setGeoError] = useState("");

  const loaded = !!myCustomerId;
  const addresses = allAddresses.filter((a) => a.customerId === myCustomerId);

  const persistAddresses = async (next) => {
    // Only ever touch this customer's own rows -- everyone else's addresses
    // pass through untouched, since this writes back the FULL collection.
    const others = allAddresses.filter((a) => a.customerId !== myCustomerId);
    const combined = [...others, ...next];
    setAllAddresses(combined);
    await persist(K.addresses, combined);
  };

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setGeoError(""); };
  const useDeviceLocation = () => {
    setGeoError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setGeoError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => { setGeoError("Couldn't access your location — you can enter coordinates manually below instead."); setGeoBusy(false); },
      { timeout: 8000 }
    );
  };

  const saveNew = async () => {
    if (!form.label.trim() || !form.address.trim()) { setGeoError("Add a label and the address."); return; }
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { setGeoError("Add coordinates — use the location button or enter them manually."); return; }
    const entry = { id: uid("addr_"), customerId: myCustomerId, label: form.label.trim(), address: form.address.trim(), lat, lng, isDefault: addresses.length === 0, createdAt: Date.now() };
    await persistAddresses([...addresses, entry]);
    setForm(null);
  };

  const remove = async (id) => {
    const wasDefault = addresses.find((a) => a.id === id)?.isDefault;
    let next = addresses.filter((a) => a.id !== id);
    // If the default address gets removed, hand default status to whatever's left, so there's never a moment with no default and more than one address.
    if (wasDefault && next.length > 0 && !next.some((a) => a.isDefault)) {
      next = next.map((a, i) => (i === 0 ? { ...a, isDefault: true } : a));
    }
    await persistAddresses(next);
  };

  const setDefault = async (id) => {
    await persistAddresses(addresses.map((a) => ({ ...a, isDefault: a.id === id })));
  };

  if (!myName) return null;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Delivery addresses" sub="Save an address once, then it's picked automatically when you order. Mark whichever one you use most as your default." />
      <div className="responsive-grid" style={{ marginBottom: 18 }}>
        {loaded && addresses.map((a) => (
          <Card key={a.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 7, display: "flex" }}><MapPin size={16} color="#fff" /></div>
                <div style={{ fontFamily: "var(--font-display)", fontSize: 17, fontWeight: 600 }}>{a.label}</div>
              </div>
              <button onClick={() => remove(a.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--clay)", padding: 6 }}><Trash2 size={15} /></button>
            </div>
            <div style={{ marginTop: 8, fontSize: 13.5, color: "var(--ink)" }}>{a.address}</div>
            <div style={{ marginTop: 6, fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{a.lat.toFixed(4)}, {a.lng.toFixed(4)}</div>
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed var(--ring-strong)" }}>
              {a.isDefault ? <Pill tone="good">Default</Pill> : <button onClick={() => setDefault(a.id)} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Set as default</button>}
            </div>
          </Card>
        ))}
        {loaded && (
          <button onClick={startNew} className="add-tile">
            <Plus size={20} />
            <span style={{ fontSize: 13.5 }}>Add an address</span>
          </button>
        )}
      </div>

      {form && (
        <Card style={{ maxWidth: 460 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 18, marginBottom: 14, fontWeight: 600 }}>Add an address</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="Label"><input style={inputStyle} value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="Home" /></Field>
            <Field label="Address"><input style={inputStyle} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} placeholder="Flat 4B, 12 MG Road, Bengaluru" /></Field>
            <div>
              <Btn small variant="ghost" onClick={useDeviceLocation} disabled={geoBusy}><Navigation size={13} /> {geoBusy ? "Locating…" : "Use my current location"}</Btn>
            </div>
            <div className="form-grid-2">
              <Field label="Latitude"><input style={inputStyle} value={form.lat} onChange={(e) => setForm({ ...form, lat: e.target.value })} placeholder="12.9716" /></Field>
              <Field label="Longitude"><input style={inputStyle} value={form.lng} onChange={(e) => setForm({ ...form, lng: e.target.value })} placeholder="77.5946" /></Field>
            </div>
          </div>
          {geoError && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{geoError}</div>}
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <Btn onClick={saveNew}>Save address</Btn>
            <Btn variant="ghost" onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}
