/* ============================================================================
   ADMIN: Data (customer directory + exports/backup)
   A browser page can't read or write arbitrary files on disk on its own --
   that's a security boundary, not a limitation of this app. What it *can*
   do, which covers the same need, is generate a real file for you to save
   (CSV/JSON) and read one back in. Everything below is otherwise already
   durably saved as it's created -- this tab is about getting it out as a
   file you can open, back up, or move to another browser.
   ========================================================================= */

function downloadTextFile(filename, mime, text) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCsvValue(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows, columns) {
  const header = columns.map((c) => toCsvValue(c.label)).join(",");
  const body = rows.map((r) => columns.map((c) => toCsvValue(c.get(r))).join(",")).join("\n");
  return header + "\n" + body;
}

function AdminData({ orders, dogs, audit, logAudit }) {
  const [customers, setCustomers] = useState(null);
  const [loadingCustomers, setLoadingCustomers] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [testResult, setTestResult] = useState(null);
  const [testing, setTesting] = useState(false);
  const fileRef = useRef(null);

  const testConnection = async () => {
    setTesting(true); setTestResult(null);
    const backend = typeof window !== "undefined" ? window.__STORAGE_BACKEND__ : undefined;
    if (backend !== "sheets") {
      setTestResult({ ok: null, message: "Not using Google Sheets right now — nothing to test. Set SHEETS_API_URL in the HTML file to connect one." });
      setTesting(false);
      return;
    }
    try {
      const res = await window.storage.list("", true);
      setTestResult({ ok: true, message: `Connected successfully — found ${res?.keys?.length ?? 0} stored key(s) in the sheet.` });
    } catch (err) {
      setTestResult({ ok: false, message: String(err?.message || err || "Unknown error") });
    }
    setTesting(false);
  };

  const loadCustomers = async () => {
    setLoadingCustomers(true);
    try {
      const list = await window.storage.list("dfp:customer:", true);
      const recs = await Promise.all(
        (list?.keys || []).map(async (k) => {
          try {
            const r = await window.storage.get(k, true);
            return JSON.parse(r.value);
          } catch { return null; }
        })
      );
      setCustomers(recs.filter(Boolean).sort((a, b) => a.name.localeCompare(b.name)));
    } catch {
      setCustomers([]);
    }
    setLoadingCustomers(false);
  };

  useEffect(() => { loadCustomers(); }, []);

  const exportCustomersCsv = () => {
    if (!customers) return;
    const csv = toCsv(customers, [
      { label: "Name", get: (c) => c.name },
      { label: "Account created", get: (c) => new Date(c.createdAt).toLocaleString() },
      { label: "Dogs", get: (c) => dogs.filter((d) => d.owner === c.name).length },
      { label: "Orders", get: (c) => orders.filter((o) => o.customerName === c.name).length },
    ]);
    downloadTextFile("customers.csv", "text/csv", csv);
  };
  const exportOrdersCsv = () => {
    const csv = toCsv(orders, [
      { label: "Order ID", get: (o) => o.id },
      { label: "Customer", get: (o) => o.customerName },
      { label: "Dog", get: (o) => o.dogSnapshot.name },
      { label: "Date", get: (o) => o.date },
      { label: "Session", get: (o) => o.session },
      { label: "Status", get: (o) => o.status },
      { label: "Food total", get: (o) => o.foodTotal ?? "" },
      { label: "Delivery fee", get: (o) => o.deliveryFee ?? 0 },
      { label: "Total", get: (o) => o.totalPrice },
      { label: "Address label", get: (o) => o.customerAddress?.label ?? "" },
      { label: "Address", get: (o) => o.customerAddress?.address ?? "" },
      { label: "Latitude", get: (o) => o.customerAddress?.lat ?? "" },
      { label: "Longitude", get: (o) => o.customerAddress?.lng ?? "" },
      { label: "Placed at", get: (o) => new Date(o.createdAt).toLocaleString() },
      { label: "Delivered at", get: (o) => (o.deliveredAt ? new Date(o.deliveredAt).toLocaleString() : "") },
    ]);
    downloadTextFile("orders.csv", "text/csv", csv);
  };
  const exportAuditCsv = () => {
    const csv = toCsv(audit, [
      { label: "Timestamp", get: (a) => new Date(a.ts).toLocaleString() },
      { label: "Details", get: (a) => a.details },
    ]);
    downloadTextFile("audit-log.csv", "text/csv", csv);
  };

  const exportAllJson = async () => {
    const keys = Object.values(K);
    const dump = {};
    for (const key of keys) {
      try { const r = await window.storage.get(key, true); dump[key] = JSON.parse(r.value); } catch { dump[key] = null; }
    }
    dump.__customers = customers || [];
    dump.__exportedAt = new Date().toISOString();
    downloadTextFile(`second-bowl-backup-${todayStr()}.json`, "application/json", JSON.stringify(dump, null, 2));
    logAudit("Exported a full data backup");
  };

  const importAllJson = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const dump = JSON.parse(reader.result);
        for (const key of Object.values(K)) {
          if (dump[key] !== undefined && dump[key] !== null) await persist(key, dump[key]);
        }
        if (Array.isArray(dump.__customers)) {
          for (const c of dump.__customers) {
            if (c?.name) await window.storage.set(customerKey(c.name), JSON.stringify(c), true);
          }
        }
        setImportMsg("Backup restored. Reload the page to see everything reflected everywhere.");
        logAudit("Restored data from an uploaded backup file");
        loadCustomers();
      } catch {
        setImportMsg("Couldn't read that file — make sure it's a backup exported from here.");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <SectionTitle eyebrow="Admin" title="Data" sub="A customer directory, plus real files you can download for backup, records, or moving to another browser." />

      <InfoNote>
        <b>Storage backend:</b> {(() => {
          const backend = typeof window !== "undefined" ? window.__STORAGE_BACKEND__ : undefined;
          if (backend === "sheets") return "Google Sheets — shared across every device and browser that opens this page.";
          if (backend === "local") return "This browser only. Orders and accounts placed on other devices won't show up here until a shared backend (like Google Sheets) is connected.";
          return "Shared storage managed by Claude — visible to everyone who opens this artifact.";
        })()}
      </InfoNote>
      <div style={{ marginTop: 10, marginBottom: 14 }}>
        <Btn small variant="ghost" onClick={testConnection} disabled={testing}><RefreshCcw size={13} /> {testing ? "Testing…" : "Test connection"}</Btn>
        {testResult && (
          <p style={{ fontSize: 12.5, marginTop: 8, color: testResult.ok === false ? "var(--clay)" : testResult.ok ? "var(--leaf)" : "var(--muted)" }}>
            {testResult.message}
          </p>
        )}
      </div>

      <Card style={{ marginBottom: 16, padding: 0, overflow: "hidden" }}>
        <div style={{ padding: "14px 18px", borderBottom: "1px solid var(--ring)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Customers</div>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn small variant="ghost" onClick={loadCustomers}><RefreshCcw size={13} /> Refresh</Btn>
            <Btn small onClick={exportCustomersCsv} disabled={!customers?.length}><Download size={13} /> Export CSV</Btn>
          </div>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead>
              <tr style={{ background: "var(--surface-muted)", textAlign: "left" }}>
                {["Name", "Account created", "Dogs", "Orders"].map((h) => (
                  <th key={h} style={{ padding: "9px 14px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {loadingCustomers ? (
                <tr><td colSpan={4} style={{ padding: 16 }}>Loading&hellip;</td></tr>
              ) : (customers || []).length === 0 ? (
                <tr><td colSpan={4} style={{ padding: 16, color: "var(--muted)" }}>No customer accounts yet.</td></tr>
              ) : (
                (customers || []).map((c) => {
                  const orderCount = orders.filter((o) => o.customerName === c.name).length;
                  const dogCount = dogs.filter((d) => d.owner === c.name).length;
                  return (
                    <tr key={c.name} style={{ borderTop: "1px solid var(--ring)" }}>
                      <td style={{ padding: "9px 14px", fontWeight: 600 }}>{c.name}</td>
                      <td style={{ padding: "9px 14px", fontFamily: "var(--font-mono)", fontSize: 12 }}>{new Date(c.createdAt).toLocaleDateString()}</td>
                      <td style={{ padding: "9px 14px" }}>{dogCount}</td>
                      <td style={{ padding: "9px 14px" }}>{orderCount}</td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>
        <p style={{ padding: "10px 18px", fontSize: 11.5, color: "var(--muted)", margin: 0 }}>
          Passwords are never included here or in any export — only the account name and when it was created.
        </p>
      </Card>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 10 }}>Orders &amp; audit log</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Btn small onClick={exportOrdersCsv} disabled={!orders.length}><Download size={13} /> Export orders CSV</Btn>
          <Btn small onClick={exportAuditCsv} disabled={!audit.length}><Download size={13} /> Export audit log CSV</Btn>
        </div>
        <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 10 }}>
          Every order ever placed stays in the Orders tab — nothing is deleted automatically, so that list already includes older ("legacy") orders alongside new ones.
        </p>
      </Card>

      <Card>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 10 }}>Full backup</div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 12 }}>
          Downloads everything — orders, customers, ingredients, rules, delivery areas, settings, and the audit log — as one JSON file you can store or move to another browser.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Btn small onClick={exportAllJson}><Download size={13} /> Export full backup</Btn>
          <Btn small variant="ghost" onClick={() => fileRef.current?.click()}><Upload size={13} /> Import backup</Btn>
        </div>
        <input ref={fileRef} type="file" accept="application/json" onChange={importAllJson} style={{ display: "none" }} />
        {importMsg && <p style={{ fontSize: 12.5, color: "var(--leaf)", marginTop: 10 }}>{importMsg}</p>}
      </Card>
    </div>
  );
}

/* ============================================================================
   Chat helper widget (local keyword matching against admin's FAQ list)
   ========================================================================= */

function ChatWidget({ faqs }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const listRef = useRef(null);

  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [messages, open]);

  const send = (text) => {
    const q = (text ?? input).trim();
    if (!q) return;
    const match = bestFaqMatch(q, faqs);
    setMessages((m) => [...m, { from: "user", text: q }, { from: "bot", text: match ? match.a : "I don't have an answer for that yet. Here are some things people usually ask:", suggestChips: !match }]);
    setInput("");
  };

  return (
    <>
      <button onClick={() => setOpen((o) => !o)} className="chat-fab" aria-label="Help">
        {open ? <X size={22} /> : <MessageCircle size={22} />}
      </button>
      {open && (
        <div className="chat-panel">
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "14px 16px", borderBottom: "1px solid var(--ring)" }}>
            <HelpCircle size={17} color="var(--leaf)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>Ask us anything</div>
          </div>
          <div ref={listRef} style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {messages.length === 0 && (
              <div style={{ fontSize: 13, color: "var(--muted)" }}>
                Hi! Try a common question below, or type your own.
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} style={{ alignSelf: m.from === "user" ? "flex-end" : "flex-start", maxWidth: "85%" }}>
                <div style={{
                  background: m.from === "user" ? "var(--ink)" : "var(--surface-muted)",
                  color: m.from === "user" ? "var(--btn-primary-fg)" : "var(--ink)",
                  borderRadius: 14, padding: "9px 13px", fontSize: 13.5, lineHeight: 1.5,
                }}>{m.text}</div>
              </div>
            ))}
            {(messages.length === 0 || messages[messages.length - 1]?.suggestChips) && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 4 }}>
                {faqs.slice(0, 4).map((f) => (
                  <button key={f.id} onClick={() => send(f.q)} className="chat-chip">{f.q}</button>
                ))}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, padding: 12, borderTop: "1px solid var(--ring)" }}>
            <input style={{ ...inputStyle, flex: 1 }} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Type a question…" />
            <button onClick={() => send()} className="stepper-btn" style={{ width: 40, height: 40 }}><Send size={15} /></button>
          </div>
        </div>
      )}
    </>
  );
}

/* ============================================================================
   Root App
   ========================================================================= */

const CUSTOMER_TABS = [
  { id: "dogs", label: "My Dogs", icon: PawPrint },
  { id: "order", label: "Order Food", icon: Dog },
  { id: "myorders", label: "My Orders", icon: ClipboardList },
  { id: "contact", label: "Contact", icon: Phone },
  { id: "gallery", label: "Gallery", icon: ImageIcon },
];
const ADMIN_TABS = [
  { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  { id: "orders", label: "Orders", icon: ListChecks },
  { id: "ingredients", label: "Ingredients", icon: SlidersHorizontal },
  { id: "rules", label: "Rules", icon: Settings },
  { id: "locations", label: "Delivery Areas", icon: MapPin },
  { id: "schedule", label: "Schedule", icon: CalendarDays },
  { id: "payments", label: "Payments", icon: QrCode },
  { id: "faq", label: "FAQ", icon: HelpCircle },
  { id: "gallery", label: "Gallery", icon: ImageIcon },
  { id: "data", label: "Data", icon: Database },
  { id: "settings", label: "Settings", icon: Clock },
  { id: "audit", label: "Audit Log", icon: History },
];

function App() {
  const [loading, setLoading] = useState(true);
  const [role, setRole] = useState("customer");
  const [myName, setMyName] = useState("");
  const [tab, setTab] = useState("order");
  const [pendingDogId, setPendingDogId] = useState(null);
  const [pendingOrderFilter, setPendingOrderFilter] = useState(null);

  const [config, setConfig] = useState(SEED_CONFIG);
  const [ingredients, setIngredients] = useState(SEED_INGREDIENTS);
  const [breeds, setBreeds] = useState(SEED_BREEDS);
  const [engine, setEngine] = useState(SEED_ENGINE);
  const [dogs, setDogs] = useState([]);
  const [orders, setOrders] = useState([]);
  const [cancelledSlots, setCancelledSlots] = useState([]);
  const [forceOpenSlots, setForceOpenSlots] = useState([]);
  const [slotOverrides, setSlotOverrides] = useState([]);
  const [locations, setLocations] = useState(SEED_LOCATIONS);
  const [gallery, setGallery] = useState([]);
  const [qrCode, setQrCode] = useState("");
  const [faqs, setFaqs] = useState(SEED_FAQS);
  const [audit, setAudit] = useState([]);

  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [showQrPrompt, setShowQrPrompt] = useState(false);
  const [qrPromptDismissed, setQrPromptDismissed] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState("");

  const [authOpen, setAuthOpen] = useState(false);
  const [authMode, setAuthMode] = useState("login");
  const [authName, setAuthName] = useState("");
  const [authPw, setAuthPw] = useState("");
  const [authPw2, setAuthPw2] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  const [theme, setTheme] = useState("light");

  const [notifications, setNotifications] = useState([]);
  const [notifOpen, setNotifOpen] = useState(false);
  const [lastReadTs, setLastReadTs] = useState(0);
  const [toast, setToast] = useState(null);
  const knownOrderIdsRef = useRef(null);
  // The periodic sync poll (below) refetches shared data on a timer and
  // overwrites local state whenever it looks different from what's already
  // fetched -- which is exactly right when the change came from *another*
  // browser, but wrong for the few seconds right after *this* admin makes
  // an edit here: a poll landing in that window can fetch a snapshot from
  // just before the edit was persisted and stomp the very change that was
  // just made, making it look like the value silently reverted. These
  // wrapped setters mark the moment of any local admin edit; the poll
  // skips overwriting that piece of state for a few seconds afterward,
  // giving the edit's own persist() call time to actually land first.
  const lastAdminEditRef = useRef(0);
  const EDIT_GRACE_MS = 8000;
  const setConfigT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setConfig(v); }, []);
  const setCancelledSlotsT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setCancelledSlots(v); }, []);
  const setForceOpenSlotsT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setForceOpenSlots(v); }, []);
  const setSlotOverridesT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setSlotOverrides(v); }, []);
  const setLocationsT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setLocations(v); }, []);
  const setGalleryT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setGallery(v); }, []);
  const setOrdersT = useCallback((v) => { lastAdminEditRef.current = Date.now(); setOrders(v); }, []);
  const toastTimerRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const session = await window.storage.get("dfp:session", false);
        if (session?.value) { const d = JSON.parse(session.value); if (d?.name) setMyName(d.name); }
      } catch {}
      try {
        const unlocked = await window.storage.get("dfp:adminUnlocked", false);
        if (unlocked?.value === "true") setAdminUnlocked(true);
      } catch {}
      try {
        const dismissed = await window.storage.get("dfp:qrPromptDismissed", false);
        if (dismissed?.value === "true") setQrPromptDismissed(true);
      } catch {}
      try {
        const savedTheme = await window.storage.get("dfp:theme", false);
        if (savedTheme?.value) setTheme(JSON.parse(savedTheme.value));
        else if (typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");
      } catch {
        if (typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");
      }
      const [c, ing, br, en, dg, ord, cs, fo, so, loc, qr, fq, au, gal] = await loadManyOrSeed([
        [K.config, SEED_CONFIG], [K.ingredients, SEED_INGREDIENTS], [K.breeds, SEED_BREEDS], [K.engine, SEED_ENGINE],
        [K.dogs, []], [K.orders, []], [K.cancelledSlots, []], [K.forceOpenSlots, []], [K.slotOverrides, []],
        [K.locations, SEED_LOCATIONS], [K.qrCode, ""], [K.faqs, SEED_FAQS], [K.audit, []], [K.gallery, []],
      ]);
      setConfig(mergeConfig(c));
      setIngredients(ing); setBreeds(br); setEngine(en);
      setDogs(dg); setOrders(ord); setCancelledSlots(cs); setForceOpenSlots(fo); setSlotOverrides(so);
      setLocations(loc); setQrCode(qr); setFaqs(fq && fq.length ? fq : SEED_FAQS); setAudit(au); setGallery(gal);
      knownOrderIdsRef.current = new Set(ord.map((o) => o.id));
      setLoading(false);
    })();
  }, []);

  // Poll shared operational data periodically and on window focus, so a
  // second browser/session picks up admin changes -- new orders, dog
  // profiles, session times/capacity, manual slot overrides, delivery
  // areas -- without a manual reload, and surface a notification when a
  // genuinely new order shows up. This used to be scoped to orders/dogs
  // only, out of caution around a background refresh overwriting an
  // admin's own in-flight change; that risk was really a bug in the
  // storage loader (it would write a guessed "empty" value back to
  // storage on any failed read, not just a genuinely missing key), which
  // is now fixed at the source -- so it's safe to sync more here.
  const refresh = useCallback(async () => {
    try {
      const [ord, dg, cfgRaw, cs, fo, so, loc, gal] = await loadManyOrSeed([
        [K.orders, []], [K.dogs, []], [K.config, SEED_CONFIG],
        [K.cancelledSlots, []], [K.forceOpenSlots, []], [K.slotOverrides, []],
        [K.locations, SEED_LOCATIONS], [K.gallery, []],
      ]);

      if (knownOrderIdsRef.current) {
        const fresh = ord.filter((o) => !knownOrderIdsRef.current.has(o.id));
        if (fresh.length > 0) {
          const sessLabel = (o) => cfgRaw?.sessions?.[o.session]?.label || o.session;
          const entries = fresh.map((o) => ({
            id: uid("n_"), ts: Date.now(),
            text: `New order — ${o.dogSnapshot.name}'s meal from ${o.customerName} for ${fmtDateLabel(o.date)} · ${sessLabel(o)}`,
          }));
          setNotifications((prev) => [...entries, ...prev].slice(0, 30));
          setToast(entries[entries.length - 1]);
          clearTimeout(toastTimerRef.current);
          toastTimerRef.current = setTimeout(() => setToast(null), 6000);
        }
      }
      knownOrderIdsRef.current = new Set(ord.map((o) => o.id));

      const withinEditGrace = Date.now() - lastAdminEditRef.current < EDIT_GRACE_MS;
      if (!withinEditGrace) {
        setOrders((prev) => (JSON.stringify(prev) === JSON.stringify(ord) ? prev : ord));
        setDogs((prev) => (JSON.stringify(prev) === JSON.stringify(dg) ? prev : dg));
        setConfig((prev) => {
          const merged = mergeConfig(cfgRaw);
          return JSON.stringify(prev) === JSON.stringify(merged) ? prev : merged;
        });
        setCancelledSlots((prev) => (JSON.stringify(prev) === JSON.stringify(cs) ? prev : cs));
        setForceOpenSlots((prev) => (JSON.stringify(prev) === JSON.stringify(fo) ? prev : fo));
        setSlotOverrides((prev) => (JSON.stringify(prev) === JSON.stringify(so) ? prev : so));
        setLocations((prev) => (JSON.stringify(prev) === JSON.stringify(loc) ? prev : loc));
        setGallery((prev) => (JSON.stringify(prev) === JSON.stringify(gal) ? prev : gal));
      }
    } catch {}
  }, []);

  // Deliberately no interval timer here anymore -- constantly polling on a
  // clock regardless of whether anything's actually changed just burns
  // through Sheets calls for no reason. Refresh now only happens when
  // there's an actual signal something might be different: the window
  // regaining focus (you switched back to this tab), admin unlocking into
  // admin mode, or one of the manual "Refresh" buttons.
  useEffect(() => {
    if (loading) return;
    const onFocus = () => refresh();
    window.addEventListener("focus", onFocus);
    return () => window.removeEventListener("focus", onFocus);
  }, [loading, refresh]);

  const logAudit = useCallback((details) => {
    setAudit((prev) => {
      const next = [...prev, { id: uid("a_"), ts: Date.now(), details }];
      persist(K.audit, next);
      return next;
    });
  }, []);

  const tabs = role === "customer" ? CUSTOMER_TABS : ADMIN_TABS;
  useEffect(() => { setTab(role === "customer" ? "order" : "dashboard"); }, [role]);

  useEffect(() => {
    if (role === "admin" && !loading && !qrCode && !qrPromptDismissed) {
      setShowQrPrompt(true);
    }
  }, [role, loading, qrCode, qrPromptDismissed]);

  const dismissQrPrompt = () => {
    setShowQrPrompt(false);
    setQrPromptDismissed(true);
    window.storage.set("dfp:qrPromptDismissed", "true", false).catch(() => {});
  };

  // --- admin gate ---
  const requestAdmin = () => {
    if (adminUnlocked) { setRole("admin"); refresh(); return; }
    setPwInput(""); setPwError(""); setShowPwModal(true);
  };
  const submitPassword = () => {
    if (pwInput === ADMIN_PASSWORD) {
      setAdminUnlocked(true);
      window.storage.set("dfp:adminUnlocked", "true", false).catch(() => {});
      setRole("admin"); setShowPwModal(false); refresh();
    } else setPwError("Incorrect password.");
  };
  const lockAdmin = () => {
    setAdminUnlocked(false);
    window.storage.set("dfp:adminUnlocked", "false", false).catch(() => {});
    setRole("customer");
  };

  // --- customer account gate ---
  const openAuth = (mode) => { setAuthOpen(true); setAuthMode(mode); setAuthName(myName || ""); setAuthPw(""); setAuthPw2(""); setAuthError(""); };
  const switchAuthMode = () => { setAuthMode((m) => (m === "login" ? "signup" : "login")); setAuthError(""); setAuthPw(""); setAuthPw2(""); };
  const authLogin = async () => {
    const name = authName.trim();
    if (!name) { setAuthError("Enter your name."); return; }
    setAuthBusy(true); setAuthError("");
    try {
      const rec = await window.storage.get(customerKey(name), true);
      const data = JSON.parse(rec.value);
      if (simpleHash(authPw) === data.passwordHash) {
        setMyName(data.name);
        window.storage.set("dfp:session", JSON.stringify({ name: data.name }), false).catch(() => {});
        setAuthOpen(false);
      } else setAuthError("Incorrect password.");
    } catch {
      setAuthError("No account found with that name. Try creating one instead.");
    }
    setAuthBusy(false);
  };
  const authSignup = async () => {
    const name = authName.trim();
    if (!name) { setAuthError("Enter your name."); return; }
    if (authPw.length < 4) { setAuthError("Password must be at least 4 characters."); return; }
    if (authPw !== authPw2) { setAuthError("Passwords don't match."); return; }
    setAuthBusy(true); setAuthError("");
    try {
      const existing = await window.storage.get(customerKey(name), true);
      if (existing?.value) {
        setAuthError("That name is already registered. Try logging in instead, or use a different name.");
        setAuthBusy(false);
        return;
      }
    } catch {
      // not found -- exactly what we want for a new signup, fall through
    }
    const data = { name, passwordHash: simpleHash(authPw), createdAt: Date.now(), addresses: [] };
    await window.storage.set(customerKey(name), JSON.stringify(data), true);
    setMyName(name);
    window.storage.set("dfp:session", JSON.stringify({ name }), false).catch(() => {});
    setAuthOpen(false);
    setAuthBusy(false);
  };
  const signOut = () => { setMyName(""); window.storage.set("dfp:session", JSON.stringify({ name: "" }), false).catch(() => {}); };

  // --- theme ---
  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    window.storage.set("dfp:theme", JSON.stringify(next), false).catch(() => {});
  };

  const goToOrderWithDog = (dogId) => { setPendingDogId(dogId); setTab("order"); };
  const goToOrdersFiltered = (date, session) => { setPendingOrderFilter({ date, session }); setTab("orders"); };

  CURRENCY_SYMBOL = config.currencySymbol || "₹";

  if (loading) return <Shell theme={theme}><div style={{ padding: 60, textAlign: "center", fontFamily: "var(--font-mono)", color: "var(--muted)" }}>Setting the table&hellip;</div></Shell>;

  return (
    <Shell theme={theme}>
      {showPwModal && <PasswordModal value={pwInput} setValue={setPwInput} error={pwError} onSubmit={submitPassword} onCancel={() => setShowPwModal(false)} />}
      {showQrPrompt && (
        <Modal onCancel={dismissQrPrompt} maxWidth={380}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <div style={{ background: "var(--turmeric)", borderRadius: 10, padding: 8, display: "flex" }}>
              <QrCode size={16} color="#1d1d1f" />
            </div>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 19 }}>Add a payment QR code</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", marginBottom: 18 }}>
            No QR code is set up yet, so customers can&apos;t place an order right now. Upload one in Payments to open up ordering.
          </p>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn full onClick={() => { setTab("payments"); dismissQrPrompt(); }}>Go to Payments</Btn>
            <Btn full variant="ghost" onClick={dismissQrPrompt}>Don&apos;t show this again</Btn>
          </div>
        </Modal>
      )}
      {authOpen && (
        <AuthModal
          mode={authMode} name={authName} setName={setAuthName} pw={authPw} setPw={setAuthPw} pw2={authPw2} setPw2={setAuthPw2}
          error={authError} busy={authBusy}
          onLogin={authLogin} onSignup={authSignup}
          onSwitchMode={switchAuthMode} onCancel={() => setAuthOpen(false)}
        />
      )}
      <Header role={role} setRole={setRole} requestAdmin={requestAdmin} adminUnlocked={adminUnlocked} lockAdmin={lockAdmin}
        myName={myName} openAuth={openAuth} signOut={signOut} config={config} theme={theme} toggleTheme={toggleTheme}
        notifications={notifications} notifOpen={notifOpen} setNotifOpen={setNotifOpen}
        lastReadTs={lastReadTs} setLastReadTs={setLastReadTs} />
      {role === "admin" && adminUnlocked && toast && (
        <div className="toast-banner" onClick={() => setToast(null)}>
          <Bell size={14} /> {toast.text}
        </div>
      )}
      <div className="app-layout">
        <nav className="app-nav">
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return <button key={t.id} onClick={() => setTab(t.id)} className={"nav-btn" + (active ? " active" : "")}><Icon size={15} /> {t.label}</button>;
          })}
        </nav>
        <main className="app-main">
          {role === "customer" && tab === "dogs" && <DogsView dogs={dogs} setDogs={setDogs} breeds={breeds} myName={myName} onContinue={goToOrderWithDog} />}
          {role === "customer" && tab === "order" && (
            <OrderFoodView
              myName={myName} dogs={dogs} ingredients={ingredients} breeds={breeds} engine={engine}
              config={config} orders={orders} cancelledSlots={cancelledSlots} forceOpenSlots={forceOpenSlots}
              slotOverrides={slotOverrides} locations={locations} qrCode={qrCode} initialDogId={pendingDogId}
              setOrders={setOrders} goToOrders={() => setTab("myorders")}
            />
          )}
          {role === "customer" && tab === "myorders" && <MyOrdersView myName={myName} orders={orders} config={config} qrCode={qrCode} />}
          {role === "customer" && tab === "contact" && <ContactView config={config} />}
          {role === "customer" && tab === "gallery" && <GalleryView myName={myName} dogs={dogs} gallery={gallery} setGallery={setGallery} config={config} />}

          {role === "admin" && tab === "dashboard" && <AdminDashboard config={config} orders={orders} cancelledSlots={cancelledSlots} forceOpenSlots={forceOpenSlots} slotOverrides={slotOverrides} locations={locations} onGoToOrders={goToOrdersFiltered} onRefresh={refresh} />}
          {role === "admin" && tab === "orders" && <AdminOrders orders={orders} setOrders={setOrdersT} config={config} logAudit={logAudit} initialFilter={pendingOrderFilter} onConsumeInitialFilter={() => setPendingOrderFilter(null)} onRefresh={refresh} />}
          {role === "admin" && tab === "ingredients" && <AdminIngredients ingredients={ingredients} setIngredients={setIngredients} logAudit={logAudit} />}
          {role === "admin" && tab === "rules" && <AdminRules breeds={breeds} setBreeds={setBreeds} engine={engine} setEngine={setEngine} logAudit={logAudit} />}
          {role === "admin" && tab === "locations" && <AdminLocations locations={locations} setLocations={setLocationsT} logAudit={logAudit} />}
          {role === "admin" && tab === "schedule" && (
            <AdminSchedule
              config={config} orders={orders} cancelledSlots={cancelledSlots} setCancelledSlots={setCancelledSlotsT}
              forceOpenSlots={forceOpenSlots} setForceOpenSlots={setForceOpenSlotsT}
              slotOverrides={slotOverrides} setSlotOverrides={setSlotOverridesT} logAudit={logAudit}
            />
          )}
          {role === "admin" && tab === "payments" && <AdminPayments qrCode={qrCode} setQrCode={setQrCode} config={config} setConfig={setConfigT} logAudit={logAudit} />}
          {role === "admin" && tab === "faq" && <AdminFAQ faqs={faqs} setFaqs={setFaqs} logAudit={logAudit} />}
          {role === "admin" && tab === "gallery" && <AdminGallery gallery={gallery} setGallery={setGalleryT} config={config} setConfig={setConfigT} logAudit={logAudit} />}
          {role === "admin" && tab === "data" && <AdminData orders={orders} dogs={dogs} audit={audit} logAudit={logAudit} />}
          {role === "admin" && tab === "settings" && <AdminSettings config={config} setConfig={setConfigT} cancelledSlots={cancelledSlots} setCancelledSlots={setCancelledSlotsT} forceOpenSlots={forceOpenSlots} setForceOpenSlots={setForceOpenSlotsT} slotOverrides={slotOverrides} setSlotOverrides={setSlotOverridesT} logAudit={logAudit} />}
          {role === "admin" && tab === "audit" && <AdminAudit audit={audit} />}
        </main>
      </div>
      {role === "customer" && <ChatWidget faqs={faqs} />}
    </Shell>
  );
}

function Header({ role, requestAdmin, setRole, adminUnlocked, lockAdmin, myName, openAuth, signOut, config, theme, toggleTheme, notifications, notifOpen, setNotifOpen, lastReadTs, setLastReadTs }) {
  const unreadCount = notifications.filter((n) => n.ts > lastReadTs).length;
  return (
    <header className="app-header">
      <div className="app-header-inner">
        <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
          {config.logoDataUrl ? (
            <img src={config.logoDataUrl} alt={config.serviceName} style={{ width: 34, height: 34, borderRadius: 10, objectFit: "cover", flexShrink: 0 }} />
          ) : (
            <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex", flexShrink: 0 }}>
              <Dog size={18} color="#fff" />
            </div>
          )}
          <div style={{ minWidth: 0 }}>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 19, lineHeight: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{config.serviceName}</div>
            <div className="app-brand-tagline" style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--muted)", letterSpacing: "0.04em" }}>{config.tagline}</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <button onClick={toggleTheme} className="icon-btn" aria-label="Toggle theme" title="Toggle light / dark">
            {theme === "dark" ? <Sun size={16} /> : <Moon size={16} />}
          </button>
          {role === "admin" && (
            <div style={{ position: "relative" }}>
              <button
                onClick={() => { setNotifOpen(!notifOpen); if (!notifOpen) setLastReadTs(Date.now()); }}
                className="icon-btn" aria-label="Notifications" title="New order notifications"
              >
                <Bell size={16} />
                {unreadCount > 0 && <span className="notif-dot">{unreadCount > 9 ? "9+" : unreadCount}</span>}
              </button>
              {notifOpen && (
                <div className="notif-dropdown">
                  <div style={{ padding: "10px 14px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", borderBottom: "1px solid var(--ring)" }}>New orders</div>
                  {notifications.length === 0 ? (
                    <div style={{ padding: 16, fontSize: 13, color: "var(--muted)" }}>No notifications yet.</div>
                  ) : notifications.slice(0, 12).map((n) => (
                    <div key={n.id} style={{ padding: "10px 14px", borderBottom: "1px solid var(--ring)", fontSize: 13 }}>
                      <div>{n.text}</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--muted)", marginTop: 2 }}>{new Date(n.ts).toLocaleTimeString()}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {role === "customer" && (
            myName ? (
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--surface-muted)", borderRadius: 980, padding: "7px 12px" }}>
                  <CircleUser size={15} /><span style={{ fontSize: 13.5, fontWeight: 600 }}>{myName}</span>
                </div>
                <Btn small variant="ghost" onClick={signOut}><LogOut size={13} /> Log out</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 6 }}>
                <Btn small variant="ghost" onClick={() => openAuth("login")}><CircleUser size={14} /> Log In</Btn>
                <Btn small variant="outline" onClick={() => openAuth("signup")}>Sign Up</Btn>
              </div>
            )
          )}
          {role === "admin" && <Btn small variant="ghost" onClick={lockAdmin}><Lock size={13} /> Sign out</Btn>}
          <div className="segmented">
            <button onClick={() => setRole("customer")} className={"segmented-btn" + (role === "customer" ? " active" : "")}>Customer</button>
            <button onClick={requestAdmin} className={"segmented-btn" + (role === "admin" ? " active" : "")}>{adminUnlocked ? "Admin" : <><Lock size={11} /> Admin</>}</button>
          </div>
        </div>
      </div>
    </header>
  );
}

function Shell({ children, theme }) {
  useEffect(() => {
    // Apply the theme at the document root too, not just this wrapper --
    // otherwise any space below the app's own content (short pages,
    // elastic overscroll, etc.) falls back to the browser's default white.
    const bg = theme === "dark" ? "#0c0c0e" : "#fbfbfd";
    try {
      document.documentElement.classList.toggle("theme-dark", theme === "dark");
      document.documentElement.style.backgroundColor = bg;
      document.body.style.backgroundColor = bg;
      document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
    } catch {}
  }, [theme]);

  return (
    <div className={theme === "dark" ? "theme-dark" : ""} style={{ minHeight: "100vh", background: "var(--bg)", color: "var(--ink)" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
        :root {
          --bg: #fbfbfd;
          --surface: #ffffff;
          --surface-muted: #f5f5f7;
          --ink: #1d1d1f;
          --muted: #6e6e73;
          --leaf: #2f6846;
          --turmeric: #d9a234;
          --clay: #b3492f;
          --ring: #eeeeef;
          --ring-strong: #dcdcdf;
          --card-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 14px 32px -18px rgba(0,0,0,0.14);
          --tone-good-bg: #e4f0e6;
          --tone-warn-bg: #fbeed7;
          --tone-warn-fg: #8a5a10;
          --tone-bad-bg: #fbe4de;
          --btn-primary-fg: #ffffff;
          --font-display: 'Fraunces', serif;
          --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          --font-mono: 'IBM Plex Mono', monospace;
        }
        .theme-dark {
          --bg: #0c0c0e;
          --surface: #17171a;
          --surface-muted: #212024;
          --ink: #f2f2f0;
          --muted: #9d9da3;
          --leaf: #63b686;
          --turmeric: #e6b559;
          --clay: #e2836a;
          --ring: #2a2a2e;
          --ring-strong: #3a3a3f;
          --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -18px rgba(0,0,0,0.6);
          --tone-good-bg: #17301f;
          --tone-warn-bg: #362a10;
          --tone-warn-fg: #e6b559;
          --tone-bad-bg: #3a1e18;
          --btn-primary-fg: #0c0c0e;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; background: var(--bg); min-height: 100%; }
        select { font-family: var(--font-body); }
        table th { text-align: left; }
        details summary::-webkit-details-marker { display: none; }
        button { font-family: var(--font-body); }
        input, select, textarea { font-size: 16px; }

        .app-header { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--ring); }
        .app-header-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
        .segmented { display: flex; border-radius: 980px; background: var(--surface-muted); padding: 3px; }
        .segmented-btn { border: none; padding: 7px 15px; font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--ink); border-radius: 980px; display: flex; align-items: center; gap: 5px; }
        .segmented-btn.active { background: var(--ink); color: var(--btn-primary-fg); }
        .icon-btn { border: 1.5px solid var(--ring-strong); background: var(--surface); color: var(--ink); border-radius: 980px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .app-layout { display: flex; gap: 26px; max-width: 1100px; margin: 0 auto; padding: 22px 24px 56px; }
        .app-nav { width: 192px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; position: sticky; top: 88px; align-self: flex-start; }
        .nav-btn { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-radius: 12px; border: none; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: transparent; color: var(--ink); }
        .nav-btn.active { background: var(--ink); color: var(--btn-primary-fg); font-weight: 700; }
        .app-main { flex: 1; min-width: 0; }

        .responsive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
        .session-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

        .add-tile { border: 1.5px dashed var(--ring-strong); border-radius: 20px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 110px; cursor: pointer; color: var(--muted); }
        .date-chip { border: none; border-radius: 980px; padding: 9px 16px; cursor: pointer; font-size: 13.5px; white-space: nowrap; background: var(--surface-muted); color: var(--ink); font-weight: 600; }
        .date-chip.active { background: var(--ink); color: var(--btn-primary-fg); }
        .session-card { text-align: left; border: 1.5px solid var(--ring); border-radius: 18px; padding: 15px; background: var(--surface); cursor: pointer; }
        .session-card.selected { border-color: var(--leaf); box-shadow: 0 0 0 3px color-mix(in srgb, var(--leaf) 18%, transparent); }
        .ingredient-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 6px; border-bottom: 1px solid var(--ring); flex-wrap: wrap; }
        .stepper-btn { border: 1.5px solid var(--ring-strong); background: var(--surface); color: var(--ink); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .timeline { display: flex; align-items: center; }

        .notif-dot { position: absolute; top: -4px; right: -4px; background: var(--clay); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 3px; font-family: var(--font-mono); }
        .notif-dropdown { position: absolute; top: 42px; right: 0; width: 300px; max-height: 360px; overflow-y: auto; background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; box-shadow: 0 20px 48px -16px rgba(0,0,0,0.35); z-index: 50; }
        .toast-banner { position: fixed; top: 76px; right: 20px; background: var(--ink); color: var(--btn-primary-fg); padding: 12px 16px; border-radius: 14px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.4); z-index: 60; cursor: pointer; max-width: min(320px, calc(100vw - 40px)); }
        .chat-fab { position: fixed; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--btn-primary-fg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -8px rgba(0,0,0,0.4); z-index: 40; }
        .chat-panel { position: fixed; bottom: 84px; right: 20px; width: min(340px, calc(100vw - 32px)); height: min(460px, calc(100vh - 140px)); background: var(--surface); border: 1px solid var(--ring); border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(0,0,0,0.4); z-index: 40; display: flex; flex-direction: column; overflow: hidden; }
        .chat-chip { text-align: left; border: 1px solid var(--ring-strong); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 11px; font-size: 12.5px; cursor: pointer; }

        @media (max-width: 780px) {
          .app-header-inner { padding: 11px 16px; }
          .app-brand-tagline { display: none; }
          .app-layout { flex-direction: column; padding: 14px 14px 40px; gap: 14px; }
          .app-nav { width: 100%; flex-direction: row; overflow-x: auto; gap: 6px; position: static; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
          .app-nav::-webkit-scrollbar { display: none; }
          .nav-btn { white-space: nowrap; flex-shrink: 0; padding: 9px 12px; }
          .responsive-grid { grid-template-columns: 1fr 1fr; }
          .session-grid { grid-template-columns: 1fr; }
          .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
          .ingredient-row { padding: 10px 2px; }
          .chat-panel { right: 12px; bottom: 76px; }
          .chat-fab { right: 14px; bottom: 14px; }
        }
        @media (max-width: 460px) {
          .responsive-grid { grid-template-columns: 1fr; }
          .app-header-inner { gap: 10px; }
        }

        @media print {
          body * { visibility: hidden; }
          .invoice-print, .invoice-print * { visibility: visible; }
          .invoice-print { position: absolute; top: 0; left: 0; width: 100%; padding: 24px; color: #000; }
        }
      `}</style>
      {children}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
