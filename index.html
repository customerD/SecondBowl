/* ---------------------------------------------------------------------------
   Browser storage shim
   ---------------------------------------------------------------------------
   Two backends, split by the "shared" flag the app already passes on every
   call (this matches the same meaning it has in Claude's own storage API):

   - PERSONAL data (shared=false) -- your signed-in session, theme choice,
     admin-unlock flag -- always stays in this browser's own localStorage.
     It's meant to be per-browser, so there's no reason to send it anywhere.

   - SHARED data (shared=true) -- orders, customer accounts, ingredients,
     settings, the audit log, everything admin and every customer need to
     see in common -- goes to a small Google Sheet over HTTP, *if* one is
     configured below. Until you set SHEETS_API_URL, shared data falls
     back to localStorage too, so the app still works out of the box --
     it just won't be shared across devices/browsers until you connect a
     real backend. See google_sheets_backend/Code.gs for the one-time
     Apps Script setup this pairs with.
   ------------------------------------------------------------------------- */

const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycby7Uy6wHaJKMBGoHFLT-8GjBnEhudrfsBJcaYkil5xX3Fx7XYxoG04rePHniU4c10UFXA/exec"; // <-- paste your deployed Apps Script "Web app URL" here
const SHEETS_TOKEN = "sb_9f2a71";   // <-- paste the same TOKEN value you set in Code.gs (leave blank if you left it blank there too)

const SHEETS_ENABLED = /^https:\/\//.test(SHEETS_API_URL);
window.__STORAGE_BACKEND__ = SHEETS_ENABLED ? "sheets" : "local";
// Google Apps Script quotas are generous but not infinite -- back off the
// live-refresh polling interval when every poll is a real network round
// trip to Sheets, instead of an instant local read.
window.__STORAGE_POLL_MS__ = SHEETS_ENABLED ? 20000 : 5000;

function localGet_(key) {
  const raw = localStorage.getItem(key);
  if (raw == null) throw new Error("not found");
  return { key, value: raw };
}
function localSet_(key, value) {
  localStorage.setItem(key, value);
  return { key, value };
}
function localDelete_(key) {
  localStorage.removeItem(key);
  return { key, deleted: true };
}
function localList_(prefix) {
  const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
  return { keys, prefix };
}

// Every Sheets call reads the response as text first, then tries to parse
// it as JSON. If that fails, the error includes the actual HTTP status and
// a slice of whatever came back -- usually an Apps Script HTML error page
// (e.g. from an unhandled exception server-side, like writing a value
// larger than a single Sheets cell can hold on an un-updated deployment).
// A bare "Unexpected token" error hides exactly the detail needed to tell
// a stale-deployment problem apart from a size problem apart from a token
// problem, so this is deliberately more verbose than a normal JSON parse.
async function parseSheetsResponse_(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error(`Backend returned a non-JSON response (HTTP ${res.status}): ${text.slice(0, 400)}`);
  }
}

async function sheetsGet_(key) {
  const url = `${SHEETS_API_URL}?action=get&key=${encodeURIComponent(key)}${SHEETS_TOKEN ? `&token=${encodeURIComponent(SHEETS_TOKEN)}` : ""}`;
  const res = await fetch(url);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return { key: data.key, value: data.value };
}
async function sheetsGetMany_(keys) {
  const url = `${SHEETS_API_URL}?action=getMany&keys=${encodeURIComponent(keys.join(","))}${SHEETS_TOKEN ? `&token=${encodeURIComponent(SHEETS_TOKEN)}` : ""}`;
  const res = await fetch(url);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return data; // { values: { key: string|null, ... } }
}
async function sheetsSet_(key, value) {
  // text/plain avoids a CORS preflight request, which Apps Script web apps
  // don't handle -- this is a deliberate workaround, not an oversight.
  const res = await fetch(SHEETS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", key, value, token: SHEETS_TOKEN }),
  });
  const data = await parseSheetsResponse_(res);
  // Apps Script returns errors as ordinary 200 JSON, not an HTTP failure --
  // without this check, a rejected write (bad token, quota, etc.) looks
  // exactly like a successful one to the caller.
  if (data.error) throw new Error(`Sheets write failed: ${data.error}`);
  return data;
}
async function sheetsDelete_(key) {
  const res = await fetch(SHEETS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", key, token: SHEETS_TOKEN }),
  });
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(`Sheets delete failed: ${data.error}`);
  return data;
}
async function sheetsList_(prefix) {
  const url = `${SHEETS_API_URL}?action=list&prefix=${encodeURIComponent(prefix || "")}${SHEETS_TOKEN ? `&token=${encodeURIComponent(SHEETS_TOKEN)}` : ""}`;
  const res = await fetch(url);
  const data = await parseSheetsResponse_(res);
  if (data.error) throw new Error(data.error);
  return data;
}

window.storage = {
  async get(key, shared) {
    if (shared && SHEETS_ENABLED) return sheetsGet_(key);
    return localGet_(key);
  },
  async set(key, value, shared) {
    if (shared && SHEETS_ENABLED) return sheetsSet_(key, value);
    return localSet_(key, value);
  },
  async delete(key, shared) {
    if (shared && SHEETS_ENABLED) return sheetsDelete_(key);
    return localDelete_(key);
  },
  async list(prefix, shared) {
    if (shared && SHEETS_ENABLED) return sheetsList_(prefix);
    return localList_(prefix);
  },
  // Extra batch helper -- not part of Claude's own storage API, only used
  // by this app's own polling code, and only wired up to do anything
  // useful when Sheets is the active backend (see loadManyOrSeed in the
  // app body: it feature-detects this and safely no-ops without it).
  async getMany(keys, shared) {
    if (shared && SHEETS_ENABLED) return sheetsGetMany_(keys);
    const values = {};
    for (const k of keys) {
      try { values[k] = localGet_(k).value; } catch { values[k] = null; }
    }
    return { values };
  },
};

const addDays = (dateStr, n) => {

const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };

  const [h, m] = t.split(":").map(Number);

  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad2(m)} ${ap}`;
};
const fmtDateLabel = (dateStr) => {
  if (dateStr === todayStr()) return "Today";

const formatAge = (totalMonths) => {
  const y = Math.floor(totalMonths / 12);
  const m = totalMonths % 12;
  const parts = [];
  if (y > 0) parts.push(`${y} ${y === 1 ? "year" : "years"}`);
  if (m > 0 || y === 0) parts.push(`${m} ${m === 1 ? "month" : "months"}`);
  return parts.join(" ");
};
const haversineKm = (lat1, lon1, lat2, lon2) => {
  const toRad = (d) => (d * Math.PI) / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};
// A simple non-cryptographic string hash. This app runs entirely in the
// browser with no real backend, so this is only meant to keep a password
// from sitting around as obvious plain text -- it is not real security.
const simpleHash = (str) => {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
};
const slugify = (name) => name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
// A plain <a href={dataUrl} download> is unreliable on mobile browsers once
// the data: URL gets large -- several mobile browsers try to navigate to
// it instead of downloading it, which looks like the page reloading. This
// converts the data URL to a Blob and downloads that instead, which mobile
// browsers handle far more consistently. Falls back to opening the image
// in a new tab (so it can still be long-press-saved) if anything goes wrong.
function downloadDataUrl(dataUrl, filename) {
  try {
    const [header, base64] = dataUrl.split(",");
    const mime = (header.match(/data:(.*?);base64/) || [])[1] || "image/png";
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch {
    window.open(dataUrl, "_blank");
  }
}

  PACKED: "Packed", OUT_FOR_DELIVERY: "Out for Delivery", DELIVERED: "Delivered",

};

  CONFIRMED: Check, PREPARING: Flame, COOKED: ChefHat, PACKED: Package,

/* ---------------------------- Domain logic -------------------------------- */

function ageCategory(ageMonths) {
  if (ageMonths < 12) return "puppy";
  if (ageMonths > 84) return "senior";
  return "adult";
}

function calcAutoQty(ingredient, dog, breeds, engine) {
  const breed = breeds.find((b) => b.name === dog.breed) || { sizeFactor: 1 };
  const ageF = engine.ageFactors[ageCategory(dog.ageMonths)] ?? 1;
  const actF = engine.activityFactors[dog.activity] ?? 1;
  let qty = dog.weightKg * ingredient.baseRatePerKg * breed.sizeFactor * ageF * actF;
  qty = Math.round(qty / 5) * 5;
  return Math.max(qty, 0);
}

function resolveCapacity(dateStr, sessionKey, config, slotOverrides) {
  const override = slotOverrides.find((o) => o.date === dateStr && o.session === sessionKey);
  return override ? override.capacity : config.sessions[sessionKey].capacity;
}

function sessionState(dateStr, sessionKey, config, orders, cancelledSlots, forceOpenSlots, slotOverrides) {
  if (cancelledSlots.some((c) => c.date === dateStr && c.session === sessionKey)) return "CANCELLED";
  const sess = config.sessions[sessionKey];
  const capacity = resolveCapacity(dateStr, sessionKey, config, slotOverrides);
  const count = orders.filter((o) => o.date === dateStr && o.session === sessionKey && o.status !== "CANCELLED").length;
  if (count >= capacity) return "FULL";
  const forced = forceOpenSlots.some((f) => f.date === dateStr && f.session === sessionKey);
  const today = todayStr();
  if (dateStr < today) return forced ? "OPEN" : "CLOSED";
  if (dateStr === today) {
    if (forced) return "OPEN";
    const closeM = timeToMin(sess.closeTime);
    const n = nowMin();
    if (n >= closeM) return "CLOSED";
    if (closeM - n <= 30) return "CLOSING_SOON";
    return "OPEN";
  }
  return "OPEN";
}

function slotCount(dateStr, sessionKey, orders) {
  return orders.filter((o) => o.date === dateStr && o.session === sessionKey && o.status !== "CANCELLED").length;
}

function nextAvailableSlot(config, orders, cancelledSlots, forceOpenSlots, slotOverrides) {
  const start = todayStr();
  for (let d = 0; d < 21; d++) {
    const date = addDays(start, d);
    for (const key of ["morning", "evening"]) {
      const st = sessionState(date, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
      if (st === "OPEN" || st === "CLOSING_SOON") return { date, session: key };
    }
  }
  return null;
}

const STATE_STYLE = {
  OPEN: { label: "Open", tone: "good" },
  CLOSING_SOON: { label: "Closing soon", tone: "warn" },
  FULL: { label: "Full", tone: "bad" },
  CLOSED: { label: "Closed", tone: "bad" },
  CANCELLED: { label: "Cancelled", tone: "bad" },
};

function bestFaqMatch(query, faqs) {
  const stop = new Set(["the", "a", "an", "is", "are", "do", "does", "how", "what", "can", "i", "my", "to", "for", "of", "in", "on", "you", "your", "it"]);
  const words = (s) => (s.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => w.length > 1 && !stop.has(w));
  const qWords = words(query);
  if (qWords.length === 0) return null;
  let best = null;
  for (const faq of faqs) {
    const bag = new Set([...words(faq.q), ...words(faq.a)]);
    const score = qWords.reduce((s, w) => s + (bag.has(w) ? 1 : 0), 0);
    if (score > 0 && (!best || score > best.score)) best = { faq, score };
  }
  return best ? best.faq : null;
}

/* ---------------------------- Storage helpers ------------------------------ */

// Merges freshly loaded config with defaults, and migrates any config
// saved before mealChecklist existed (when there was only a single
// mealNote string) into the new array shape, so nothing already
// configured gets silently dropped.
function mergeConfig(raw) {
  const merged = { ...SEED_CONFIG, ...raw, sessions: { ...SEED_CONFIG.sessions, ...(raw.sessions || {}) } };
  if (!Array.isArray(merged.mealChecklist) && raw.mealNote) {
    merged.mealChecklist = [{ id: "migrated_1", text: raw.mealNote }];
  }
  return merged;
}

async function loadOrSeed(key, seed) {
  try {
    const res = await window.storage.get(key, SHARED);
    if (res && res.value != null) return JSON.parse(res.value);
  } catch {
    // Missing key, or a transient read failure -- look the same from here.
    // Either way, don't write anything back on a guess.
  }
  return seed;
}
async function persist(key, value) {
  await window.storage.set(key, JSON.stringify(value), SHARED);
}
// Loads several keys at once. If the storage backend exposes getMany (only
// the Google Sheets shim does -- neither the platform-managed storage nor
// the plain localStorage shim need it), this collapses many network calls
// into one. Everywhere else it just falls back to individual loadOrSeed
// calls, so this is safe to call regardless of which backend is active.
async function loadManyOrSeed(entries) {
  if (typeof window.storage.getMany === "function") {
    try {
      const res = await window.storage.getMany(entries.map(([k]) => k), SHARED);
      return entries.map(([key, seed]) => {
        const raw = res?.values?.[key];
        if (raw != null) {
          try { return JSON.parse(raw); } catch {}
        }
        return seed;
      });
    } catch {
      // fall through to the per-key path below
    }
  }
  return Promise.all(entries.map(([key, seed]) => loadOrSeed(key, seed)));
}

function BowlGauge({ used, capacity, size = 72 }) {
  const pct = capacity > 0 ? Math.min(1, used / capacity) : 0;
  const r = size / 2 - 6;
  const cx = size / 2, cy = size / 2;
  const circumference = 2 * Math.PI * r;
  const full = pct >= 1;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--ring-strong)" strokeWidth="6" />
        <circle
          cx={cx} cy={cy} r={r} fill="none"
          stroke={full ? "var(--clay)" : "var(--turmeric)"}
          strokeWidth="6" strokeLinecap="round"
          strokeDasharray={`${circumference * pct} ${circumference}`}
          transform={`rotate(-90 ${cx} ${cy})`}
          style={{ transition: "stroke-dasharray 0.4s ease" }}
        />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700, color: "var(--ink)" }}>{used}/{capacity}</span>

  );
}

function AddressManager({ myName }) {
  const [addresses, setAddresses] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [geoError, setGeoError] = useState("");

  const load = useCallback(async () => {
    if (!myName) { setAddresses([]); setLoaded(true); return; }
    const rec = await getCustomerRecord(myName);
    setAddresses(rec?.addresses || []);
    setLoaded(true);
  }, [myName]);

  useEffect(() => { load(); }, [load]);

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setGeoError(""); };
  const useDeviceLocation = () => {
    setGeoError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setGeoError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }

   CUSTOMER: Delivery address + radius/fee gate for an order
   ========================================================================= */

// Backward-compatible: a location saved before tiered pricing existed has a
// flat radiusKm/deliveryFee instead of a tiers array. Synthesize a single
// tier from those old fields so nothing already configured breaks.
function getTiers(loc) {
  if (Array.isArray(loc.tiers) && loc.tiers.length > 0) return [...loc.tiers].sort((a, b) => a.maxKm - b.maxKm);
  return [{ maxKm: loc.radiusKm ?? 3, fee: loc.deliveryFee ?? 0 }];
}

function evaluateAddress(addr, locations) {
  const activeLocations = locations.filter((l) => l.active);
  if (activeLocations.length === 0) return { ok: true, deliveryFee: 0, name: null, distance: null };
  let best = null;
  for (const loc of activeLocations) {
    const dist = haversineKm(addr.lat, addr.lng, loc.lat, loc.lng);
    if (!best || dist < best.dist) best = { dist, loc };
  }
  const tiers = getTiers(best.loc);
  const matchedTier = tiers.find((t) => best.dist <= t.maxKm);
  const maxRadius = tiers[tiers.length - 1].maxKm;
  const ok = !!matchedTier;
  return { ok, distance: best.dist, name: best.loc.name, radius: maxRadius, deliveryFee: matchedTier ? matchedTier.fee : 0 };
}

function AddressGate({ myName, locations, resolved, onResolved }) {
  const [addresses, setAddresses] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      const rec = await getCustomerRecord(myName);
      const list = rec?.addresses || [];
      setAddresses(list);
      setLoaded(true);
      if (list.length === 1) selectAddress(list[0]);
    })();
  }, [myName]);

  const selectAddress = (addr) => {
    setSelectedId(addr.id);
    const info = evaluateAddress(addr, locations);
    onResolved(info.ok
      ? { ok: true, deliveryFee: info.deliveryFee, name: info.name, distance: info.distance, address: addr }
      : { ok: false, distance: info.distance, name: info.name, radius: info.radius, address: addr });
  };

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setError(""); };
  const useDeviceLocation = () => {
    setError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => { setError("Couldn't access your location — you can enter coordinates manually below instead."); setGeoBusy(false); },
      { timeout: 8000 }
    );
  };
  const saveNewAddress = async () => {
    if (!form.label.trim() || !form.address.trim()) { setError("Add a label and the address."); return; }
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { setError("Add coordinates — use the location button or enter them manually."); return; }
    const entry = { id: uid("addr_"), label: form.label.trim(), address: form.address.trim(), lat, lng };
    const next = [...addresses, entry];
    setAddresses(next);
    await saveCustomerAddresses(myName, next);
    setForm(null);
    selectAddress(entry);
  };

  if (!loaded) return null;

  if (resolved?.address && resolved.ok) {
    return (
      <Card style={{ marginBottom: 16, background: "var(--tone-good-bg)", border: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, flexWrap: "wrap" }}>
          <MapPin size={16} />
          Delivering to <b>{resolved.address.label}</b> ({resolved.address.address}).
          {resolved.name && <> Within range of <b>{resolved.name}</b>.</>}
          {resolved.deliveryFee > 0 && <Pill>Delivery fee {rupee(resolved.deliveryFee)}</Pill>}
        </div>
        <button onClick={() => { setSelectedId(null); onResolved(null); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline", marginTop: 8 }}>Use a different address</button>
      </Card>
    );
  }

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <MapPin size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Deliver to</div>
      </div>

      {addresses.length > 0 && !form && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          {addresses.map((a) => (
            <button key={a.id} onClick={() => selectAddress(a)} className={"session-card" + (selectedId === a.id ? " selected" : "")} style={{ textAlign: "left" }}>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>{a.label}</div>
              <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{a.address}</div>
            </button>
          ))}
        </div>
      )}

      {resolved?.address && !resolved.ok && (
        <div style={{ marginBottom: 12 }}>
          <Pill tone="bad">Outside delivery area</Pill>
          <p style={{ fontSize: 13.5, marginTop: 8 }}>
            <b>{resolved.address.label}</b> is outside our nearest delivery area, <b>{resolved.name}</b> (which delivers within {resolved.radius} km). We can&apos;t take an order there yet.
          </p>

      {form ? (
        <div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

}

/* ============================================================================
   CUSTOMER: Phone number -- required before ordering, re-confirmed each time
   ========================================================================= */

function PhoneGate({ myName, resolved, onResolved }) {
  const [savedPhone, setSavedPhone] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draftPhone, setDraftPhone] = useState("");
  const [error, setError] = useState("");
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    (async () => {
      const rec = await getCustomerRecord(myName);
      const phone = rec?.phone || "";
      setSavedPhone(phone);
      setDraftPhone(phone);
      setLoaded(true);
      if (!phone) setEditing(true);
    })();
  }, [myName]);

  const validatePhone = (p) => /^[0-9+\-\s()]{7,15}$/.test(p.trim());

  const savePhone = async () => {
    const cleaned = draftPhone.trim();
    if (!validatePhone(cleaned)) { setError("Enter a valid phone number."); return; }
    setSaving(true); setError("");
    await saveCustomerPhone(myName, cleaned);
    setSavedPhone(cleaned);
    setEditing(false);
    setSaving(false);
    onResolved({ ok: false }); // require the explicit "this is correct" confirmation below, even right after saving
  };

  const confirmPhone = () => onResolved({ ok: true, phone: savedPhone });

  if (!loaded) return null;

  if (resolved?.ok && savedPhone) {
    return (
      <Card style={{ marginBottom: 16, background: "var(--tone-good-bg)", border: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, flexWrap: "wrap" }}>
          <Phone size={16} />
          We&apos;ll use <b>{savedPhone}</b> for this order.
          <button onClick={() => { setEditing(true); onResolved({ ok: false }); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Not correct?</button>
        </div>
      </Card>
    );
  }

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Phone size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Contact number</div>
      </div>
      {editing ? (
        <>
          <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "0 0 12px" }}>We&apos;ll use this number to reach you about your order.</p>
          <Field label="Phone number">
            <input style={inputStyle} value={draftPhone} onChange={(e) => setDraftPhone(e.target.value)} placeholder="9876543210" />
          </Field>
          {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 8 }}>{error}</div>}
          <Btn small style={{ marginTop: 12 }} onClick={savePhone} disabled={saving}>{saving ? "Saving…" : "Save number"}</Btn>
        </>
      ) : (
        <>
          <p style={{ fontSize: 14, marginBottom: 12 }}>Please double-check this is correct before placing your order:</p>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 16, fontWeight: 700, marginBottom: 14 }}>{savedPhone}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Btn small onClick={confirmPhone}><Check size={13} /> Yes, this is correct</Btn>
            <Btn small variant="ghost" onClick={() => setEditing(true)}><Pencil size={13} /> Edit number</Btn>
          </div>
        </>
      )}
    </Card>
  );
}

/* ============================================================================
   CUSTOMER: Order food (meal builder → payment → confirmation)
   ========================================================================= */

function OrderFoodView({ myName, dogs, ingredients, breeds, engine, config, orders, cancelledSlots, forceOpenSlots, slotOverrides, locations, qrCode, initialDogId, setOrders, goToOrders }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [dogId, setDogId] = useState(initialDogId || myDogs[0]?.id || "");
  const [dateIdx, setDateIdx] = useState(0);
  const [session, setSession] = useState(null);
  const [selected, setSelected] = useState(new Set(ingredients.filter((i) => i.autoIncluded && i.available).map((i) => i.id)));
  const [customQty, setCustomQty] = useState(() => {
    const m = {};
    ingredients.forEach((i) => { if (i.quantityAdjustable) m[i.id] = i.default; });
    return m;
  });
  const [locationResolved, setLocationResolved] = useState(null);
  const [phoneResolved, setPhoneResolved] = useState({ ok: false });
  const [deliveryNote, setDeliveryNote] = useState("");
  const [leaveAtDoor, setLeaveAtDoor] = useState(false);
  const [uncheckedItems, setUncheckedItems] = useState(new Set()); // items the customer has unchecked (default: all checked)
  const [stage, setStage] = useState("build"); // build -> payment -> done
  const [draftOrder, setDraftOrder] = useState(null);
  const [placed, setPlaced] = useState(null);

  useEffect(() => { if (!dogId && myDogs[0]) setDogId(myDogs[0].id); }, [myDogs.length]);

  // A scroll position carried over from the meal builder (which can get
  // fairly long) otherwise leaves the top of the next screen -- e.g. the QR
  // code on the payment screen -- rendered off the top of the viewport,
  // especially noticeable on mobile where there's no way to see "above" the
  // current scroll position without manually scrolling up.
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [stage]);

  const dog = myDogs.find((d) => d.id === dogId);
  const dates = Array.from({ length: 14 }, (_, i) => addDays(todayStr(), i));
  const date = dates[dateIdx];

  const nextSlot = useMemo(() => nextAvailableSlot(config, orders, cancelledSlots, forceOpenSlots, slotOverrides), [config, orders, cancelledSlots, forceOpenSlots, slotOverrides]);
  const bothFullToday = ["morning", "evening"].every((k) => {
    const st = sessionState(todayStr(), k, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
    return st === "FULL" || st === "CLOSED" || st === "CANCELLED";
  });

  const toggleIngredient = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  const preview = useMemo(() => {
    if (!dog) return [];
    return ingredients
      .filter((i) => selected.has(i.id) && i.available)
      .sort((a, b) => a.displayOrder - b.displayOrder)
      .map((i) => {
        const qty = i.quantityAdjustable ? (customQty[i.id] ?? i.default) : calcAutoQty(i, dog, breeds, engine);
        return { id: i.id, name: i.name, unit: i.unit, qty, pricePerUnit: i.pricePerUnit };
      });
  }, [dog, selected, customQty, ingredients, breeds, engine]);

  const foodTotal = preview.reduce((s, p) => s + p.qty * p.pricePerUnit, 0);
  const deliveryFee = locationResolved?.deliveryFee || 0;
  const subtotal = foodTotal + deliveryFee;
  const gstAmount = config.gstEnabled ? Math.round(subtotal * (config.gstPercent || 0)) / 100 : 0;
  const total = subtotal + gstAmount;

  const buildDraft = () => {
    if (!dog || !session) return null;
    const sessInfo = config.sessions[session];
    return {
      id: uid("ord_"),
      customerName: myName,
      dogId: dog.id,
      dogSnapshot: { name: dog.name, breed: dog.breed, ageMonths: dog.ageMonths, weightKg: dog.weightKg, activity: dog.activity },
      date, session, servingTime: sessInfo.servingTime,
      ingredients: preview,
      foodTotal: Math.round(foodTotal),
      deliveryFee: Math.round(deliveryFee),
      locationName: locationResolved?.name || null,
      customerAddress: locationResolved?.address ? {
        label: locationResolved.address.label,
        address: locationResolved.address.address,
        lat: locationResolved.address.lat,
        lng: locationResolved.address.lng,
      } : null,
      distanceKm: typeof locationResolved?.distance === "number" ? Math.round(locationResolved.distance * 10) / 10 : null,
      gstAmount: Math.round(gstAmount),
      gstPercent: config.gstEnabled ? (config.gstPercent || 0) : 0,
      totalPrice: Math.round(total),
      currencySymbol: config.currencySymbol || "₹",
      mealChecklist: (config.mealChecklist || []).map((item) => ({ id: item.id, text: item.text, accepted: !uncheckedItems.has(item.id) })),
      customerPhone: phoneResolved.phone || "",
      leaveAtDoor,
      deliveryNote: deliveryNote.trim(),
      createdAt: Date.now(),
    };
  };

  const goToPayment = () => {
    const draft = buildDraft();
    if (!draft) return;
    if (qrCode && config.codEnabled) {
      setDraftOrder(draft);
      setStage("choosePayment");
    } else if (qrCode) {
      setDraftOrder(draft);
      setStage("payment");
    } else if (config.codEnabled) {
      finalizeOrder(draft, "CONFIRMED", "cod");
    }
  };

  const finalizeOrder = async (draft, status, paymentMethod = "upi") => {
    const order = { ...draft, status, paymentMethod, paymentClaimedAt: status === "PENDING_PAYMENT" ? Date.now() : null };
    const next = [...orders, order];
    setOrders(next);
    await persist(K.orders, next);
    setPlaced(order);
    setStage("done");
  };

  if (!myName) return <Card><p style={{ margin: 0 }}>Sign in up top before ordering.</p></Card>;
  if (myDogs.length === 0) return <Card><p style={{ margin: 0 }}>Add a dog profile first — head to <b>My Dogs</b>.</p></Card>;
  if (config.orderingPaused) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <Ban size={17} color="var(--clay)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Not taking new orders right now</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>{config.orderingPausedMessage || "We're not taking new orders right now. Please check back soon."}</p>
        </Card>
      </div>
    );
  }
  if (!qrCode && !config.codEnabled) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <QrCode size={17} color="var(--turmeric)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Ordering isn&apos;t open yet</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>Payment isn&apos;t set up yet, so orders can&apos;t be placed right now. Please check back soon.</p>
        </Card>
      </div>
    );
  }

  if (stage === "choosePayment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="How would you like to pay?" />
        <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700, marginBottom: 18 }}>{rupee(draftOrder.totalPrice)}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={() => setStage("payment")} className="session-card" style={{ textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <QrCode size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Pay online now</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Scan a QR code to pay via any UPI app</div>
              </div>
            </div>
          </button>
          <button onClick={() => finalizeOrder(draftOrder, "CONFIRMED", "cod")} className="session-card" style={{ textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Banknote size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Cash on Delivery</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Pay in cash when your order arrives</div>
              </div>
            </div>
          </button>
        </div>
        <Btn full variant="ghost" style={{ marginTop: 14 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
      </div>
    );
  }

  if (stage === "payment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="Scan to pay" />
        <Card style={{ textAlign: "center" }}>
          <img src={qrCode} alt="Payment QR code" style={{ width: "100%", maxWidth: 260, borderRadius: 16, border: "1px solid var(--ring)", margin: "0 auto 16px" }} />
          <div style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700, marginBottom: 4 }}>{rupee(draftOrder.totalPrice)}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", marginBottom: 18 }}>
            {draftOrder.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(draftOrder.date)} &middot; {config.sessions[draftOrder.session].label}
            {draftOrder.deliveryFee > 0 && <> &middot; incl. {rupee(draftOrder.deliveryFee)} delivery</>}
            {draftOrder.gstAmount > 0 && <> &middot; incl. {rupee(draftOrder.gstAmount)} GST</>}
          </div>
          <Btn full variant="outline" onClick={() => downloadDataUrl(qrCode, "payment-qr-code.png")} style={{ marginBottom: 10 }}><Download size={15} /> Download QR code</Btn>
          <Btn full onClick={() => finalizeOrder(draftOrder, "PENDING_PAYMENT")}>I&apos;ve completed the payment</Btn>
          <Btn full variant="ghost" style={{ marginTop: 8 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
          <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 14 }}>Your order is held in your slot as soon as you confirm payment here &mdash; our team verifies it and moves your order to Confirmed.</p>
        </Card>
      </div>
    );
  }

  if (stage === "done" && placed) {
    const pending = placed.status === "PENDING_PAYMENT";
    return (
      <div style={{ maxWidth: 480 }}>
        <Card style={{ textAlign: "center", padding: 32 }}>
          <div style={{ display: "inline-flex", background: pending ? "var(--turmeric)" : "var(--leaf)", borderRadius: "50%", padding: 14, marginBottom: 12 }}>
            {pending ? <CreditCard size={26} color="#1d1d1f" /> : <Check size={26} color="#fff" />}
          </div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 22, fontWeight: 600, marginBottom: 6 }}>{pending ? "Order submitted" : "Order confirmed"}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>
            {placed.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(placed.date)} &middot; {config.sessions[placed.session].label} ({fmtTime(placed.servingTime)})
          </div>
          {pending && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Awaiting payment confirmation from our team.</p>}
          {placed.paymentMethod === "cod" && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Have {rupee(placed.totalPrice)} ready in cash when your order arrives.</p>}
          <Btn onClick={goToOrders}>View my orders <ChevronRight size={15} /></Btn>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Order food" />
      <AddressGate myName={myName} locations={locations} resolved={locationResolved} onResolved={setLocationResolved} />
      <PhoneGate myName={myName} resolved={phoneResolved} onResolved={setPhoneResolved} />

      {!(locationResolved?.ok && phoneResolved.ok) ? null : (
        <>
          {bothFullToday && nextSlot && (
            <Card style={{ marginBottom: 16, background: "var(--tone-warn-bg)", border: "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
                <AlertTriangle size={16} />
                Today&apos;s servings are fully booked. Next available: <b>{fmtDateLabel(nextSlot.date)} &middot; {config.sessions[nextSlot.session].label}</b>.
              </div>
            </Card>
          )}

          <Card style={{ marginBottom: 16 }}>
            <Field label="Dog">
              <select style={inputStyle} value={dogId} onChange={(e) => setDogId(e.target.value)}>
                {myDogs.map((d) => <option key={d.id} value={d.id}>{d.name} &middot; {d.breed}</option>)}
              </select>
            </Field>
          </Card>

          <Card style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Pick a date</div>
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
              {dates.map((d, i) => (
                <button key={d} onClick={() => { setDateIdx(i); setSession(null); }} className={"date-chip" + (i === dateIdx ? " active" : "")}>{fmtDateLabel(d)}</button>
              ))}
            </div>
            <div className="session-grid" style={{ marginTop: 16 }}>
              {["morning", "evening"].map((key) => {
                const st = sessionState(date, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
                const sess = config.sessions[key];
                const capacity = resolveCapacity(date, key, config, slotOverrides);
                const count = slotCount(date, key, orders);
                const disabled = st === "FULL" || st === "CLOSED" || st === "CANCELLED";
                const isSelected = session === key;
                return (
                  <button key={key} disabled={disabled} onClick={() => setSession(key)} className={"session-card" + (isSelected ? " selected" : "")} style={{ opacity: disabled ? 0.55 : 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>{sess.label}</div>
                        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{fmtTime(sess.servingTime)}</div>
                      </div>
                      <BowlGauge used={count} capacity={capacity} size={52} />
                    </div>
                    <div style={{ marginTop: 8 }}><Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill></div>
                  </button>
                );
              })}
            </div>
          </Card>

          {session && dog && (
            <Card>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Build {dog.name}&apos;s meal</div>
              <InfoNote>
                Staples like chicken and rice are portioned automatically from {dog.name}&apos;s weight, breed size, age and activity level, then billed by weight. Egg and other customizable extras are billed per unit you choose.
              </InfoNote>
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 2, marginTop: 14 }}>
                {ingredients.filter((i) => i.available).sort((a, b) => a.displayOrder - b.displayOrder).map((ing) => {
                  const isSel = selected.has(ing.id);
                  const qty = ing.quantityAdjustable ? (customQty[ing.id] ?? ing.default) : calcAutoQty(ing, dog, breeds, engine);
                  const subtotal = qty * ing.pricePerUnit;
                  return (
                    <div key={ing.id} className="ingredient-row">
                      <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flex: 1, minWidth: 0 }}>
                        <input type="checkbox" checked={isSel} onChange={() => toggleIngredient(ing.id)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                        <span style={{ fontFamily: "var(--font-body)", fontSize: 14.5 }}>{ing.name}</span>
                        {ing.quantityAdjustable && <Pill>Customizable</Pill>}
                      </label>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                        {isSel ? (
                          <>
                            {ing.quantityAdjustable ? (
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.max(ing.min, (customQty[ing.id] ?? ing.default) - 1) })} className="stepper-btn"><Minus size={13} /></button>
                                <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, width: 18, textAlign: "center" }}>{customQty[ing.id] ?? ing.default}</span>
                                <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.min(ing.max, (customQty[ing.id] ?? ing.default) + 1) })} className="stepper-btn"><Plus size={13} /></button>
                              </div>
                            ) : (
                              <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700 }}>{qty} {ing.unit}</span>
                            )}
                            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", minWidth: 44, textAlign: "right" }}>{rupee(subtotal)}</span>
                          </>
                        ) : (
                          <span style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--ring-strong)" }}>&mdash;</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {(config.mealChecklist || []).length > 0 && (
                <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                  {config.mealChecklist.map((item) => {
                    const checked = !uncheckedItems.has(item.id);
                    return (
                      <label key={item.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
                        <input
                          type="checkbox" checked={checked}
                          onChange={(e) => {
                            setUncheckedItems((prev) => {
                              const next = new Set(prev);
                              e.target.checked ? next.delete(item.id) : next.add(item.id);
                              return next;
                            });
                          }}
                          style={{ width: 17, height: 17, marginTop: 2, accentColor: "var(--leaf)", flexShrink: 0 }}
                        />
                        <span style={{ fontSize: 13.5, color: "var(--muted)" }}>{item.text}</span>
                      </label>
                    );
                  })}
                </div>
              )}

              <div style={{ marginTop: 18, paddingTop: 16, borderTop: "1.5px dashed var(--ring-strong)" }}>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Delivery instructions</div>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", marginBottom: 12 }}>
                  <input type="checkbox" checked={leaveAtDoor} onChange={(e) => setLeaveAtDoor(e.target.checked)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                  <span style={{ fontSize: 14 }}>Leave at the door</span>
                </label>
                <Field label="Additional requests (optional)">
                  <input style={inputStyle} value={deliveryNote} onChange={(e) => setDeliveryNote(e.target.value)} placeholder="Anything else we should know?" />
                </Field>
              </div>

              <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1.5px dashed var(--ring-strong)", display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Food</span><span>{rupee(foodTotal)}</span></div>
                {deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Delivery{locationResolved?.name ? ` (${locationResolved.name})` : ""}</span><span>{rupee(deliveryFee)}</span></div>}
                {config.gstEnabled && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>GST ({config.gstPercent}%)</span><span>{rupee(gstAmount)}</span></div>}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)" }}>Total</div>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700 }}>{rupee(total)}</div>
                </div>
              </div>
              <Btn onClick={goToPayment} full style={{ marginTop: 14 }} disabled={preview.length === 0}>
                {qrCode ? "Continue to payment" : "Place order (Cash on Delivery)"}
              </Btn>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

/* ============================================================================
   Shared invoice (viewable by customers, printable by admin)
   ========================================================================= */

function InvoiceModal({ order, config, onClose }) {
  if (!order) return null;
  const currency = order.currencySymbol || config.currencySymbol || "₹";
  const money = (n) => `${currency}${Math.round(n).toLocaleString("en-IN")}`;
  return (
    <Modal onCancel={onClose} maxWidth={520}>
      <div className="invoice-print">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18, gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {config.logoDataUrl ? (
              <img src={config.logoDataUrl} alt="" style={{ width: 40, height: 40, borderRadius: 10, objectFit: "cover" }} />
            ) : (
              <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex" }}><Dog size={18} color="#fff" /></div>
            )}
            <div>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 18 }}>{config.serviceName}</div>
              {config.gstNumber && <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)" }}>GSTIN: {config.gstNumber}</div>}
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase" }}>Invoice</div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5 }}>#{order.id.slice(-8)}</div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{fmtDateTime(order.createdAt)}</div>
          </div>
        </div>

        <div className="form-grid-2" style={{ marginBottom: 16 }}>
          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 4 }}>Billed to</div>
            <div style={{ fontSize: 14, fontWeight: 600 }}>{order.customerName}</div>
            {order.customerPhone && <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.customerPhone}</div>}
            {order.customerAddress && <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.customerAddress.address}</div>}
          </div>
          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 4 }}>Order</div>
            <div style={{ fontSize: 13 }}>{order.dogSnapshot.name}&apos;s meal</div>
            <div style={{ fontSize: 13, color: "var(--muted)" }}>{fmtDateLabel(order.date)} &middot; {config.sessions?.[order.session]?.label || order.session}</div>
            <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.paymentMethod === "cod" ? "Cash on Delivery" : "UPI / QR"} &middot; {STATUS_LABEL[order.status]}</div>
          </div>
        </div>

        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 14 }}>
          <thead>
            <tr style={{ borderBottom: "1.5px solid var(--ring-strong)", textAlign: "left" }}>
              <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)" }}>Item</th>
              <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Qty</th>
              <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Rate</th>
              <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Amount</th>
            </tr>
          </thead>
          <tbody>
            {order.ingredients.map((ing) => (
              <tr key={ing.id} style={{ borderBottom: "1px solid var(--ring)" }}>
                <td style={{ padding: "6px 4px" }}>{ing.name}</td>
                <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{ing.qty} {ing.unit}</td>
                <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{money(ing.pricePerUnit)}/{ing.unit}</td>
                <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{money(ing.qty * ing.pricePerUnit)}</td>
              </tr>
            ))}
          </tbody>
        </table>

        <div style={{ display: "flex", flexDirection: "column", gap: 4, marginLeft: "auto", maxWidth: 220 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>Food</span><span>{money(order.foodTotal)}</span></div>
          {order.deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>Delivery</span><span>{money(order.deliveryFee)}</span></div>}
          {order.gstAmount > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>GST ({order.gstPercent}%)</span><span>{money(order.gstAmount)}</span></div>}
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700, marginTop: 6, paddingTop: 6, borderTop: "1.5px solid var(--ring-strong)" }}><span>Total</span><span>{money(order.totalPrice)}</span></div>
        </div>

        {(order.leaveAtDoor || order.deliveryNote) && (
          <div style={{ marginTop: 16, paddingTop: 12, borderTop: "1px dashed var(--ring-strong)", fontSize: 12.5, color: "var(--muted)" }}>
            {order.leaveAtDoor && <div>Leave at the door</div>}
            {order.deliveryNote && <div>{order.deliveryNote}</div>}
          </div>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
        <Btn full onClick={() => window.print()}><Download size={15} /> Print</Btn>
        <Btn full variant="ghost" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
}

/* ============================================================================
   CUSTOMER: My orders
   ========================================================================= */

function MyOrdersView({ myName, orders, config, qrCode }) {
  const mine = orders.filter((o) => o.customerName === myName).sort((a, b) => b.createdAt - a.createdAt);
  const [viewingQrOrder, setViewingQrOrder] = useState(null);
  const [viewingInvoice, setViewingInvoice] = useState(null);
  if (!myName) return <Card><p style={{ margin: 0 }}>Sign in up top to see your orders.</p></Card>;
  if (mine.length === 0) return <Card><p style={{ margin: 0 }}>No orders yet — place one from <b>Order Food</b>.</p></Card>;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="My orders" />
      {viewingInvoice && <InvoiceModal order={viewingInvoice} config={config} onClose={() => setViewingInvoice(null)} />}
      {viewingQrOrder && (
        <Modal onCancel={() => setViewingQrOrder(null)} maxWidth={340}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 12 }}>Scan to pay</div>
            {qrCode ? (
              <>
                <img src={qrCode} alt="Payment QR code" style={{ width: "100%", maxWidth: 240, borderRadius: 16, border: "1px solid var(--ring)", marginBottom: 12 }} />
                <div style={{ fontFamily: "var(--font-display)", fontSize: 22, fontWeight: 700, marginBottom: 14 }}>{rupee(viewingQrOrder.totalPrice)}</div>
                <Btn full variant="outline" onClick={() => downloadDataUrl(qrCode, "payment-qr-code.png")} style={{ marginBottom: 8 }}><Download size={15} /> Download QR code</Btn>
              </>
            ) : (
              <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>No payment QR is currently set up. Contact us for payment options.</p>
            )}
            <Btn full variant="ghost" onClick={() => setViewingQrOrder(null)}>Close</Btn>
          </div>
        </Modal>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {mine.map((o) => {
          const cancelled = o.status === "CANCELLED";
          const pending = o.status === "PENDING_PAYMENT";
          const stepIdx = STATUS_FLOW.indexOf(o.status);
          return (
            <Card key={o.id}>
              <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 17, fontWeight: 600 }}>{o.dogSnapshot.name}&apos;s meal</div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", marginTop: 2 }}>
                    {fmtDateLabel(o.date)} &middot; {config.sessions[o.session]?.label || o.session} ({fmtTime(o.servingTime)}) &middot; {rupee(o.totalPrice)}
                    {o.paymentMethod === "cod" && <> <Pill>COD</Pill></>}
                  </div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--ring-strong)", marginTop: 3 }}>
                    Ordered {fmtDateTime(o.createdAt)}
                    {o.deliveredAt && <> &middot; Delivered {fmtDateTime(o.deliveredAt)}</>}
                  </div>
                </div>
                <Pill tone={cancelled ? "bad" : pending ? "warn" : "good"}>{STATUS_LABEL[o.status]}</Pill>
              </div>

              {pending && (
                <div style={{ marginTop: 12 }}>
                  <p style={{ fontSize: 13, color: "var(--muted)", margin: "0 0 10px" }}>We&apos;re verifying your payment. If you haven&apos;t paid yet, you can view the QR code again below.</p>
                  <Btn small variant="outline" onClick={() => setViewingQrOrder(o)}><QrCode size={13} /> View payment QR again</Btn>
                </div>
              )}

              <div style={{ marginTop: 12 }}>
                <Btn small variant="ghost" onClick={() => setViewingInvoice(o)}><Download size={13} /> View invoice</Btn>
              </div>

              {!cancelled && !pending && (
                <div className="timeline" style={{ marginTop: 18, marginBottom: 4 }}>
                  {STATUS_FLOW.map((s, i) => {
                    const done = i <= stepIdx;
                    const Icon = STATUS_ICON[s];
                    return (
                      <React.Fragment key={s}>
                        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, width: 52 }}>
                          <div style={{ width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: done ? "var(--leaf)" : "var(--surface-muted)", color: done ? "#fff" : "var(--ring-strong)" }}><Icon size={13} /></div>
                          <span style={{ fontSize: 9.5, fontFamily: "var(--font-mono)", textAlign: "center", color: done ? "var(--ink)" : "var(--ring-strong)" }}>{STATUS_LABEL[s].replace("Order ", "")}</span>
                        </div>
                        {i < STATUS_FLOW.length - 1 && <div style={{ flex: 1, height: 2, background: i < stepIdx ? "var(--leaf)" : "var(--ring)", marginBottom: 14 }} />}
                      </React.Fragment>
                    );
                  })}
                </div>
              )}

              <details style={{ marginTop: 10 }}>
                <summary style={{ cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--leaf)" }}>Ingredients</summary>
                <div style={{ marginTop: 8, fontFamily: "var(--font-mono)", fontSize: 13, lineHeight: 1.8 }}>
                  {o.ingredients.map((ing) => (
                    <div key={ing.id} style={{ display: "flex", justifyContent: "space-between" }}><span>{ing.name}</span><span>{ing.qty} {ing.unit} &middot; {rupee(ing.qty * ing.pricePerUnit)}</span></div>
                  ))}
                  {o.deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4, paddingTop: 4, borderTop: "1px dashed var(--ring)" }}><span>Delivery</span><span>{rupee(o.deliveryFee)}</span></div>}
                  {o.gstAmount > 0 && <div style={{ display: "flex", justifyContent: "space-between" }}><span>GST ({o.gstPercent}%)</span><span>{rupee(o.gstAmount)}</span></div>}
                </div>
              </details>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================================
   CUSTOMER: Contact us
   ========================================================================= */

function ContactView({ config }) {
  const hasEmail = !!config.contactEmail;
  const hasPhone = !!config.contactPhone;
  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Contact us" />
      <Card style={{ maxWidth: 440 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 14 }}>{config.serviceName}</div>
        {!hasEmail && !hasPhone ? (

function GalleryView({ myName, dogs, gallery, setGallery, config }) {
  const fileRef = useRef(null);
  const [draftPhoto, setDraftPhoto] = useState(null); // { dataUrl } -- previewed, not yet uploaded
  const [description, setDescription] = useState("");
  const [dogName, setDogName] = useState("");
  const [uploading, setUploading] = useState(false);
  const [warning, setWarning] = useState("");
  const [justSubmitted, setJustSubmitted] = useState(false);
  const [viewingPhoto, setViewingPhoto] = useState(null);

  const myDogs = dogs.filter((d) => d.owner === myName);
  const approved = gallery.filter((p) => p.status === "approved").sort((a, b) => b.createdAt - a.createdAt);
  const mine = gallery.filter((p) => p.customerName === myName);
  const myPending = mine.filter((p) => p.status !== "approved").sort((a, b) => b.createdAt - a.createdAt);

  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if (dataUrl.length > 2_000_000) {
        setWarning("That photo is too large — try a smaller image (most phone photos will need resizing or compressing first, similar to the QR code limit).");
        if (fileRef.current) fileRef.current.value = "";
        setDraftPhoto(null);
        return;
      }
      setWarning("");
      setDraftPhoto({ dataUrl });
    };
    reader.readAsDataURL(file);
  };

  const clearDraft = () => {
    setDraftPhoto(null);
    if (fileRef.current) fileRef.current.value = "";
  };

  const uploadPhoto = async () => {
    if (!draftPhoto) return;
    setUploading(true);
    const entry = {
      id: uid("photo_"), customerName: myName, dogName: dogName || null,
      description: description.trim(), imageDataUrl: draftPhoto.dataUrl,
      status: "pending", createdAt: Date.now(), reviewedAt: null,
    };
    const next = [...gallery, entry];
    setGallery(next);
    await persist(K.gallery, next);
    setUploading(false);
    setJustSubmitted(true);
    setDescription(""); setDogName(""); clearDraft();
    setTimeout(() => setJustSubmitted(false), 7000);
  };

  return (
    <div>
      {viewingPhoto && <PhotoLightbox photo={viewingPhoto} onClose={() => setViewingPhoto(null)} />}
      <SectionTitle eyebrow="Customer" title="Gallery" sub="Photos our customers have shared, reviewed by us before they show up here. Anyone can browse; sign in to share your own." />

      {approved.length === 0 ? (
        <Card style={{ marginBottom: 28 }}><p style={{ margin: 0, color: "var(--muted)" }}>No photos yet &mdash; be the first to share one!</p></Card>
      ) : (
        <div className="responsive-grid" style={{ marginBottom: 28 }}>
          {approved.map((p) => (
            <Card key={p.id} style={{ padding: 0, overflow: "hidden", cursor: "pointer" }} onClick={() => setViewingPhoto(p)}>
              <img src={p.imageDataUrl} alt="" style={{ width: "100%", display: "block" }} />
              <div style={{ padding: 12 }}>
                {p.description && <div style={{ fontSize: 13.5, marginBottom: 6 }}>{p.description}</div>}
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)" }}>{p.dogName ? `${p.dogName} · ` : ""}{p.customerName}</div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {myName && myPending.length > 0 && (
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Your submissions</div>
          <div className="responsive-grid">
            {myPending.map((p) => (
              <Card key={p.id} style={{ padding: 0, overflow: "hidden", cursor: "pointer" }} onClick={() => setViewingPhoto(p)}>
                <img src={p.imageDataUrl} alt="" style={{ width: "100%", display: "block" }} />
                <div style={{ padding: 12 }}>
                  {p.description && <div style={{ fontSize: 13.5, marginBottom: 8 }}>{p.description}</div>}
                  <Pill tone={p.status === "rejected" ? "bad" : "warn"}>{p.status === "rejected" ? "Not approved" : "Pending review"}</Pill>
                </div>

            ))}

      <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Share a photo</div>
      {config.galleryUploadEnabled === false ? (
        <Card style={{ maxWidth: 480, background: "var(--tone-warn-bg)", border: "none" }}>
          <p style={{ margin: 0, fontSize: 14 }}>{config.galleryFullMessage || "Our gallery is full. Mail us your pet photos to get featured on the gallery."}</p>
        </Card>
      ) : !myName ? (
        <Card style={{ maxWidth: 480 }}><p style={{ margin: 0, fontSize: 14 }}>Sign in up top to share a photo of your own.</p></Card>
      ) : (
        <Card style={{ maxWidth: 480 }}>
          {draftPhoto && (
            <div style={{ marginBottom: 14 }}>
              <img src={draftPhoto.dataUrl} alt="" style={{ width: "100%", maxHeight: 260, objectFit: "contain", borderRadius: 12, background: "var(--surface-muted)", display: "block" }} />
              <button onClick={clearDraft} style={{ background: "none", border: "none", color: "var(--clay)", cursor: "pointer", padding: 0, fontSize: 12.5, marginTop: 8, textDecoration: "underline" }}>Remove photo</button>
            </div>
          )}
          <div style={{ marginBottom: 12 }}>
            <input ref={fileRef} type="file" accept="image/*" onChange={onFile} disabled={uploading} />
          </div>
          {myDogs.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <Field label="Dog (optional)">
                <select style={inputStyle} value={dogName} onChange={(e) => setDogName(e.target.value)} disabled={uploading}>
                  <option value="">Not specified</option>
                  {myDogs.map((d) => <option key={d.id} value={d.name}>{d.name}</option>)}
                </select>
              </Field>
            </div>
          )}
          <Field label="Description (optional)">
            <input style={inputStyle} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Goku loved the chicken and pumpkin bowl!" disabled={uploading} />
          </Field>
          {warning && <p style={{ color: "var(--clay)", fontSize: 12.5, marginTop: 10 }}>{warning}</p>}
          <Btn full style={{ marginTop: 14 }} onClick={uploadPhoto} disabled={!draftPhoto || uploading}>
            {uploading ? "Uploading…" : "Upload photo"}
          </Btn>
          {justSubmitted && (
            <div style={{ marginTop: 12 }}>
              <InfoNote>Thanks! Your photo has been submitted and will appear here once it&apos;s been reviewed by us.</InfoNote>
            </div>
          )}
        </Card>
      )}
    </div>
  );
}
