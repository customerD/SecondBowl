function AdminLocations({ locations, setLocations, logAudit }) {
  const [form, setForm] = useState({ name: "", lat: "", lng: "", tiers: [{ maxKm: 3, fee: 0 }] });
  const [geoBusy, setGeoBusy] = useState(false);

  const save = (next) => { setLocations(next); return persist(K.locations, next); };

  const useDeviceLocation = () => {
    setGeoBusy(true);
    if (!navigator.geolocation) { setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => setGeoBusy(false),
      { timeout: 8000 }
    );
  };

  const addLocation = () => {
    if (!form.name.trim() || !form.lat || !form.lng) return;
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) return;
    const tiers = form.tiers.map((t) => ({ maxKm: Number(t.maxKm), fee: Number(t.fee) || 0 })).sort((a, b) => a.maxKm - b.maxKm);
    const next = [...locations, { id: uid("loc_"), name: form.name.trim(), lat, lng, tiers, active: true }];
    const result = save(next);
    logAudit(`Added service area "${form.name.trim()}" with ${tiers.length} distance tier(s), up to ${tiers[tiers.length - 1].maxKm} km`);
    setForm({ name: "", lat: "", lng: "", tiers: [{ maxKm: 3, fee: 0 }] });
    return result;
  };

  const updateLoc = (id, patch) => save(locations.map((l) => (l.id === id ? { ...l, ...patch } : l)));
  const removeLoc = (id) => save(locations.filter((l) => l.id !== id));

  const updateLocTier = (locId, tierIdx, patch) => {
    return save(locations.map((l) => {
      if (l.id !== locId) return l;
      const tiers = getTiers(l).map((t, i) => (i === tierIdx ? { ...t, ...patch } : t));
      return { ...l, tiers, radiusKm: undefined, deliveryFee: undefined };
    }));
  };
  const addLocTier = (locId) => {
    return save(locations.map((l) => {
      if (l.id !== locId) return l;
      const tiers = getTiers(l);
      const lastMax = tiers.length ? tiers[tiers.length - 1].maxKm : 0;
      return { ...l, tiers: [...tiers, { maxKm: lastMax + 2, fee: 0 }], radiusKm: undefined, deliveryFee: undefined };
    }));
  };
  const removeLocTier = (locId, tierIdx) => {
    return save(locations.map((l) => {
      if (l.id !== locId) return l;
      const tiers = getTiers(l).filter((_, i) => i !== tierIdx);
      return { ...l, tiers: tiers.length ? tiers : getTiers(l), radiusKm: undefined, deliveryFee: undefined };
    }));
  };

  return (
    <div>
      <SectionTitle eyebrow="Admin" title="Delivery areas" sub="Each area can have multiple distance tiers with their own delivery fee -- e.g. free within 3km, ₹20 up to 6km, ₹40 beyond that." />

      <Card style={{ marginBottom: 20, maxWidth: 480 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 12 }}>Add a new area</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Field label="Name"><input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="JP Nagar 7th Phase" /></Field>
          <div><Btn small variant="ghost" onClick={useDeviceLocation} disabled={geoBusy}><Navigation size={13} /> {geoBusy ? "Locating…" : "Use my current location"}</Btn></div>
          <div className="form-grid-2">
            <Field label="Latitude"><input style={inputStyle} value={form.lat} onChange={(e) => setForm({ ...form, lat: e.target.value })} placeholder="12.9716" /></Field>
            <Field label="Longitude"><input style={inputStyle} value={form.lng} onChange={(e) => setForm({ ...form, lng: e.target.value })} placeholder="77.5946" /></Field>
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.05em", marginTop: 4 }}>Distance tiers</div>
          {form.tiers.map((t, i) => (
            <div key={i} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Field label="Up to (km)"><input type="number" style={inputStyle} value={t.maxKm} onChange={(e) => setForm({ ...form, tiers: form.tiers.map((x, xi) => (xi === i ? { ...x, maxKm: e.target.value } : x)) })} /></Field>
              <Field label="Fee"><input type="number" style={inputStyle} value={t.fee} onChange={(e) => setForm({ ...form, tiers: form.tiers.map((x, xi) => (xi === i ? { ...x, fee: e.target.value } : x)) })} /></Field>
              {form.tiers.length > 1 && <button onClick={() => setForm({ ...form, tiers: form.tiers.filter((_, xi) => xi !== i) })} style={{ background: "none", border: "none", color: "var(--clay)", cursor: "pointer", marginTop: 18 }}><Trash2 size={14} /></button>}
            </div>
          ))}
          <Btn small variant="ghost" onClick={() => setForm({ ...form, tiers: [...form.tiers, { maxKm: (form.tiers[form.tiers.length - 1]?.maxKm || 0) + 2, fee: 0 }] })}><Plus size={13} /> Add tier</Btn>
        </div>
        <Btn small style={{ marginTop: 14 }} onClick={addLocation}>Add area</Btn>
      </Card>

      <div className="responsive-grid">
        {locations.map((loc) => (
          <Card key={loc.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>{loc.name}</div>
              <button onClick={() => removeLoc(loc.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--clay)" }}><Trash2 size={15} /></button>
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)", margin: "4px 0 10px" }}>{loc.lat.toFixed(4)}, {loc.lng.toFixed(4)}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
              {getTiers(loc).map((t, i) => (
                <div key={i} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ fontSize: 12.5, color: "var(--muted)", width: 70 }}>Up to {t.maxKm}km</span>
                  <input type="number" style={{ ...inputStyle, width: 90 }} value={t.fee} onChange={(e) => updateLocTier(loc.id, i, { fee: Number(e.target.value) })} />
                  {getTiers(loc).length > 1 && <button onClick={() => removeLocTier(loc.id, i)} style={{ background: "none", border: "none", color: "var(--clay)", cursor: "pointer" }}><Trash2 size={13} /></button>}
                </div>
              ))}
              <Btn small variant="ghost" onClick={() => addLocTier(loc.id)}><Plus size={12} /> Add tier</Btn>
            </div>
            <Btn small variant={loc.active ? "danger" : "accent"} onClick={() => updateLoc(loc.id, { active: !loc.active })}>{loc.active ? "Deactivate" : "Activate"}</Btn>
          </Card>
        ))}
      </div>
    </div>
  );
}


function AdminSchedule({ config, orders, cancelledSlots, setCancelledSlots, forceOpenSlots, setForceOpenSlots, slotOverrides, setSlotOverrides, logAudit }) {
  const [capacityDraft, setCapacityDraft] = useState({});

  const days = Array.from({ length: 21 }, (_, i) => addDays(todayStr(), i));

  const setOverrideCapacity = (date, session, capacity) => {
    const next = slotOverrides.filter((o) => !(o.date === date && o.session === session));
    next.push({ date, session, capacity });
    setSlotOverrides(next);
    return persist(K.slotOverrides, next);
  };
  const clearOverrideCapacity = (date, session) => {
    const next = slotOverrides.filter((o) => !(o.date === date && o.session === session));
    setSlotOverrides(next);
    return persist(K.slotOverrides, next);
  };
  const toggleCancelled = (date, session) => {
    const exists = cancelledSlots.some((c) => c.date === date && c.session === session);
    const next = exists
      ? cancelledSlots.filter((c) => !(c.date === date && c.session === session))
      : [...cancelledSlots, { date, session }];
    setCancelledSlots(next);
    logAudit(`${exists ? "Un-cancelled" : "Cancelled"} the ${session} slot on ${fmtDateLabel(date)}`);
    return persist(K.cancelledSlots, next);
  };
  const toggleForced = (date, session) => {
    const exists = forceOpenSlots.some((f) => f.date === date && f.session === session);
    const next = exists
      ? forceOpenSlots.filter((f) => !(f.date === date && f.session === session))
      : [...forceOpenSlots, { date, session }];
    setForceOpenSlots(next);
    logAudit(`${exists ? "Removed force-open from" : "Force-opened"} the ${session} slot on ${fmtDateLabel(date)}`);
    return persist(K.forceOpenSlots, next);
  };

  return (
    <div>
      <SectionTitle eyebrow="Admin" title="Schedule" sub="Override capacity, cancel, or force-open any slot over the next 21 days. Leave a slot alone and it just follows your default settings." />
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
          <thead>
            <tr style={{ textAlign: "left", borderBottom: "1px solid var(--ring-strong)" }}>
              <th style={{ padding: "8px 10px" }}>Date</th>
              {["morning", "evening"].map((s) => <th key={s} style={{ padding: "8px 10px" }}>{config.sessions[s].label}</th>)}
            </tr>
          </thead>
          <tbody>
            {days.map((date) => (
              <tr key={date} style={{ borderBottom: "1px solid var(--ring)" }}>
                <td style={{ padding: "8px 10px", fontFamily: "var(--font-mono)", fontSize: 12.5, whiteSpace: "nowrap" }}>{fmtDateLabel(date)}</td>
                {["morning", "evening"].map((session) => {
                  const capacity = resolveCapacity(date, session, config, slotOverrides);
                  const count = slotCount(date, session, orders);
                  const st = sessionState(date, session, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
                  const draftKey = `${date}_${session}`;
                  const hasOverride = slotOverrides.some((o) => o.date === date && o.session === session);
                  const isCancelled = cancelledSlots.some((c) => c.date === date && c.session === session);
                  const isForced = forceOpenSlots.some((f) => f.date === date && f.session === session);
                  return (
                    <td key={session} style={{ padding: "8px 10px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <input
                          type="number" style={{ ...inputStyle, width: 56, padding: "5px 8px" }}
                          value={capacityDraft[draftKey] ?? capacity}
                          onChange={(e) => setCapacityDraft({ ...capacityDraft, [draftKey]: e.target.value })}
                          onBlur={(e) => { const v = Number(e.target.value); if (!Number.isNaN(v)) setOverrideCapacity(date, session, v); }}
                        />
                        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{count} booked</span>
                        <Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill>
                      </div>
                      <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                        {hasOverride && <button onClick={() => clearOverrideCapacity(date, session)} style={{ background: "none", border: "none", color: "var(--muted)", cursor: "pointer", fontSize: 11.5, textDecoration: "underline", padding: 0 }}>Reset capacity</button>}
                        <button onClick={() => toggleCancelled(date, session)} style={{ background: "none", border: "none", color: isCancelled ? "var(--leaf)" : "var(--clay)", cursor: "pointer", fontSize: 11.5, textDecoration: "underline", padding: 0 }}>{isCancelled ? "Un-cancel" : "Cancel slot"}</button>
                        <button onClick={() => toggleForced(date, session)} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", fontSize: 11.5, textDecoration: "underline", padding: 0 }}>{isForced ? "Un-force" : "Force open"}</button>
                      </div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}


function AdminPayments({ qrCode, setQrCode, config, setConfig, logAudit }) {
  const fileRef = useRef(null);

  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      const dataUrl = reader.result;
      setQrCode(dataUrl);
      await persist(K.qrCode, dataUrl);
      logAudit("Uploaded a new payment QR code");
    };
    reader.readAsDataURL(file);
  };
  const removeQr = async () => { setQrCode(""); await persist(K.qrCode, ""); logAudit("Removed the payment QR code"); };
  const toggleCod = async () => {
    const next = { ...config, codEnabled: !config.codEnabled };
    setConfig(next);
    await persist(K.config, next);
    logAudit(next.codEnabled ? "Enabled Cash on Delivery" : "Disabled Cash on Delivery");
  };
  const toggleAutoPrint = async () => {
    const next = { ...config, autoPrintOnConfirm: !config.autoPrintOnConfirm };
    setConfig(next);
    await persist(K.config, next);
    logAudit(next.autoPrintOnConfirm ? "Enabled auto-print on confirm" : "Disabled auto-print on confirm");
  };

  return (
    <div>
      <SectionTitle eyebrow="Admin" title="Payments" sub="Set up how customers pay. If neither a QR code nor Cash on Delivery is enabled, customers can't place an order at all." />

      <Card style={{ marginBottom: 16, maxWidth: 420 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Cash on Delivery</div>
          <Pill tone={config.codEnabled ? "good" : "bad"}>{config.codEnabled ? "Enabled" : "Disabled"}</Pill>
        </div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 12 }}>
          When enabled, customers can choose to pay in cash at delivery instead of scanning the QR code. These orders skip the "awaiting payment" step and go straight to Confirmed, since there's nothing to verify upfront.
        </p>
        <Btn small variant={config.codEnabled ? "danger" : "accent"} onClick={toggleCod}>
          {config.codEnabled ? "Disable Cash on Delivery" : "Enable Cash on Delivery"}
        </Btn>
      </Card>

      <Card style={{ marginBottom: 16, maxWidth: 420 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Auto-print on confirm</div>
          <Pill tone={config.autoPrintOnConfirm ? "good" : "bad"}>{config.autoPrintOnConfirm ? "Enabled" : "Disabled"}</Pill>
        </div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 12 }}>
          When enabled, confirming an order automatically opens the print dialog with that order's invoice ready to go. One honest limitation: browsers don't allow a webpage to silently send a print job to a printer without a person confirming it -- there's no way around that, by design. This gets you as close as possible: the dialog opens itself, but you'll still need to click "Print" in it each time.
        </p>
        <Btn small variant={config.autoPrintOnConfirm ? "danger" : "accent"} onClick={toggleAutoPrint}>
          {config.autoPrintOnConfirm ? "Disable auto-print" : "Enable auto-print"}
        </Btn>
      </Card>

      <Card style={{ maxWidth: 420 }}>
        {qrCode ? (
          <div style={{ textAlign: "center" }}>
            <img src={qrCode} alt="Current payment QR" style={{ width: "100%", maxWidth: 240, borderRadius: 16, border: "1px solid var(--ring)", marginBottom: 14 }} />
            <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
              <Btn small variant="ghost" onClick={() => fileRef.current?.click()}><Upload size={14} /> Replace</Btn>
              <Btn small variant="danger" onClick={removeQr}><Trash2 size={14} /> Remove</Btn>
            </div>
          </div>
        ) : (
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <QrCode size={40} color="var(--muted)" style={{ marginBottom: 12 }} />
            <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>No payment QR code uploaded yet.</p>
            <Btn small onClick={() => fileRef.current?.click()}><Upload size={15} /> Upload QR code</Btn>
          </div>
        )}
        <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{ display: "none" }} />
      </Card>
    </div>
  );
}


function AdminSettings({ config, setConfig, cancelledSlots, setCancelledSlots, forceOpenSlots, setForceOpenSlots, slotOverrides, setSlotOverrides, logAudit }) {
  const update = (key, patch) => setConfig({ ...config, sessions: { ...config.sessions, [key]: { ...config.sessions[key], ...patch } } });
  const updateIdentity = (patch) => setConfig({ ...config, ...patch });
  // Text/number fields update local state on every keystroke (so typing
  // feels instant) and only actually persist to storage on blur -- once,
  // when the field is done being edited, rather than on every keystroke.
  const commitConfig = async () => { await persist(K.config, config); };
  // Discrete click actions (the GST toggle) have no blur event to hook,
  // so they persist immediately instead.
  const updateIdentityNow = async (patch) => {
    const next = { ...config, ...patch };
    setConfig(next);
    await persist(K.config, next);
  };
  const logoFileRef = useRef(null);
  const [logoWarning, setLogoWarning] = useState("");
  const onLogoFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if (dataUrl.length > 1_000_000) {
        setLogoWarning("That image is too large for a logo -- use a small square icon (usually well under 500KB).");
        if (logoFileRef.current) logoFileRef.current.value = "";
        return;
      }
      setLogoWarning("");
      updateIdentityNow({ logoDataUrl: dataUrl });
    };
    reader.readAsDataURL(file);
  };
  const removeLogo = () => updateIdentityNow({ logoDataUrl: "" });

  const addChecklistItem = () => {
    const next = [...(config.mealChecklist || []), { id: uid("check_"), text: "" }];
    return updateIdentityNow({ mealChecklist: next });
  };
  const updateChecklistItemLocal = (id, text) => {
    setConfig({ ...config, mealChecklist: config.mealChecklist.map((i) => (i.id === id ? { ...i, text } : i)) });
  };
  const removeChecklistItem = (id) => {
    return updateIdentityNow({ mealChecklist: config.mealChecklist.filter((i) => i.id !== id) });
  };

  const cancelToday = async (key) => { const next = [...cancelledSlots, { date: todayStr(), session: key }]; setCancelledSlots(next); await persist(K.cancelledSlots, next); logAudit(`Cancelled today's ${config.sessions[key].label} serving`); };
  const uncancelToday = async (key) => { const next = cancelledSlots.filter((c) => !(c.date === todayStr() && c.session === key)); setCancelledSlots(next); await persist(K.cancelledSlots, next); logAudit(`Reinstated today's ${config.sessions[key].label} serving`); };
  const forceOpenToday = async (key) => { const next = [...forceOpenSlots, { date: todayStr(), session: key }]; setForceOpenSlots(next); await persist(K.forceOpenSlots, next); logAudit(`Manually reopened today's ${config.sessions[key].label} serving`); };
  const undoForceOpen = async (key) => { const next = forceOpenSlots.filter((f) => !(f.date === todayStr() && f.session === key)); setForceOpenSlots(next); await persist(K.forceOpenSlots, next); logAudit(`Reverted today's ${config.sessions[key].label} serving to scheduled hours`); };

  // -- Future dates & slots (any date, not just today) --
  const [pickDate, setPickDate] = useState(todayStr());
  const [pickSession, setPickSession] = useState("morning");
  const [capacityInput, setCapacityInput] = useState("");

  const currentOverride = slotOverrides.find((o) => o.date === pickDate && o.session === pickSession);
  const pickIsCancelled = cancelledSlots.some((c) => c.date === pickDate && c.session === pickSession);
  const pickIsForced = forceOpenSlots.some((f) => f.date === pickDate && f.session === pickSession);
  const pickState = sessionState(pickDate, pickSession, config, [], cancelledSlots, forceOpenSlots, slotOverrides);
  const pickCapacity = resolveCapacity(pickDate, pickSession, config, slotOverrides);

  const setOverrideCapacity = async () => {
    const cap = Number(capacityInput);
    if (Number.isNaN(cap) || cap < 0) return;
    const next = [...slotOverrides.filter((o) => !(o.date === pickDate && o.session === pickSession)), { date: pickDate, session: pickSession, capacity: cap }];
    setSlotOverrides(next);
    await persist(K.slotOverrides, next);
    logAudit(`Set ${config.sessions[pickSession].label} capacity on ${pickDate} to ${cap}`);
    setCapacityInput("");
  };
  const clearOverrideCapacity = async () => {
    const next = slotOverrides.filter((o) => !(o.date === pickDate && o.session === pickSession));
    setSlotOverrides(next);
    await persist(K.slotOverrides, next);
    logAudit(`Reset ${config.sessions[pickSession].label} capacity on ${pickDate} to the default`);
  };
  const cancelPickedDate = async () => {
    const next = [...cancelledSlots, { date: pickDate, session: pickSession }];
    setCancelledSlots(next); await persist(K.cancelledSlots, next);
    logAudit(`Cancelled the ${config.sessions[pickSession].label} serving on ${pickDate}`);
  };
  const uncancelPickedDate = async () => {
    const next = cancelledSlots.filter((c) => !(c.date === pickDate && c.session === pickSession));
    setCancelledSlots(next); await persist(K.cancelledSlots, next);
    logAudit(`Reinstated the ${config.sessions[pickSession].label} serving on ${pickDate}`);
  };
  const forceOpenPickedDate = async () => {
    const next = [...forceOpenSlots, { date: pickDate, session: pickSession }];
    setForceOpenSlots(next); await persist(K.forceOpenSlots, next);
    logAudit(`Manually opened the ${config.sessions[pickSession].label} serving on ${pickDate}`);
  };
  const undoForceOpenPickedDate = async () => {
    const next = forceOpenSlots.filter((f) => !(f.date === pickDate && f.session === pickSession));
    setForceOpenSlots(next); await persist(K.forceOpenSlots, next);
    logAudit(`Reverted the ${config.sessions[pickSession].label} serving on ${pickDate} to scheduled hours`);
  };

  const toggleOrdering = async () => {
    const next = { ...config, orderingPaused: !config.orderingPaused };
    setConfig(next);
    await persist(K.config, next);
    logAudit(next.orderingPaused ? "Paused new orders" : "Resumed accepting new orders");
  };

  return (
    <div>
      <SectionTitle eyebrow="Admin" title="Operations settings" />

      <Card style={{ marginBottom: 16, background: config.orderingPaused ? "var(--tone-bad-bg)" : undefined, border: config.orderingPaused ? "none" : undefined }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <Ban size={17} color={config.orderingPaused ? "var(--clay)" : "var(--leaf)"} />
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Ordering</div>
          <Pill tone={config.orderingPaused ? "bad" : "good"}>{config.orderingPaused ? "Paused" : "Accepting orders"}</Pill>
        </div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "0 0 14px" }}>
          {config.orderingPaused
            ? "Customers can't place new orders right now. Anyone with an existing order can still see it in My Orders."
            : "Customers can place orders normally. Pausing stops new orders instantly, without affecting orders already placed."}
        </p>
        <Btn variant={config.orderingPaused ? "accent" : "danger"} onClick={toggleOrdering}>
          {config.orderingPaused ? <><Check size={15} /> Resume accepting orders</> : <><Ban size={15} /> Pause new orders</>}
        </Btn>
        <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed var(--ring-strong)" }}>
          <Field label="Message shown to customers while paused">
            <input style={inputStyle} value={config.orderingPausedMessage} onChange={(e) => updateIdentity({ orderingPausedMessage: e.target.value })} onBlur={commitConfig} placeholder="We're not taking new orders right now. Please check back soon." />
          </Field>
          <p style={{ fontSize: 11.5, color: "var(--muted)", marginTop: 8 }}>Saves automatically when you click away from the field.</p>
        </div>
      </Card>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <Building2 size={17} color="var(--leaf)" />
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Business identity</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
          {config.logoDataUrl ? (
            <img src={config.logoDataUrl} alt="Logo" style={{ width: 44, height: 44, borderRadius: 10, objectFit: "cover", border: "1px solid var(--ring)" }} />
          ) : (
            <div style={{ width: 44, height: 44, borderRadius: 10, background: "var(--leaf)", display: "flex", alignItems: "center", justifyContent: "center" }}><Dog size={20} color="#fff" /></div>
          )}
          <Btn small variant="ghost" onClick={() => logoFileRef.current?.click()}><Upload size={13} /> {config.logoDataUrl ? "Replace logo" : "Upload logo"}</Btn>
          {config.logoDataUrl && <Btn small variant="ghost" onClick={removeLogo}><Trash2 size={13} /> Remove</Btn>}
          <input ref={logoFileRef} type="file" accept="image/*" onChange={onLogoFile} style={{ display: "none" }} />
        </div>
        {logoWarning && <p style={{ fontSize: 12, color: "var(--clay)", marginBottom: 12 }}>{logoWarning}</p>}
        <div className="form-grid-2">
          <Field label="Business name"><input style={inputStyle} value={config.serviceName} onChange={(e) => updateIdentity({ serviceName: e.target.value })} onBlur={commitConfig} /></Field>
          <Field label="Tagline"><input style={inputStyle} value={config.tagline} onChange={(e) => updateIdentity({ tagline: e.target.value })} onBlur={commitConfig} /></Field>
          <Field label="Contact email"><input type="email" style={inputStyle} value={config.contactEmail} onChange={(e) => updateIdentity({ contactEmail: e.target.value })} onBlur={commitConfig} placeholder="hello@secondbowl.com" /></Field>
          <Field label="Contact phone"><input style={inputStyle} value={config.contactPhone} onChange={(e) => updateIdentity({ contactPhone: e.target.value })} onBlur={commitConfig} placeholder="+91 90000 00000" /></Field>
        </div>
        <div style={{ marginTop: 12 }}>
          <Field label="About us">
            <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} value={config.aboutUs} onChange={(e) => updateIdentity({ aboutUs: e.target.value })} onBlur={commitConfig} placeholder="What we are, and what we do." />
          </Field>
        </div>
        <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 10 }}>Shown to customers on the Contact tab, under the contact details.</p>
      </Card>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 10 }}>Billing</div>
        <div className="form-grid-2">
          <Field label="Currency symbol"><input style={inputStyle} value={config.currencySymbol} onChange={(e) => updateIdentity({ currencySymbol: e.target.value })} placeholder="₹" /></Field>
          <Field label="GST rate (%)"><input type="number" min={0} step="0.5" style={inputStyle} value={config.gstPercent} onChange={(e) => updateIdentity({ gstPercent: Number(e.target.value) })} disabled={!config.gstEnabled} /></Field>
        </div>
        <div style={{ marginTop: 14 }}>
          <Btn small variant={config.gstEnabled ? "accent" : "ghost"} onClick={() => updateIdentity({ gstEnabled: !config.gstEnabled })}>
            {config.gstEnabled ? "GST is ON \u2014 click to turn off" : "GST is OFF \u2014 click to turn on"}
          </Btn>
        </div>
        <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 10 }}>When GST is on, it's added on top of food + delivery for every new order and shown as its own line item to customers and in Orders. Doesn't apply to orders already placed.</p>
      </Card>

      <Card style={{ marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 10 }}>Meal builder checklist</div>
        <p style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 12 }}>Shown as checked-by-default checkboxes on the Order Food page, just above the total. Add as many as you like.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {(config.mealChecklist || []).map((item) => (
            <div key={item.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input
                style={{ ...inputStyle, flex: 1 }} value={item.text}
                onChange={(e) => updateChecklistItemLocal(item.id, e.target.value)}
                onBlur={commitConfig}
                placeholder="A pinch of salt, turmeric and ghee will be added."
              />
              <button onClick={() => removeChecklistItem(item.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--clay)", padding: 6 }}><Trash2 size={15} /></button>
            </div>
          ))}
          {(config.mealChecklist || []).length === 0 && <p style={{ fontSize: 13, color: "var(--muted)", margin: 0 }}>No checklist items yet.</p>}
        </div>
        <Btn small variant="ghost" style={{ marginTop: 12 }} onClick={addChecklistItem}><Plus size={13} /> Add item</Btn>
      </Card>

      <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Default schedule &amp; today</div>
      <div className="session-grid">
        {["morning", "evening"].map((key) => {
          const sess = config.sessions[key];
          const st = sessionState(todayStr(), key, config, [], cancelledSlots, forceOpenSlots, slotOverrides);
          const isCancelled = cancelledSlots.some((c) => c.date === todayStr() && c.session === key);
          const isForced = forceOpenSlots.some((f) => f.date === todayStr() && f.session === key);
          return (
            <Card key={key}>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17, marginBottom: 12 }}>{sess.label} session</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <Field label="Serving time"><input type="time" style={inputStyle} value={sess.servingTime} onChange={(e) => update(key, { servingTime: e.target.value })} onBlur={commitConfig} /></Field>
                <Field label="Orders close at"><input type="time" style={inputStyle} value={sess.closeTime} onChange={(e) => update(key, { closeTime: e.target.value })} onBlur={commitConfig} /></Field>
                <Field label="Default capacity (orders)"><input type="number" min={0} style={inputStyle} value={sess.capacity} onChange={(e) => update(key, { capacity: Number(e.target.value) })} onBlur={commitConfig} /></Field>
              </div>
              <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed var(--ring-strong)", display: "flex", flexDirection: "column", gap: 8 }}>
                <div>Today&apos;s status: <Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill></div>
                {isCancelled ? <Btn small variant="ghost" onClick={() => uncancelToday(key)}><RefreshCw size={13} /> Reinstate today&apos;s session</Btn> : <Btn small variant="danger" onClick={() => cancelToday(key)}><Ban size={13} /> Cancel today&apos;s session</Btn>}
                {!isCancelled && (isForced ? <Btn small variant="ghost" onClick={() => undoForceOpen(key)}><Clock size={13} /> Revert to scheduled hours</Btn> : <Btn small variant="accent" onClick={() => forceOpenToday(key)}><Unlock size={13} /> Open this slot now</Btn>)}
              </div>
            </Card>
          );
        })}
      </div>
      <p style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)", marginTop: 16, marginBottom: 28, maxWidth: 560 }}>
        Every field above saves itself automatically (as soon as you click away from it, or immediately for toggles) &mdash; there's nothing separate to save. Reducing capacity below the number of orders already placed will never cancel those confirmed orders &mdash; it only blocks new ones. "Open this slot now" overrides today's close time so customers can keep ordering past the scheduled cutoff, until it's full or you revert it.
      </p>

      <SectionTitle eyebrow="Admin" title="Future dates & slots" sub="Override capacity, or cancel / force-open, for any specific date instead of just today. Customers can currently book up to 14 days ahead." />
      <Card style={{ maxWidth: 460 }}>
        <div className="form-grid-2" style={{ marginBottom: 14 }}>
          <Field label="Date"><input type="date" style={inputStyle} value={pickDate} min={todayStr()} onChange={(e) => setPickDate(e.target.value)} /></Field>
          <Field label="Session">
            <select style={inputStyle} value={pickSession} onChange={(e) => setPickSession(e.target.value)}>
              <option value="morning">{config.sessions.morning.label}</option>
              <option value="evening">{config.sessions.evening.label}</option>
            </select>
          </Field>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          <span style={{ fontSize: 13.5 }}>Current status:</span>
          <Pill tone={STATE_STYLE[pickState].tone}>{STATE_STYLE[pickState].label}</Pill>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)" }}>
            Capacity: {pickCapacity} {currentOverride ? "(custom)" : "(default)"}
          </span>
        </div>

        <Field label={`Set capacity for ${fmtDateLabel(pickDate)} \u2014 ${config.sessions[pickSession].label}`}>
          <div style={{ display: "flex", gap: 8 }}>
            <input type="number" min={0} style={inputStyle} value={capacityInput} onChange={(e) => setCapacityInput(e.target.value)} placeholder={String(pickCapacity)} />
            <Btn small onClick={setOverrideCapacity}>Set</Btn>
          </div>
        </Field>
        {currentOverride && <Btn small variant="ghost" style={{ marginTop: 8 }} onClick={clearOverrideCapacity}><RefreshCw size={13} /> Reset to default capacity</Btn>}

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 16, paddingTop: 14, borderTop: "1px dashed var(--ring-strong)" }}>
          {pickIsCancelled
            ? <Btn small variant="ghost" onClick={uncancelPickedDate}><RefreshCw size={13} /> Reinstate this serving</Btn>
            : <Btn small variant="danger" onClick={cancelPickedDate}><Ban size={13} /> Cancel this serving</Btn>}
          {!pickIsCancelled && (pickIsForced
            ? <Btn small variant="ghost" onClick={undoForceOpenPickedDate}><Clock size={13} /> Revert to scheduled hours</Btn>
            : <Btn small variant="accent" onClick={forceOpenPickedDate}><Unlock size={13} /> Force this slot open</Btn>)}
        </div>
      </Card>
    </div>
  );
}


function AdminOrders({ orders, setOrders, config, logAudit, initialFilter, onConsumeInitialFilter, onRefresh }) {
  const [openId, setOpenId] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const handleRefresh = async () => { setRefreshing(true); await onRefresh?.(); setRefreshing(false); };
  const [filters, setFilters] = useState({
    orderSearch: "", customer: "", dog: "", session: "", date: "",
    location: "", status: "", amountMin: "", amountMax: "",
  });

  // Arriving here from the dashboard's "Next up to be served" card: apply
  // its date/session as a filter and open the panel so it's obvious why
  // the list is narrowed.
  useEffect(() => {
    if (initialFilter) {
      setFilters((f) => ({ ...f, date: initialFilter.date || "", session: initialFilter.session || "" }));
      setShowFilters(true);
      onConsumeInitialFilter?.();
    }
  }, [initialFilter]);

  const setFilter = (key, value) => setFilters((f) => ({ ...f, [key]: value }));
  const clearFilters = () => setFilters({ orderSearch: "", customer: "", dog: "", session: "", date: "", location: "", status: "", amountMin: "", amountMax: "" });
  const activeFilterCount = Object.values(filters).filter((v) => v !== "").length;

  // Legacy orders (older than yesterday) stay fully intact in storage --
  // this view just doesn't clutter itself with them by default. Nothing is
  // deleted; Admin -> Data's exports and the underlying sheet still have
  // everything.
  const cutoff = addDays(todayStr(), -1);
  const recentOrders = useMemo(() => orders.filter((o) => o.date >= cutoff), [orders, cutoff]);

  const customerOptions = useMemo(() => [...new Set(recentOrders.map((o) => o.customerName))].sort(), [recentOrders]);
  const dogOptions = useMemo(() => [...new Set(recentOrders.map((o) => o.dogSnapshot.name))].sort(), [recentOrders]);
  const locationOptions = useMemo(() => [...new Set(recentOrders.map((o) => o.locationName).filter(Boolean))].sort(), [recentOrders]);

  const filtered = useMemo(() => {
    return [...recentOrders].sort((a, b) => b.createdAt - a.createdAt).filter((o) => {
      if (filters.orderSearch && !o.id.toLowerCase().includes(filters.orderSearch.toLowerCase())) return false;
      if (filters.customer && o.customerName !== filters.customer) return false;
      if (filters.dog && o.dogSnapshot.name !== filters.dog) return false;
      if (filters.session && o.session !== filters.session) return false;
      if (filters.date && o.date !== filters.date) return false;
      if (filters.location && o.locationName !== filters.location) return false;
      if (filters.status && o.status !== filters.status) return false;
      if (filters.amountMin && o.totalPrice < Number(filters.amountMin)) return false;
      if (filters.amountMax && o.totalPrice > Number(filters.amountMax)) return false;
      return true;
    });
  }, [recentOrders, filters]);

  const confirmedTotal = useMemo(() => filtered.filter((o) => STATUS_FLOW.includes(o.status)).reduce((s, o) => s + (o.totalPrice || 0), 0), [filtered]);
  const [viewingInvoice, setViewingInvoice] = useState(null);
  const [autoPrintOrder, setAutoPrintOrder] = useState(null);

  const updateStatus = async (order, newStatus) => {
    const next = orders.map((o) => (o.id === order.id
      ? { ...o, status: newStatus, deliveredAt: newStatus === "DELIVERED" ? Date.now() : null }
      : o));
    setOrders(next);
    await persist(K.orders, next);
    logAudit(`Order for ${order.dogSnapshot.name} (${order.customerName}) moved to ${STATUS_LABEL[newStatus]}`);
    if (newStatus === "CONFIRMED" && config.autoPrintOnConfirm) {
      setAutoPrintOrder({ ...order, status: newStatus });
    }
  };

  const copyTrackingLink = async (order) => {
    const url = `${window.location.origin}${window.location.pathname}?order=${order.id}`;
    await navigator.clipboard.writeText(url);
    await new Promise((r) => setTimeout(r, 900));
  };

  if (recentOrders.length === 0) return <div><SectionTitle eyebrow="Admin" title="Orders" sub="Showing yesterday, today, and upcoming orders. Older orders stay in Google Sheets and aren't deleted -- just not shown here." /><Card><p style={{ margin: 0 }}>No orders in this range yet.</p></Card></div>;

  return (
    <div>
      {viewingInvoice && <InvoiceModal order={viewingInvoice} config={config} onClose={() => setViewingInvoice(null)} />}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <SectionTitle eyebrow="Admin" title="Orders" sub="Showing yesterday, today, and upcoming orders. Older orders stay in Google Sheets and aren't deleted -- just not shown here." />
        <div style={{ display: "flex", gap: 8 }}>
          <Btn small variant="ghost" onClick={handleRefresh} disabled={refreshing}><RefreshCw size={13} /> {refreshing ? "Refreshing\u2026" : "Refresh"}</Btn>
          <Btn small variant={activeFilterCount > 0 ? "accent" : "ghost"} onClick={() => setShowFilters((s) => !s)}>
            <SlidersHorizontal size={13} /> Filters{activeFilterCount > 0 ? ` (${activeFilterCount})` : ""}
          </Btn>
        </div>
      </div>

      {showFilters && (
        <Card style={{ marginBottom: 16 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 12 }}>
            <Field label="Order"><input style={inputStyle} value={filters.orderSearch} onChange={(e) => setFilter("orderSearch", e.target.value)} placeholder="#id" /></Field>
            <Field label="Customer">
              <select style={inputStyle} value={filters.customer} onChange={(e) => setFilter("customer", e.target.value)}>
                <option value="">All customers</option>
                {customerOptions.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Dog">
              <select style={inputStyle} value={filters.dog} onChange={(e) => setFilter("dog", e.target.value)}>
                <option value="">All dogs</option>
                {dogOptions.map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
            </Field>
            <Field label="Slot &mdash; date"><input type="date" style={inputStyle} value={filters.date} onChange={(e) => setFilter("date", e.target.value)} /></Field>
            <Field label="Slot &mdash; session">
              <select style={inputStyle} value={filters.session} onChange={(e) => setFilter("session", e.target.value)}>
                <option value="">All sessions</option>
                <option value="morning">{config.sessions.morning.label}</option>
                <option value="evening">{config.sessions.evening.label}</option>
              </select>
            </Field>
            <Field label="Delivery area">
              <select style={inputStyle} value={filters.location} onChange={(e) => setFilter("location", e.target.value)}>
                <option value="">All areas</option>
                {locationOptions.map((l) => <option key={l} value={l}>{l}</option>)}
              </select>
            </Field>
            <Field label="Status">
              <select style={inputStyle} value={filters.status} onChange={(e) => setFilter("status", e.target.value)}>
                <option value="">All statuses</option>
                {["PENDING_PAYMENT", ...STATUS_FLOW, "CANCELLED"].map((s) => <option key={s} value={s}>{STATUS_LABEL[s]}</option>)}
              </select>
            </Field>
            <div className="form-grid-2">
              <Field label="Amount min"><input type="number" style={inputStyle} value={filters.amountMin} onChange={(e) => setFilter("amountMin", e.target.value)} /></Field>
              <Field label="Amount max"><input type="number" style={inputStyle} value={filters.amountMax} onChange={(e) => setFilter("amountMax", e.target.value)} /></Field>
            </div>
          </div>
          {activeFilterCount > 0 && <Btn small variant="ghost" style={{ marginTop: 12 }} onClick={clearFilters}>Clear filters</Btn>}
        </Card>
      )}

      <p style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", margin: "0 0 16px" }}>
        {filtered.length} order{filtered.length === 1 ? "" : "s"} &middot; {rupee(confirmedTotal)} confirmed total
      </p>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.map((o) => {
          const open = openId === o.id;
          const pending = o.status === "PENDING_PAYMENT";
          const cancelled = o.status === "CANCELLED";
          return (
            <Card key={o.id} style={{ cursor: "pointer" }}>
              <div onClick={() => setOpenId(open ? null : o.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>
                    {o.dogSnapshot.name}&apos;s meal &middot; {o.customerName}
                    {o.paymentMethod === "cod" && <Pill style={{ marginLeft: 8 }}>COD</Pill>}
                  </div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>
                    {fmtDateLabel(o.date)} &middot; {config.sessions[o.session]?.label || o.session} &middot; {rupee(o.totalPrice)}
                  </div>
                </div>
                <Pill tone={o.status === "CANCELLED" ? "bad" : o.status === "PENDING_PAYMENT" ? "warn" : o.status === "DELIVERED" ? "good" : "default"}>{STATUS_LABEL[o.status]}</Pill>
              </div>

              {open && (
                <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--ring)" }}>
                  <div style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 10 }}>
                    Order {o.id.slice(-8)} &middot; Placed {fmtDateTime(o.createdAt)}
                    {o.customerPhone && <> &middot; {o.customerPhone}</>}
                  </div>
                  {o.customerAddress && (
                    <div style={{ fontSize: 13.5, marginBottom: 10 }}>
                      <b>{o.customerAddress.label}</b> &mdash; {o.customerAddress.address}
                    </div>
                  )}
                  <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
                    {(o.ingredients || []).map((ing) => (
                      <div key={ing.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                        <span>{ing.name}</span>
                        <span style={{ fontFamily: "var(--font-mono)" }}>{ing.qty} {ing.unit}</span>
                      </div>
                    ))}
                  </div>

                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {pending && (
                      <>
                        <Btn small onClick={() => updateStatus(o, "CONFIRMED")}><Check size={13} /> Confirm payment</Btn>
                        <Btn small variant="danger" onClick={() => updateStatus(o, "CANCELLED")}>Cancel order</Btn>
                      </>
                    )}
                    {!pending && !cancelled && (
                      <>
                        {STATUS_FLOW.map((s) => (
                          <Btn key={s} small variant={o.status === s ? "primary" : "outline"} onClick={() => updateStatus(o, s)} disabled={STATUS_FLOW.indexOf(s) < STATUS_FLOW.indexOf(o.status)}>
                            {STATUS_LABEL[s]}
                          </Btn>
                        ))}
                        <Btn small variant="danger" onClick={() => updateStatus(o, "CANCELLED")}>Cancel</Btn>
                      </>
                    )}
                    {cancelled && <Btn small variant="ghost" onClick={() => updateStatus(o, "PENDING_PAYMENT")}>Reopen</Btn>}
                    <Btn small variant="ghost" onClick={() => setViewingInvoice(o)}><Download size={13} /> Print invoice</Btn>
                    <Btn small variant="ghost" onClick={() => copyTrackingLink(o)} loadingText="Copied!"><Link2 size={13} /> Copy tracking link</Btn>
                  </div>
                </div>
              )}
            </Card>
          );
        })}
      </div>

      {autoPrintOrder && <SilentPrintTrigger order={autoPrintOrder} config={config} onDone={() => setAutoPrintOrder(null)} />}
    </div>
  );
}


function AdminData({ orders, setOrders, dogs, setDogs, communityPosts, setCommunityPosts, communityComments, setCommunityComments, communityLikes, setCommunityLikes, allAddresses, setAllAddresses, audit, logAudit }) {
  const [customers, setCustomers] = useState(null);
  const [loadingCustomers, setLoadingCustomers] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [testResult, setTestResult] = useState(null);
  const [testing, setTesting] = useState(false);
  const [clearConfirmText, setClearConfirmText] = useState("");
  const [clearing, setClearing] = useState(false);
  const [clearDone, setClearDone] = useState(false);
  const fileRef = useRef(null);

  const CLEAR_PHRASE = "DELETE EVERYTHING";
  const clearAllData = async () => {
    setClearing(true);
    setOrders([]); await persist(K.orders, []);
    await persist(K.orderItems, []);
    setDogs([]); await persist(K.dogs, []);
    setCommunityPosts([]); await persist(K.communityPosts, []);
    setCommunityComments([]); await persist(K.communityComments, []);
    setCommunityLikes([]); await persist(K.communityLikes, []);
    setAllAddresses([]); await persist(K.addresses, []);

    // Delete every customer account too -- this is what "customer details"
    // means concretely, since accounts live as their own keys rather than
    // a single collection.
    try {
      const list = await window.storage.list("dfp:customer:", true);
      await Promise.all((list?.keys || []).map((k) => window.storage.delete(k, true)));
    } catch {}

    logAudit("Admin cleared ALL order and customer data (orders, order items, dogs, addresses, Community posts/comments/likes, and every customer account).");
    setCustomers([]);
    setClearing(false);
    setClearDone(true);
    setClearConfirmText("");
  };

  const testConnection = async () => {
    setTesting(true); setTestResult(null);
    const backend = typeof window !== "undefined" ? window.__STORAGE_BACKEND__ : undefined;
    if (backend !== "sheets") {
      setTestResult({ ok: null, message: "Not using Google Sheets right now — nothing to test. Set SHEETS_API_URL in the HTML file to connect one." });
      setTesting(false);
      return;
    }
    try {
      const res = await window.storage.list("", true);
      setTestResult({ ok: true, message: `Connected successfully — found ${res?.keys?.length ?? 0} stored key(s) in the sheet.` });
    } catch (err) {
      setTestResult({ ok: false, message: String(err?.message || err || "Unknown error") });
    }
    setTesting(false);
  };

  const loadCustomers = async () => {
    setLoadingCustomers(true);
    try {
      const list = await window.storage.list("dfp:customer:", true);
      const recs = await Promise.all(
        (list?.keys || []).map(async (k) => {
          try {
            const r = await window.storage.get(k, true);
            return JSON.parse(r.value);
          } catch { return null; }
        })
      );
      setCustomers(recs.filter(Boolean).sort((a, b) => a.name.localeCompare(b.name)));
    } catch {
      setCustomers([]);
    }
    setLoadingCustomers(false);
  };

  useEffect(() => { loadCustomers(); }, []);

  const exportCustomersCsv = () => {
    if (!customers) return;
    const csv = toCsv(customers, [
      { label: "Name", get: (c) => c.name },
      { label: "Account created", get: (c) => new Date(c.createdAt).toLocaleString() },
      { label: "Dogs", get: (c) => dogs.filter((d) => d.owner === c.name).length },
      { label: "Orders", get: (c) => orders.filter((o) => o.customerName === c.name).length },
    ]);
    downloadTextFile("customers.csv", "text/csv", csv);
  };
  const exportOrdersCsv = () => {
    const csv = toCsv(orders, [
      { label: "Order ID", get: (o) => o.id },
      { label: "Customer", get: (o) => o.customerName },
      { label: "Dog", get: (o) => o.dogSnapshot.name },
      { label: "Date", get: (o) => o.date },
      { label: "Session", get: (o) => o.session },
      { label: "Status", get: (o) => o.status },
      { label: "Food total", get: (o) => o.foodTotal ?? "" },
      { label: "Delivery fee", get: (o) => o.deliveryFee ?? 0 },
      { label: "Total", get: (o) => o.totalPrice },
      { label: "Address label", get: (o) => o.customerAddress?.label ?? "" },
      { label: "Address", get: (o) => o.customerAddress?.address ?? "" },
      { label: "Latitude", get: (o) => o.customerAddress?.lat ?? "" },
      { label: "Longitude", get: (o) => o.customerAddress?.lng ?? "" },
      { label: "Placed at", get: (o) => new Date(o.createdAt).toLocaleString() },
      { label: "Delivered at", get: (o) => (o.deliveredAt ? new Date(o.deliveredAt).toLocaleString() : "") },
    ]);
    downloadTextFile("orders.csv", "text/csv", csv);
  };
  const exportAuditCsv = () => {
    const csv = toCsv(audit, [
      { label: "Timestamp", get: (a) => new Date(a.ts).toLocaleString() },
      { label: "Details", get: (a) => a.details },
    ]);
    downloadTextFile("audit-log.csv", "text/csv", csv);
  };

  const exportAllJson = async () => {
    const keys = Object.values(K);
    const dump = {};
    for (const key of keys) {
      try { const r = await window.storage.get(key, true); dump[key] = JSON.parse(r.value); } catch { dump[key] = null; }
    }
    dump.__customers = customers || [];
    dump.__exportedAt = new Date().toISOString();
    downloadTextFile(`second-bowl-backup-${todayStr()}.json`, "application/json", JSON.stringify(dump, null, 2));
    logAudit("Exported a full data backup");
  };

  const importAllJson = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const dump = JSON.parse(reader.result);
        for (const key of Object.values(K)) {
          if (dump[key] !== undefined && dump[key] !== null) await persist(key, dump[key]);
        }
        if (Array.isArray(dump.__customers)) {
          for (const c of dump.__customers) {
            if (c?.name) await window.storage.set(customerKey(c.name), JSON.stringify(c), true);
          }
        }
        setImportMsg("Backup restored. Reload the page to see everything reflected everywhere.");
        logAudit("Restored data from an uploaded backup file");
        loadCustomers();
      } catch {
        setImportMsg("Couldn't read that file — make sure it's a backup exported from here.");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>

/* ============================================================================
   Chat helper widget (local keyword matching against admin's FAQ list)
   ========================================================================= */

function ChatWidget({ faqs }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const listRef = useRef(null);
  const widgetRef = useRef(null);

  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [messages, open]);

  // Tapping anywhere outside the chatbot closes it. Only listens while it's
  // open, so this can't interfere with normal page interaction otherwise.
  useEffect(() => {
    if (!open) return;
    const onOutside = (e) => {
      if (widgetRef.current && !widgetRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", onOutside);
    document.addEventListener("touchstart", onOutside);
    return () => {
      document.removeEventListener("mousedown", onOutside);
      document.removeEventListener("touchstart", onOutside);
    };
  }, [open]);

  const send = (text) => {
    const q = (text ?? input).trim();
    if (!q) return;
    const match = bestFaqMatch(q, faqs);
    setMessages((m) => [...m, { from: "user", text: q }, { from: "bot", text: match ? match.a : "I don't have an answer for that yet. Here are some things people usually ask:", suggestChips: !match }]);
    setInput("");
  };

  return (
    <div ref={widgetRef}>
      <button onClick={() => setOpen((o) => !o)} className="chat-fab" aria-label="Help">
        {open ? <X size={22} /> : <MessageCircle size={22} />}
      </button>
      {open && (
        <div className="chat-panel">
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "14px 16px", borderBottom: "1px solid var(--ring)" }}>
            <HelpCircle size={17} color="var(--leaf)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>Ask us anything</div>
          </div>
          <div ref={listRef} style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 10 }}>
            {messages.length === 0 && (
              <div style={{ fontSize: 13, color: "var(--muted)" }}>
                Hi! Try a common question below, or type your own.
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} style={{ alignSelf: m.from === "user" ? "flex-end" : "flex-start", maxWidth: "85%" }}>
                <div style={{
                  background: m.from === "user" ? "var(--ink)" : "var(--surface-muted)",
                  color: m.from === "user" ? "var(--btn-primary-fg)" : "var(--ink)",
                  borderRadius: 14, padding: "9px 13px", fontSize: 13.5, lineHeight: 1.5,
                }}>{m.text}</div>
              </div>
            ))}
            {(messages.length === 0 || messages[messages.length - 1]?.suggestChips) && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 4 }}>
                {faqs.slice(0, 4).map((f) => (
                  <button key={f.id} onClick={() => send(f.q)} className="chat-chip">{f.q}</button>
                ))}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, padding: 12, borderTop: "1px solid var(--ring)" }}>
            <input style={{ ...inputStyle, flex: 1 }} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Type a question…" />
            <button onClick={() => send()} className="stepper-btn" style={{ width: 40, height: 40 }}><Send size={15} /></button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {

  const [tab, setTab] = useState(() => (urlParams.get("view") === "myorders" ? "myorders" : urlParams.get("post") ? "community" : "order"));

  const [pendingCommunityPostId, setPendingCommunityPostId] = useState(() => urlParams.get("post") || null);
