function ProfileView({ myName, setMyName, myCustomerId, dogs, setDogs, orders, setOrders, communityPosts, setCommunityPosts, allAddresses, setAllAddresses, onMyPhoneChange, onGoToDogs }) {
  const [rec, setRec] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [draftName, setDraftName] = useState("");
  const [editingPhone, setEditingPhone] = useState(false);
  const [draftPhone, setDraftPhone] = useState("");
  const [editingEmail, setEditingEmail] = useState(false);
  const [draftEmail, setDraftEmail] = useState("");
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      if (!myName) { setRec(null); setLoaded(true); return; }
      const r = await getCustomerRecord(myName);
      setRec(r);
      setLoaded(true);
    })();
  }, [myName]);

  const saveField = async (patch) => {
    const next = { ...rec, ...patch };
    await window.storage.set(customerKey(myName), JSON.stringify(next), true);
    setRec(next);
  };

  const savePhone = async () => {
    const cleaned = draftPhone.trim();
    await saveField({ phone: cleaned });
    onMyPhoneChange?.(cleaned);
    setEditingPhone(false);
  };
  const saveEmail = async () => {
    const trimmed = draftEmail.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) { setError("Enter a valid email address."); return; }
    setError("");
    await saveField({ email: trimmed });
    setEditingEmail(false);
  };

  // Renaming is safe now that every entity has a real customerId: the
  // account record just moves to a new key, and every existing dog/order/
  // Community post this customer owns gets its cached display name
  // refreshed to match -- found by customerId, not by the old name.
  const saveName = async () => {
    const newName = draftName.trim();
    if (!newName) { setError("Enter a name."); return; }
    if (newName.toLowerCase() === myName.trim().toLowerCase()) { setEditingName(false); return; }
    setError("");
    try {
      const existing = await window.storage.get(customerKey(newName), true);
      if (existing?.value) { setError("That name is already taken."); return; }
    } catch {
      // not found -- exactly what we want, fall through
    }

    const nextRec = { ...rec, name: newName };
    await window.storage.set(customerKey(newName), JSON.stringify(nextRec), true);
    await window.storage.delete(customerKey(myName), true);

    const nextDogs = dogs.map((d) => (d.customerId === myCustomerId ? { ...d, owner: newName } : d));
    setDogs(nextDogs);
    await persist(K.dogs, nextDogs);

    const nextOrders = orders.map((o) => (o.customerId === myCustomerId ? { ...o, customerName: newName } : o));
    setOrders(nextOrders);
    await persist(K.orders, nextOrders);

    const nextPosts = communityPosts.map((p) => (p.authorId === myCustomerId ? { ...p, authorName: newName } : p));
    setCommunityPosts(nextPosts);
    await persist(K.communityPosts, nextPosts);

    setRec(nextRec);
    setMyName(newName);
    window.storage.set("dfp:session", JSON.stringify({ name: newName }), false).catch(() => {});
    setEditingName(false);
  };

  if (!myName) return <div><SectionTitle eyebrow="Customer" title="Your profile" /><Card><p style={{ margin: 0 }}>Sign in up top to view your profile.</p></Card></div>;
  if (!loaded) return null;

  const myDogCount = dogs.filter((d) => d.customerId === myCustomerId).length;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Your profile" sub="The single place to manage your details -- everything here is reused automatically wherever it's needed, so you won't be asked again." />

      <Card style={{ maxWidth: 480, marginBottom: 20 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Name</div>
            {editingName ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftName} onChange={(e) => setDraftName(e.target.value)} autoFocus />
                <Btn small onClick={saveName}>Save</Btn>
                <Btn small variant="ghost" onClick={() => { setEditingName(false); setError(""); }}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 16, fontWeight: 600 }}>{myName}</span>
                <button onClick={() => { setDraftName(myName); setEditingName(true); setError(""); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>

          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Phone</div>
            {editingPhone ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftPhone} onChange={(e) => setDraftPhone(e.target.value)} autoFocus />
                <Btn small onClick={savePhone}>Save</Btn>
                <Btn small variant="ghost" onClick={() => setEditingPhone(false)}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 16 }}>{rec?.phone || <span style={{ color: "var(--muted)" }}>Not set</span>}</span>
                <button onClick={() => { setDraftPhone(rec?.phone || ""); setEditingPhone(true); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>

          <div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>Email</div>
            {editingEmail ? (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <input type="email" style={{ ...inputStyle, flex: 1, minWidth: 140 }} value={draftEmail} onChange={(e) => setDraftEmail(e.target.value)} autoFocus />
                <Btn small onClick={saveEmail}>Save</Btn>
                <Btn small variant="ghost" onClick={() => { setEditingEmail(false); setError(""); }}>Cancel</Btn>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontSize: 16 }}>{rec?.email || <span style={{ color: "var(--muted)" }}>Not set — add one to enable password reset</span>}</span>
                <button onClick={() => { setDraftEmail(rec?.email || ""); setEditingEmail(true); setError(""); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Edit</button>
              </div>
            )}
          </div>
          {error && <div style={{ color: "var(--clay)", fontSize: 13 }}>{error}</div>}
        </div>
      </Card>

      <Card style={{ maxWidth: 480, marginBottom: 20 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 6 }}>Your dogs</div>
        <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 10 }}>{myDogCount} dog{myDogCount === 1 ? "" : "s"} on file.</p>
        <Btn small variant="ghost" onClick={onGoToDogs}>Manage your dogs</Btn>
      </Card>

      <AddressManager myName={myName} myCustomerId={myCustomerId} allAddresses={allAddresses} setAllAddresses={setAllAddresses} />
    </div>
  );
}

/* ============================================================================
   CUSTOMER: Community (public read, authenticated write)
   Posts/comments/likes are public-readable app-level collections, loaded
   once at startup exactly like orders/dogs already are -- nothing special
   is needed to make browsing work without an account. Only creating a
   post, liking, and commenting require being signed in.
   ========================================================================= */

const COMMUNITY_IMAGE_CAP = 1_000_000; // ~1MB per image, base64 text length
const COMMUNITY_MAX_IMAGES = 5;
const BREED_ALL = "All Breeds / General";

function LoginPromptModal({ action, onOpenAuth, onClose }) {
  return (
    <Modal onCancel={onClose} maxWidth={380}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex" }}><CircleUser size={16} color="#fff" /></div>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18 }}>Sign in to continue</div>
      </div>
      <p style={{ fontSize: 14, color: "var(--muted)", marginBottom: 18 }}>You'll need an account to {action}. It only takes a moment.</p>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn full onClick={() => onOpenAuth("login")}>Log in</Btn>
        <Btn full variant="ghost" onClick={() => onOpenAuth("signup")}>Sign up</Btn>
      </div>
      <Btn full variant="ghost" style={{ marginTop: 8 }} onClick={onClose}>Cancel</Btn>
    </Modal>
  );
}

function CommunityImageLightbox({ images, startIndex, onClose }) {
  const [idx, setIdx] = useState(startIndex || 0);
  if (!images || images.length === 0) return null;
  return (
    <Modal onCancel={onClose} maxWidth={640}>
      <img src={images[idx]} alt="" style={{ width: "100%", maxHeight: "65vh", objectFit: "contain", borderRadius: 12, background: "var(--surface-muted)", display: "block" }} />
      {images.length > 1 && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
          <Btn small variant="ghost" onClick={() => setIdx((i) => (i - 1 + images.length) % images.length)}>&larr; Prev</Btn>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{idx + 1} / {images.length}</span>
          <Btn small variant="ghost" onClick={() => setIdx((i) => (i + 1) % images.length)}>Next &rarr;</Btn>
        </div>
      )}
      <Btn full variant="ghost" style={{ marginTop: 14 }} onClick={onClose}>Close</Btn>
    </Modal>
  );
}

function CommunityImagePicker({ images, setImages, setWarning }) {
  const fileRef = useRef(null);
  const onFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (images.length >= COMMUNITY_MAX_IMAGES) {
      setWarning(`You can add up to ${COMMUNITY_MAX_IMAGES} images per post.`);
      if (fileRef.current) fileRef.current.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      if (dataUrl.length > COMMUNITY_IMAGE_CAP) {
        setWarning("That image is too large -- try a smaller or more compressed photo (roughly under 700KB works well).");
        if (fileRef.current) fileRef.current.value = "";
        return;
      }
      setWarning("");
      setImages([...images, dataUrl]);
      if (fileRef.current) fileRef.current.value = "";
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        {images.map((img, i) => (
          <div key={i} style={{ position: "relative", width: 72, height: 72 }}>
            <img src={img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: 10, display: "block" }} />
            <button onClick={() => setImages(images.filter((_, idx) => idx !== i))} style={{ position: "absolute", top: -6, right: -6, background: "var(--clay)", color: "#fff", border: "none", borderRadius: "50%", width: 20, height: 20, cursor: "pointer", fontSize: 12, lineHeight: 1 }}>&times;</button>
          </div>
        ))}
      </div>
      {images.length < COMMUNITY_MAX_IMAGES && (
        <Btn small variant="ghost" onClick={() => fileRef.current?.click()}><ImageIcon size={13} /> Add image ({images.length}/{COMMUNITY_MAX_IMAGES})</Btn>
      )}
      <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{ display: "none" }} />
    </div>
  );
}

function CreatePostForm({ myName, dogs, topics, onSubmit, onCancel }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [title, setTitle] = useState("");
  const [content, setContent] = useState("");
  const [topic, setTopic] = useState(topics[0]?.name || "");
  const [breed, setBreed] = useState(BREED_ALL);
  const [dogDetails, setDogDetails] = useState("");
  const [images, setImages] = useState([]);
  const [warning, setWarning] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const submit = async () => {
    if (!title.trim()) { setWarning("Add a title for your post."); return; }
    if (!content.trim() && images.length === 0) { setWarning("Add some writing, at least one image, or both."); return; }
    setWarning("");
    setSubmitting(true);
    await onSubmit({ title: title.trim(), content: content.trim(), topic, breed, dogDetails: dogDetails.trim(), images });
    setSubmitting(false);
  };

  return (
    <Card style={{ maxWidth: 560 }}>
      <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 4 }}>Share with the Community</div>
      <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 16 }}>Your post is reviewed by us before it goes public -- usually quick.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="Title"><input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="What Sandy taught me about crate training" /></Field>
        <Field label="Your writing (optional if you're just sharing photos)">
          <textarea style={{ ...inputStyle, minHeight: 120, resize: "vertical" }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="Share your experience, a tip, or something you learned..." />
        </Field>
        <div className="form-grid-2">
          <Field label="Topic">
            <select style={inputStyle} value={topic} onChange={(e) => setTopic(e.target.value)}>
              {topics.map((t) => <option key={t.id} value={t.name}>{t.name}</option>)}
            </select>
          </Field>
          <Field label="Dog breed">
            <select style={inputStyle} value={breed} onChange={(e) => setBreed(e.target.value)}>
              <option value={BREED_ALL}>{BREED_ALL}</option>
              {myDogs.map((d) => <option key={d.id} value={d.breed}>{d.breed} ({d.name})</option>)}
            </select>
          </Field>
        </div>
        <Field label="Relevant dog details (optional)"><input style={inputStyle} value={dogDetails} onChange={(e) => setDogDetails(e.target.value)} placeholder="e.g. 8 months old, high energy" /></Field>
        <Field label="Images (optional, up to 5)"><CommunityImagePicker images={images} setImages={setImages} setWarning={setWarning} /></Field>
      </div>
      {warning && <p style={{ fontSize: 13, color: "var(--clay)", marginTop: 10 }}>{warning}</p>}
      <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
        <Btn onClick={submit} disabled={submitting} loadingText="Submitting…">Submit for review</Btn>
        <Btn variant="ghost" onClick={onCancel}>Cancel</Btn>
      </div>
    </Card>
  );
}

function CommunityPostCard({ post, onOpen }) {
  return (
    <Card style={{ padding: 0, overflow: "hidden", cursor: "pointer" }} onClick={() => onOpen(post.id)}>
      {post.images && post.images.length > 0 && (
        <img src={post.images[0]} alt="" style={{ width: "100%", display: "block" }} />
      )}
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
          <Pill>{post.topic}</Pill>
          {post.breed && post.breed !== BREED_ALL && <Pill tone="good">{post.breed}</Pill>}
        </div>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17, marginBottom: 6 }}>{post.title}</div>
        {post.content && <div style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 10, overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}>{post.content}</div>}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>
          <span>{post.authorName} &middot; {fmtDateLabel(toDateStr(new Date(post.createdAt)))}</span>
          <span style={{ display: "flex", gap: 10 }}>
            <span>&hearts; {post.likeCount || 0}</span>
            <span>&#128172; {post.commentCount || 0}</span>
          </span>
        </div>
      </div>
    </Card>
  );
}

function CommunityPostDetail({ post, allPosts, comments, likes, myName, myCustomerId, config, onBack, onOpenPost, onRequireLogin, onToggleLike, onAddComment, onFilterBreed }) {
  const [commentText, setCommentText] = useState("");
  const [viewingImages, setViewingImages] = useState(null);
  const [shareCopied, setShareCopied] = useState(false);

  const postComments = comments.filter((c) => c.postId === post.id).sort((a, b) => a.createdAt - b.createdAt);
  const iLiked = myCustomerId && likes.some((l) => l.postId === post.id && l.userId === myCustomerId);

  const related = allPosts
    .filter((p) => p.id !== post.id && p.status === "approved")
    .map((p) => ({ post: p, score: (p.breed === post.breed && post.breed !== BREED_ALL ? 2 : 0) + (p.topic === post.topic ? 1 : 0) }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3)
    .map((x) => x.post);

  const postUrl = () => `${window.location.origin}${window.location.pathname}?post=${post.id}`;

  const share = async () => {
    const url = postUrl();
    const shareData = { title: post.title, text: post.content ? post.content.slice(0, 140) : post.title, url };
    if (navigator.share) {
      try { await navigator.share(shareData); return; } catch { /* cancelled or unsupported mid-flow -- fall through to copy */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      setShareCopied(true);
      setTimeout(() => setShareCopied(false), 2500);
    } catch {}
  };

  const submitComment = async () => {
    if (!myName) { onRequireLogin("comment"); return; }
    if (!commentText.trim()) return;
    await onAddComment(post.id, commentText.trim());
    setCommentText("");
  };

  const clickLike = () => {
    if (!myName) { onRequireLogin("like this post"); return; }
    onToggleLike(post.id);
  };

  return (
    <div>
      {viewingImages && <CommunityImageLightbox images={post.images} startIndex={viewingImages} onClose={() => setViewingImages(null)} />}
      <Btn small variant="ghost" onClick={onBack} style={{ marginBottom: 14 }}>&larr; Back to Community</Btn>

      <Card style={{ maxWidth: 640 }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          <Pill>{post.topic}</Pill>
          {post.breed && post.breed !== BREED_ALL && (
            <button onClick={() => onFilterBreed(post.breed)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
              <Pill tone="good">{post.breed}</Pill>
            </button>
          )}
        </div>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 26, marginBottom: 8 }}>{post.title}</div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", marginBottom: 18 }}>
          By {post.authorName} &middot; {fmtDateLabel(toDateStr(new Date(post.createdAt)))}
          {post.updatedAt && post.updatedAt !== post.createdAt && <> &middot; edited</>}
        </div>

        {post.dogDetails && (
          <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 14, fontStyle: "italic" }}>{post.dogDetails}</div>
        )}

        {post.images && post.images.length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: post.images.length === 1 ? "1fr" : "repeat(auto-fill, minmax(140px, 1fr))", gap: 8, marginBottom: 16 }}>
            {post.images.map((img, i) => (
              <img key={i} src={img} alt="" onClick={() => setViewingImages(i)} style={{ width: "100%", borderRadius: 12, cursor: "pointer", display: "block", maxHeight: post.images.length === 1 ? 420 : 180, objectFit: "cover" }} />
            ))}
          </div>
        )}

        {post.content && <p style={{ fontSize: 15, lineHeight: 1.7, whiteSpace: "pre-wrap", marginBottom: 20 }}>{post.content}</p>}

        <div style={{ display: "flex", gap: 10, paddingTop: 16, borderTop: "1px solid var(--ring)" }}>
          <Btn small variant={iLiked ? "accent" : "ghost"} onClick={clickLike}>&hearts; {post.likeCount || 0}</Btn>
          <Btn small variant="ghost" onClick={share}>{shareCopied ? "Link copied!" : <><Link2 size={13} /> Share</>}</Btn>
        </div>
      </Card>

      <Card style={{ maxWidth: 640, marginTop: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16, marginBottom: 14 }}>Comments ({postComments.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 16 }}>
          {postComments.length === 0 ? (
            <p style={{ fontSize: 13.5, color: "var(--muted)", margin: 0 }}>No comments yet -- be the first to share your thoughts.</p>
          ) : postComments.map((c) => (
            <div key={c.id}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
                <b>{c.userName}</b>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{fmtDateTime(c.createdAt)}</span>
              </div>
              <div style={{ fontSize: 14 }}>{c.text}</div>
            </div>
          ))}
        </div>
        {myName ? (
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...inputStyle, flex: 1 }} value={commentText} onChange={(e) => setCommentText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitComment()} placeholder="Add a comment..." />
            <Btn small onClick={submitComment}>Post</Btn>
          </div>
        ) : (
          <Btn small variant="ghost" onClick={() => onRequireLogin("comment")}>Sign in to comment</Btn>
        )}
      </Card>

      {related.length > 0 && (
        <div style={{ marginTop: 24, maxWidth: 640 }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>
            {post.breed !== BREED_ALL ? `More ${post.breed} Community posts` : "Related posts"}
          </div>
          <div className="responsive-grid">
            {related.map((p) => <CommunityPostCard key={p.id} post={p} onOpen={() => onOpenPost(p.id)} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function CommunityView({ myName, myCustomerId, dogs, breeds, config, communityTopics, communityPosts, setCommunityPosts, communityComments, setCommunityComments, communityLikes, setCommunityLikes, initialPostId, initialBreedFilter, onConsumeInitialPost, onConsumeInitialBreedFilter, onOpenAuth }) {
  const [view, setView] = useState("list"); // list | post | create
  const [openPostId, setOpenPostId] = useState(null);
  const [topicFilter, setTopicFilter] = useState("");
  const [breedFilter, setBreedFilter] = useState("");
  const [showMine, setShowMine] = useState(false);
  const [loginPrompt, setLoginPrompt] = useState(null); // string action label, or null

  useEffect(() => {
    if (initialPostId) {
      setOpenPostId(initialPostId);
      setView("post");
      onConsumeInitialPost?.();
    }
  }, [initialPostId]);

  useEffect(() => {
    if (initialBreedFilter) {
      setBreedFilter(initialBreedFilter);
      setView("list");
      onConsumeInitialBreedFilter?.();
    }
  }, [initialBreedFilter]);

  const activeTopics = communityTopics.filter((t) => t.active !== false);
  const approved = communityPosts.filter((p) => p.status === "approved");
  const mine = communityPosts.filter((p) => p.authorId === myCustomerId);

  const visible = (showMine ? mine : approved)
    .filter((p) => !topicFilter || p.topic === topicFilter)
    .filter((p) => !breedFilter || p.breed === breedFilter)
    .sort((a, b) => b.createdAt - a.createdAt);

  const openPost = (id) => { setOpenPostId(id); setView("post"); };
  const backToList = () => { setView("list"); setOpenPostId(null); };
  const requireLogin = (action) => setLoginPrompt(action);

  const startCreate = () => {
    if (!myName) { requireLogin("share a Community post"); return; }
    setView("create");
  };

  const submitPost = async (draft) => {
    const entry = {
      id: uid("post_"), authorId: myCustomerId, authorName: myName,
      title: draft.title, content: draft.content, topic: draft.topic, breed: draft.breed, dogDetails: draft.dogDetails,
      images: draft.images, createdAt: Date.now(), updatedAt: null, status: "pending", likeCount: 0, commentCount: 0,
    };
    const next = [...communityPosts, entry];
    setCommunityPosts(next);
    await persist(K.communityPosts, next);
    setView("list");
    setShowMine(true);
  };

  const toggleLike = async (postId) => {
    const existing = communityLikes.find((l) => l.postId === postId && l.userId === myCustomerId);
    const nextLikes = existing ? communityLikes.filter((l) => l.id !== existing.id) : [...communityLikes, { id: uid("like_"), postId, userId: myCustomerId, createdAt: Date.now() }];
    setCommunityLikes(nextLikes);
    await persist(K.communityLikes, nextLikes);
    const nextPosts = communityPosts.map((p) => (p.id === postId ? { ...p, likeCount: Math.max(0, (p.likeCount || 0) + (existing ? -1 : 1)) } : p));
    setCommunityPosts(nextPosts);
    await persist(K.communityPosts, nextPosts);
  };

  const addComment = async (postId, text) => {
    const entry = { id: uid("comment_"), postId, userId: myCustomerId, userName: myName, text, createdAt: Date.now(), updatedAt: null, status: "visible" };
    const nextComments = [...communityComments, entry];
    setCommunityComments(nextComments);
    await persist(K.communityComments, nextComments);
    const nextPosts = communityPosts.map((p) => (p.id === postId ? { ...p, commentCount: (p.commentCount || 0) + 1 } : p));
    setCommunityPosts(nextPosts);
    await persist(K.communityPosts, nextPosts);
  };

  const filterByBreed = (breed) => { setBreedFilter(breed); setShowMine(false); backToList(); };

  const openPostObj = openPostId ? communityPosts.find((p) => p.id === openPostId) : null;

  return (
    <div>
      {loginPrompt && (
        <LoginPromptModal
          action={loginPrompt}
          onOpenAuth={(mode) => { setLoginPrompt(null); onOpenAuth(mode); }}
          onClose={() => setLoginPrompt(null)}
        />
      )}

      {view === "create" ? (
        <CreatePostForm myName={myName} dogs={dogs} topics={activeTopics} onSubmit={submitPost} onCancel={backToList} />
      ) : view === "post" && openPostObj ? (
        <CommunityPostDetail
          post={openPostObj} allPosts={communityPosts} comments={communityComments} likes={communityLikes}
          myName={myName} myCustomerId={myCustomerId} config={config}
          onBack={backToList} onOpenPost={openPost} onRequireLogin={requireLogin}
          onToggleLike={toggleLike} onAddComment={addComment} onFilterBreed={filterByBreed}
        />
      ) : (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
            <SectionTitle eyebrow="Community" title="Community" sub="Discover real experiences, helpful tips, training advice, and breed-specific knowledge shared by dog owners." />
            <Btn onClick={startCreate}><Plus size={15} /> Share a post</Btn>
          </div>

          <Card style={{ marginBottom: 18 }}>
            <div className="form-grid-2">
              <Field label="Topic">
                <select style={inputStyle} value={topicFilter} onChange={(e) => setTopicFilter(e.target.value)}>
                  <option value="">All topics</option>
                  {activeTopics.map((t) => <option key={t.id} value={t.name}>{t.name}</option>)}
                </select>
              </Field>
              <Field label="Dog breed">
                <select style={inputStyle} value={breedFilter} onChange={(e) => setBreedFilter(e.target.value)}>
                  <option value="">All breeds</option>
                  <option value={BREED_ALL}>{BREED_ALL}</option>
                  {breeds.map((b) => <option key={b.name} value={b.name}>{b.name}</option>)}
                </select>
              </Field>
            </div>
            {myName && (
              <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
                <button onClick={() => setShowMine(false)} className={"date-chip" + (!showMine ? " active" : "")}>Community</button>
                <button onClick={() => setShowMine(true)} className={"date-chip" + (showMine ? " active" : "")}>My posts</button>
              </div>
            )}
          </Card>

          {visible.length === 0 ? (
            <Card><p style={{ margin: 0, color: "var(--muted)" }}>{showMine ? "You haven't posted anything yet." : "No posts match these filters yet -- be the first to share one!"}</p></Card>
          ) : (
            <div className="responsive-grid">
              {visible.map((p) => (
                <div key={p.id} style={{ position: "relative" }}>
                  <CommunityPostCard post={p} onOpen={openPost} />
                  {showMine && p.status !== "approved" && (
                    <div style={{ position: "absolute", top: 10, right: 10 }}>
                      <Pill tone={p.status === "rejected" ? "bad" : "warn"}>{p.status === "rejected" ? "Not approved" : "Pending review"}</Pill>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function AddressManager({ myName, myCustomerId, allAddresses, setAllAddresses }) {
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [geoError, setGeoError] = useState("");

  const loaded = !!myCustomerId;
  const addresses = allAddresses.filter((a) => a.customerId === myCustomerId);

  const persistAddresses = async (next) => {
    // Only ever touch this customer's own rows -- everyone else's addresses
    // pass through untouched, since this writes back the FULL collection.
    const others = allAddresses.filter((a) => a.customerId !== myCustomerId);
    const combined = [...others, ...next];
    setAllAddresses(combined);
    await persist(K.addresses, combined);
  };

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setGeoError(""); };
  const useDeviceLocation = () => {
    setGeoError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setGeoError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => { setGeoError("Couldn't access your location — you can enter coordinates manually below instead."); setGeoBusy(false); },
      { timeout: 8000 }
    );
  };

  const saveNew = async () => {
    if (!form.label.trim() || !form.address.trim()) { setGeoError("Add a label and the address."); return; }
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { setGeoError("Add coordinates — use the location button or enter them manually."); return; }
    const entry = { id: uid("addr_"), customerId: myCustomerId, label: form.label.trim(), address: form.address.trim(), lat, lng, isDefault: addresses.length === 0, createdAt: Date.now() };
    await persistAddresses([...addresses, entry]);
    setForm(null);
  };

  const remove = async (id) => {
    const wasDefault = addresses.find((a) => a.id === id)?.isDefault;
    let next = addresses.filter((a) => a.id !== id);
    // If the default address gets removed, hand default status to whatever's left, so there's never a moment with no default and more than one address.
    if (wasDefault && next.length > 0 && !next.some((a) => a.isDefault)) {
      next = next.map((a, i) => (i === 0 ? { ...a, isDefault: true } : a));
    }
    await persistAddresses(next);
  };

  const setDefault = async (id) => {
    await persistAddresses(addresses.map((a) => ({ ...a, isDefault: a.id === id })));
  };

  if (!myName) return null;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Delivery addresses" sub="Save an address once, then it's picked automatically when you order. Mark whichever one you use most as your default." />
      <div className="responsive-grid" style={{ marginBottom: 18 }}>
        {loaded && addresses.map((a) => (
          <Card key={a.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 7, display: "flex" }}><MapPin size={16} color="#fff" /></div>
                <div style={{ fontFamily: "var(--font-display)", fontSize: 17, fontWeight: 600 }}>{a.label}</div>
              </div>
              <button onClick={() => remove(a.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--clay)", padding: 6 }}><Trash2 size={15} /></button>
            </div>
            <div style={{ marginTop: 8, fontSize: 13.5, color: "var(--ink)" }}>{a.address}</div>
            <div style={{ marginTop: 6, fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{a.lat.toFixed(4)}, {a.lng.toFixed(4)}</div>
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed var(--ring-strong)" }}>
              {a.isDefault ? <Pill tone="good">Default</Pill> : <button onClick={() => setDefault(a.id)} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline" }}>Set as default</button>}
            </div>
          </Card>
        ))}
        {loaded && (
          <button onClick={startNew} className="add-tile">
            <Plus size={20} />
            <span style={{ fontSize: 13.5 }}>Add an address</span>
          </button>
        )}
      </div>

      {form && (
        <Card style={{ maxWidth: 460 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 18, marginBottom: 14, fontWeight: 600 }}>Add an address</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="Label"><input style={inputStyle} value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="Home" /></Field>
            <Field label="Address"><input style={inputStyle} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} placeholder="Flat 4B, 12 MG Road, Bengaluru" /></Field>
            <div>
              <Btn small variant="ghost" onClick={useDeviceLocation} disabled={geoBusy}><Navigation size={13} /> {geoBusy ? "Locating…" : "Use my current location"}</Btn>
            </div>
            <div className="form-grid-2">
              <Field label="Latitude"><input style={inputStyle} value={form.lat} onChange={(e) => setForm({ ...form, lat: e.target.value })} placeholder="12.9716" /></Field>
              <Field label="Longitude"><input style={inputStyle} value={form.lng} onChange={(e) => setForm({ ...form, lng: e.target.value })} placeholder="77.5946" /></Field>
            </div>
          </div>
          {geoError && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{geoError}</div>}
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <Btn onClick={saveNew}>Save address</Btn>
            <Btn variant="ghost" onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

/* ============================================================================
   CUSTOMER: Delivery address + radius/fee gate for an order
   ========================================================================= */

// Backward-compatible: a location saved before tiered pricing existed has a
// flat radiusKm/deliveryFee instead of a tiers array. Synthesize a single
// tier from those old fields so nothing already configured breaks.
function getTiers(loc) {
  if (Array.isArray(loc.tiers) && loc.tiers.length > 0) return [...loc.tiers].sort((a, b) => a.maxKm - b.maxKm);
  return [{ maxKm: loc.radiusKm ?? 3, fee: loc.deliveryFee ?? 0 }];
}

function evaluateAddress(addr, locations) {
  const activeLocations = locations.filter((l) => l.active);
  if (activeLocations.length === 0) return { ok: true, deliveryFee: 0, name: null, distance: null };
  let best = null;
  for (const loc of activeLocations) {
    const dist = haversineKm(addr.lat, addr.lng, loc.lat, loc.lng);
    if (!best || dist < best.dist) best = { dist, loc };
  }
  const tiers = getTiers(best.loc);
  const matchedTier = tiers.find((t) => best.dist <= t.maxKm);
  const maxRadius = tiers[tiers.length - 1].maxKm;
  const ok = !!matchedTier;
  return { ok, distance: best.dist, name: best.loc.name, radius: maxRadius, deliveryFee: matchedTier ? matchedTier.fee : 0 };
}

function AddressGate({ myName, myCustomerId, locations, resolved, onResolved, addresses, loaded, onAddressesChange }) {
  const [selectedId, setSelectedId] = useState(null);
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [error, setError] = useState("");

  const selectAddress = (addr) => {
    setSelectedId(addr.id);
    const info = evaluateAddress(addr, locations);
    onResolved(info.ok
      ? { ok: true, deliveryFee: info.deliveryFee, name: info.name, distance: info.distance, address: addr }
      : { ok: false, distance: info.distance, name: info.name, radius: info.radius, address: addr });
  };

  // Auto-pick the default address (or the only one on file) instead of
  // making the customer choose it every time -- only kicks in once, when
  // addresses first load and nothing's selected yet.
  useEffect(() => {
    if (!loaded || resolved) return;
    const def = addresses.find((a) => a.isDefault) || (addresses.length === 1 ? addresses[0] : null);
    if (def) selectAddress(def);
  }, [loaded, addresses]);

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setError(""); };
  const useDeviceLocation = () => {
    setError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => { setError("Couldn't access your location — you can enter coordinates manually below instead."); setGeoBusy(false); },
      { timeout: 8000 }
    );
  };
  const saveNewAddress = async () => {
    if (!form.label.trim() || !form.address.trim()) { setError("Add a label and the address."); return; }
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { setError("Add coordinates — use the location button or enter them manually."); return; }
    const entry = { id: uid("addr_"), customerId: myCustomerId, label: form.label.trim(), address: form.address.trim(), lat, lng, isDefault: addresses.length === 0, createdAt: Date.now() };
    const next = [...addresses, entry];
    await onAddressesChange(next);
    setForm(null);
    selectAddress(entry);
  };
  const setDefault = async (id) => {
    await onAddressesChange(addresses.map((a) => ({ ...a, isDefault: a.id === id })));
  };

  if (!loaded) return null;

  if (resolved?.address && resolved.ok) {
    return (
      <Card style={{ marginBottom: 16, background: "var(--tone-good-bg)", border: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, flexWrap: "wrap" }}>
          <MapPin size={16} />
          Delivering to <b>{resolved.address.label}</b> ({resolved.address.address}).
          {resolved.name && <> Within range of <b>{resolved.name}</b>.</>}
          {resolved.deliveryFee > 0 && <Pill>Delivery fee {rupee(resolved.deliveryFee)}</Pill>}
        </div>
        <button onClick={() => { setSelectedId(null); onResolved(null); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline", marginTop: 8 }}>Use a different address</button>
      </Card>
    );
  }

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <MapPin size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Deliver to</div>
      </div>

      {addresses.length > 0 && !form && !addresses.some((a) => a.isDefault) && (
        <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 10 }}>Choose an address below to continue — or set one as your default so it's picked automatically next time.</p>
      )}

      {addresses.length > 0 && !form && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          {addresses.map((a) => (
            <div key={a.id} style={{ position: "relative" }}>
              <button onClick={() => selectAddress(a)} className={"session-card" + (selectedId === a.id ? " selected" : "")} style={{ textAlign: "left", width: "100%" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>{a.label}</div>
                  {a.isDefault && <Pill tone="good">Default</Pill>}
                </div>
                <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{a.address}</div>
              </button>
              {!a.isDefault && (
                <button onClick={(e) => { e.stopPropagation(); setDefault(a.id); }} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 11.5, textDecoration: "underline" }}>Set as default</button>
              )}
            </div>
          ))}
        </div>
      )}

      {resolved?.address && !resolved.ok && (
        <div style={{ marginBottom: 12 }}>
          <Pill tone="bad">Outside delivery area</Pill>
          <p style={{ fontSize: 13.5, marginTop: 8 }}>
            <b>{resolved.address.label}</b> is outside our nearest delivery area, <b>{resolved.name}</b> (which delivers within {resolved.radius} km). We can&apos;t take an order there yet.
          </p>
        </div>
      )}

      {form ? (
        <div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="Label"><input style={inputStyle} value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="Home" /></Field>
            <Field label="Address"><input style={inputStyle} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} placeholder="Flat 4B, 12 MG Road, Bengaluru" /></Field>
            <div><Btn small variant="ghost" onClick={useDeviceLocation} disabled={geoBusy}><Navigation size={13} /> {geoBusy ? "Locating…" : "Use my current location"}</Btn></div>
            <div className="form-grid-2">
              <Field label="Latitude"><input style={inputStyle} value={form.lat} onChange={(e) => setForm({ ...form, lat: e.target.value })} placeholder="12.9716" /></Field>
              <Field label="Longitude"><input style={inputStyle} value={form.lng} onChange={(e) => setForm({ ...form, lng: e.target.value })} placeholder="77.5946" /></Field>
            </div>
          </div>
          {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{error}</div>}
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Btn small onClick={saveNewAddress}>Save & use this address</Btn>
            <Btn small variant="ghost" onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <Btn small variant="ghost" onClick={startNew}><Plus size={13} /> Add a new address</Btn>
      )}
    </Card>
  );
}

/* ============================================================================
   CUSTOMER: Phone number -- required before ordering, re-confirmed each time
   ========================================================================= */

function PhoneGate({ myName, resolved, onResolved, phone, loaded, onPhoneChange }) {
  const [editing, setEditing] = useState(false);
  const [draftPhone, setDraftPhone] = useState("");
  const [error, setError] = useState("");

  // Once a phone is on file, resolve immediately -- no need to reconfirm
  // it on every order. Only asks if it's genuinely missing.
  useEffect(() => {
    if (!loaded || resolved?.ok) return;
    if (phone) onResolved({ ok: true, phone });
    else setEditing(true);
  }, [loaded, phone]);

  const validatePhone = (p) => /^[0-9+\-\s()]{7,15}$/.test(p.trim());

  const savePhone = async () => {
    const cleaned = draftPhone.trim();
    if (!validatePhone(cleaned)) { setError("Enter a valid phone number."); return; }
    setError("");
    await saveCustomerPhone(myName, cleaned);
    onPhoneChange(cleaned);
    setEditing(false);
    onResolved({ ok: true, phone: cleaned });
  };

  if (!loaded) return null;

  // Once resolved with a phone already on file, there's nothing to show --
  // it's used silently. Changing it lives on the Profile page now, not here.
  if (resolved?.ok && phone && !editing) return null;

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Phone size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Contact number</div>
      </div>
      <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "0 0 12px" }}>We&apos;ll use this number to reach you about your order.</p>
      <Field label="Phone number">
        <input style={inputStyle} value={draftPhone} onChange={(e) => setDraftPhone(e.target.value)} placeholder="9876543210" />
      </Field>
      {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <Btn small onClick={savePhone} loadingText="Saving…">Save number</Btn>
        {phone && <Btn small variant="ghost" onClick={() => setEditing(false)}>Cancel</Btn>}
      </div>
    </Card>
  );
}

/* ============================================================================
   CUSTOMER: Order food (meal builder → payment → confirmation)
   ========================================================================= */

function OrderFoodView({ myName, myCustomerId, myPhone, myPhoneLoaded, onMyPhoneChange, dogs, ingredients, breeds, engine, config, orders, cancelledSlots, forceOpenSlots, slotOverrides, locations, qrCode, initialDogId, setOrders, allAddresses, setAllAddresses, goToOrders }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [dogId, setDogId] = useState(initialDogId || myDogs[0]?.id || "");
  const [dateIdx, setDateIdx] = useState(0);
  const [session, setSession] = useState(null);
  const [selected, setSelected] = useState(new Set(ingredients.filter((i) => i.autoIncluded && i.available).map((i) => i.id)));
  const [customQty, setCustomQty] = useState(() => {
    const m = {};
    ingredients.forEach((i) => { if (i.quantityAdjustable) m[i.id] = i.default; });
    return m;
  });
  const [locationResolved, setLocationResolved] = useState(null);
  const [phoneResolved, setPhoneResolved] = useState({ ok: false });

  // Addresses come from the app-level collection now (loaded once at
  // startup alongside orders/dogs), filtered to just this customer.
  const gateAddresses = allAddresses.filter((a) => a.customerId === myCustomerId);
  const gateAddressesLoaded = !!myCustomerId;
  const onGateAddressesChange = async (next) => {
    const others = allAddresses.filter((a) => a.customerId !== myCustomerId);
    const combined = [...others, ...next];
    setAllAddresses(combined);
    await persist(K.addresses, combined);
  };
  const [deliveryNote, setDeliveryNote] = useState("");
  const [leaveAtDoor, setLeaveAtDoor] = useState(false);
  const [uncheckedItems, setUncheckedItems] = useState(new Set()); // items the customer has unchecked (default: all checked)
  const [placingCod, setPlacingCod] = useState(false);
  const [stage, setStage] = useState("build"); // build -> payment -> done
  const [draftOrder, setDraftOrder] = useState(null);
  const [placed, setPlaced] = useState(null);

  useEffect(() => { if (!dogId && myDogs[0]) setDogId(myDogs[0].id); }, [myDogs.length]);

  // A scroll position carried over from the meal builder (which can get
  // fairly long) otherwise leaves the top of the next screen -- e.g. the QR
  // code on the payment screen -- rendered off the top of the viewport,
  // especially noticeable on mobile where there's no way to see "above" the
  // current scroll position without manually scrolling up.
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [stage]);

  const dog = myDogs.find((d) => d.id === dogId);
  const dogForCalc = dog ? { ...dog, ageMonths: effectiveAgeMonths(dog) } : dog;
  const dates = Array.from({ length: 14 }, (_, i) => addDays(todayStr(), i));
  const date = dates[dateIdx];

  const nextSlot = useMemo(() => nextAvailableSlot(config, orders, cancelledSlots, forceOpenSlots, slotOverrides), [config, orders, cancelledSlots, forceOpenSlots, slotOverrides]);
  const bothFullToday = ["morning", "evening"].every((k) => {
    const st = sessionState(todayStr(), k, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
    return st === "FULL" || st === "CLOSED" || st === "CANCELLED";
  });

  const toggleIngredient = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  const preview = useMemo(() => {
    if (!dog) return [];
    return ingredients
      .filter((i) => selected.has(i.id) && i.available)
      .sort((a, b) => a.displayOrder - b.displayOrder)
      .map((i) => {
        const qty = i.quantityAdjustable ? (customQty[i.id] ?? i.default) : calcAutoQty(i, dogForCalc, breeds, engine);
        return { id: i.id, name: i.name, unit: i.unit, qty, pricePerUnit: i.pricePerUnit };
      });
  }, [dog, dogForCalc, selected, customQty, ingredients, breeds, engine]);

  const foodTotal = preview.reduce((s, p) => s + p.qty * p.pricePerUnit, 0);
  const deliveryFee = locationResolved?.deliveryFee || 0;
  const subtotal = foodTotal + deliveryFee;
  const gstAmount = config.gstEnabled ? Math.round(subtotal * (config.gstPercent || 0)) / 100 : 0;
  const total = subtotal + gstAmount;

  const buildDraft = () => {
    if (!dog || !session) return null;
    const sessInfo = config.sessions[session];
    return {
      id: uid("ord_"),
      customerName: myName,
      customerId: myCustomerId,
      dogId: dog.id,
      dogSnapshot: { name: dog.name, breed: dog.breed, ageMonths: effectiveAgeMonths(dog), weightKg: dog.weightKg, activity: dog.activity },
      date, session, servingTime: sessInfo.servingTime,
      ingredients: preview,
      foodTotal: Math.round(foodTotal),
      deliveryFee: Math.round(deliveryFee),
      locationName: locationResolved?.name || null,
      customerAddress: locationResolved?.address ? {
        label: locationResolved.address.label,
        address: locationResolved.address.address,
        lat: locationResolved.address.lat,
        lng: locationResolved.address.lng,
      } : null,
      distanceKm: typeof locationResolved?.distance === "number" ? Math.round(locationResolved.distance * 10) / 10 : null,
      gstAmount: Math.round(gstAmount),
      gstPercent: config.gstEnabled ? (config.gstPercent || 0) : 0,
      totalPrice: Math.round(total),
      currencySymbol: config.currencySymbol || "₹",
      mealChecklist: (config.mealChecklist || []).map((item) => ({ id: item.id, text: item.text, accepted: !uncheckedItems.has(item.id) })),
      customerPhone: phoneResolved.phone || "",
      leaveAtDoor,
      deliveryNote: deliveryNote.trim(),
      createdAt: Date.now(),
    };
  };

  const goToPayment = () => {
    const draft = buildDraft();
    if (!draft) return;
    if (qrCode && config.codEnabled) {
      setDraftOrder(draft);
      setStage("choosePayment");
    } else if (qrCode) {
      setDraftOrder(draft);
      setStage("payment");
    } else if (config.codEnabled) {
      return finalizeOrder(draft, "CONFIRMED", "cod");
    }
  };

  const finalizeOrder = async (draft, status, paymentMethod = "upi") => {
    const order = { ...draft, status, paymentMethod, paymentClaimedAt: status === "PENDING_PAYMENT" ? Date.now() : null };
    const next = [...orders, order];
    setOrders(next);
    await persist(K.orders, next);

    // Record each ingredient as its own OrderItems row too (a real
    // orderId + ingredientId relationship), built alongside the existing
    // embedded snapshot rather than replacing it -- nothing that already
    // reads order.ingredients needs to change. Best-effort: the order
    // itself is already safely saved above regardless of this succeeding.
    try {
      const existingItems = await loadOrSeed(K.orderItems, []);
      const newItems = order.ingredients.map((ing) => ({
        id: uid("item_"), orderId: order.id, ingredientId: ing.id, ingredientName: ing.name,
        qty: ing.qty, unit: ing.unit, pricePerUnit: ing.pricePerUnit, lineTotal: Math.round(ing.qty * ing.pricePerUnit * 100) / 100,
      }));
      await persist(K.orderItems, [...existingItems, ...newItems]);
    } catch {}

    setPlaced(order);
    setStage("done");
  };

  if (!myName) return <Card><p style={{ margin: 0 }}>Sign in up top before ordering.</p></Card>;
  if (myDogs.length === 0) return <Card><p style={{ margin: 0 }}>Add a dog profile first — head to <b>My Dogs</b>.</p></Card>;
  if (config.orderingPaused) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <Ban size={17} color="var(--clay)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Not taking new orders right now</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>{config.orderingPausedMessage || "We're not taking new orders right now. Please check back soon."}</p>
        </Card>
      </div>
    );
  }
  if (!qrCode && !config.codEnabled) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <QrCode size={17} color="var(--turmeric)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Ordering isn&apos;t open yet</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>Payment isn&apos;t set up yet, so orders can&apos;t be placed right now. Please check back soon.</p>
        </Card>
      </div>
    );
  }

  if (stage === "choosePayment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="How would you like to pay?" />
        <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700, marginBottom: 18 }}>{rupee(draftOrder.totalPrice)}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={() => setStage("payment")} className="session-card" style={{ textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <QrCode size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Pay online now</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Scan a QR code to pay via any UPI app</div>
              </div>
            </div>
          </button>
          <button
            onClick={async () => {
              if (placingCod) return;
              setPlacingCod(true);
              try { await finalizeOrder(draftOrder, "CONFIRMED", "cod"); } finally { setPlacingCod(false); }
            }}
            disabled={placingCod}
            className="session-card"
            style={{ textAlign: "left", opacity: placingCod ? 0.6 : 1, cursor: placingCod ? "not-allowed" : "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Banknote size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>{placingCod ? "Placing order…" : "Cash on Delivery"}</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Pay in cash when your order arrives</div>
              </div>
            </div>
          </button>
        </div>
        <Btn full variant="ghost" style={{ marginTop: 14 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
      </div>
    );
  }

  if (stage === "payment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="Scan to pay" />
        <Card style={{ textAlign: "center" }}>
          <img src={qrCode} alt="Payment QR code" style={{ width: "100%", maxWidth: 260, borderRadius: 16, border: "1px solid var(--ring)", margin: "0 auto 16px" }} />
          <div style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700, marginBottom: 4 }}>{rupee(draftOrder.totalPrice)}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", marginBottom: 18 }}>
            {draftOrder.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(draftOrder.date)} &middot; {config.sessions[draftOrder.session].label}
            {draftOrder.deliveryFee > 0 && <> &middot; incl. {rupee(draftOrder.deliveryFee)} delivery</>}
            {draftOrder.gstAmount > 0 && <> &middot; incl. {rupee(draftOrder.gstAmount)} GST</>}
          </div>
          <Btn full variant="outline" onClick={() => downloadDataUrl(qrCode, "payment-qr-code.png")} style={{ marginBottom: 10 }}><Download size={15} /> Download QR code</Btn>
          <Btn full onClick={() => finalizeOrder(draftOrder, "PENDING_PAYMENT")}>I&apos;ve completed the payment</Btn>
          <Btn full variant="ghost" style={{ marginTop: 8 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
          <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 14 }}>Your order is held in your slot as soon as you confirm payment here &mdash; our team verifies it and moves your order to Confirmed.</p>
        </Card>
      </div>
    );
  }

  if (stage === "done" && placed) {
    const pending = placed.status === "PENDING_PAYMENT";
    return (
      <div style={{ maxWidth: 480 }}>
        <Card style={{ textAlign: "center", padding: 32 }}>
          <div style={{ display: "inline-flex", background: pending ? "var(--turmeric)" : "var(--leaf)", borderRadius: "50%", padding: 14, marginBottom: 12 }}>
            {pending ? <CreditCard size={26} color="#1d1d1f" /> : <Check size={26} color="#fff" />}
          </div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 22, fontWeight: 600, marginBottom: 6 }}>{pending ? "Order submitted" : "Order confirmed"}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>
            {placed.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(placed.date)} &middot; {config.sessions[placed.session].label} ({fmtTime(placed.servingTime)})
          </div>
          {pending && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Awaiting payment confirmation from our team.</p>}
          {placed.paymentMethod === "cod" && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Have {rupee(placed.totalPrice)} ready in cash when your order arrives.</p>}
          <Btn onClick={goToOrders}>View my orders <ChevronRight size={15} /></Btn>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Order food" />
      <AddressGate myName={myName} myCustomerId={myCustomerId} locations={locations} resolved={locationResolved} onResolved={setLocationResolved} addresses={gateAddresses} loaded={gateAddressesLoaded} onAddressesChange={onGateAddressesChange} />
      <PhoneGate myName={myName} resolved={phoneResolved} onResolved={setPhoneResolved} phone={myPhone} loaded={myPhoneLoaded} onPhoneChange={onMyPhoneChange} />

      {!(locationResolved?.ok && phoneResolved.ok) ? null : (
        <>
          {bothFullToday && nextSlot && (
            <Card style={{ marginBottom: 16, background: "var(--tone-warn-bg)", border: "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
                <AlertTriangle size={16} />
                Today&apos;s servings are fully booked. Next available: <b>{fmtDateLabel(nextSlot.date)} &middot; {config.sessions[nextSlot.session].label}</b>.
              </div>
            </Card>
          )}

          <Card style={{ marginBottom: 16 }}>
            <Field label="Dog">
              <select style={inputStyle} value={dogId} onChange={(e) => setDogId(e.target.value)}>
                {myDogs.map((d) => <option key={d.id} value={d.id}>{d.name} &middot; {d.breed}</option>)}
              </select>
            </Field>
          </Card>

          <Card style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Pick a date</div>
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
              {dates.map((d, i) => (
                <button key={d} onClick={() => { setDateIdx(i); setSession(null); }} className={"date-chip" + (i === dateIdx ? " active" : "")}>{fmtDateLabel(d)}</button>
              ))}
            </div>
            <div className="session-grid" style={{ marginTop: 16 }}>
              {["morning", "evening"].map((key) => {
                const st = sessionState(date, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
                const sess = config.sessions[key];
                const capacity = resolveCapacity(date, key, config, slotOverrides);
                const count = slotCount(date, key, orders);
                const disabled = st === "FULL" || st === "CLOSED" || st === "CANCELLED";
                const isSelected = session === key;
                return (
                  <button key={key} disabled={disabled} onClick={() => setSession(key)} className={"session-card" + (isSelected ? " selected" : "")} style={{ opacity: disabled ? 0.55 : 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>{sess.label}</div>
                        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{fmtTime(sess.servingTime)}</div>
                      </div>
                      <BowlGauge used={count} capacity={capacity} size={52} />
                    </div>
                    <div style={{ marginTop: 8 }}><Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill></div>
                  </button>
                );
              })}
            </div>
          </Card>

          {session && dog && (
            <Card>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Build {dog.name}&apos;s meal</div>
              <InfoNote>
                Staples like chicken and rice are portioned automatically from {dog.name}&apos;s weight, breed size, age and activity level, then billed by weight. Egg and other customizable extras are billed per unit you choose.
              </InfoNote>
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 2, marginTop: 14 }}>
                {ingredients.filter((i) => i.available).sort((a, b) => a.displayOrder - b.displayOrder).map((ing) => {
                  const isSel = selected.has(ing.id);
                  const qty = ing.quantityAdjustable ? (customQty[ing.id] ?? ing.default) : calcAutoQty(ing, dog, breeds, engine);
                  const subtotal = qty * ing.pricePerUnit;
                  return (
                    <div key={ing.id} className="ingredient-row">
                      <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flex: 1, minWidth: 0 }}>
                        <input type="checkbox" checked={isSel} onChange={() => toggleIngredient(ing.id)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                        <span style={{ fontFamily: "var(--font-body)", fontSize: 14.5 }}>{ing.name}</span>
                        {ing.quantityAdjustable && <Pill>Customizable</Pill>}
                      </label>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                        {isSel ? (
                          <>
                            {ing.quantityAdjustable ? (() => {
                              const step = ing.unit === "count" ? 1 : 5;
                              return (
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                  <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.max(ing.min, (customQty[ing.id] ?? ing.default) - step) })} className="stepper-btn"><Minus size={13} /></button>
                                  <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, width: 18, textAlign: "center" }}>{customQty[ing.id] ?? ing.default}</span>
                                  <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.min(ing.max, (customQty[ing.id] ?? ing.default) + step) })} className="stepper-btn"><Plus size={13} /></button>
                                </div>
                              );
                            })() : (
                              <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700 }}>{qty} {ing.unit}</span>
                            )}
                            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", minWidth: 44, textAlign: "right" }}>{rupee(subtotal)}</span>
                          </>
                        ) : (
                          <span style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--ring-strong)" }}>&mdash;</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {(config.mealChecklist || []).length > 0 && (
                <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                  {config.mealChecklist.map((item) => {
                    const checked = !uncheckedItems.has(item.id);
                    return (
                      <label key={item.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
                        <input
                          type="checkbox" checked={checked}
                          onChange={(e) => {
                            setUncheckedItems((prev) => {
                              const next = new Set(prev);
                              e.target.checked ? next.delete(item.id) : next.add(item.id);
                              return next;
                            });
                          }}
                          style={{ width: 17, height: 17, marginTop: 2, accentColor: "var(--leaf)", flexShrink: 0 }}
                        />
                        <span style={{ fontSize: 13.5, color: "var(--muted)" }}>{item.text}</span>
                      </label>
                    );
                  })}
                </div>
              )}

              <div style={{ marginTop: 18, paddingTop: 16, borderTop: "1.5px dashed var(--ring-strong)" }}>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Delivery instructions</div>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", marginBottom: 12 }}>
                  <input type="checkbox" checked={leaveAtDoor} onChange={(e) => setLeaveAtDoor(e.target.checked)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                  <span style={{ fontSize: 14 }}>Leave at the door</span>
                </label>
                <Field label="Additional requests (optional)">
                  <input style={inputStyle} value={deliveryNote} onChange={(e) => setDeliveryNote(e.target.value)} placeholder="Anything else we should know?" />
                </Field>
              </div>

              <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1.5px dashed var(--ring-strong)", display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Food</span><span>{rupee(foodTotal)}</span></div>
                {deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Delivery{locationResolved?.name ? ` (${locationResolved.name})` : ""}</span><span>{rupee(deliveryFee)}</span></div>}
                {config.gstEnabled && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>GST ({config.gstPercent}%)</span><span>{rupee(gstAmount)}</span></div>}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)" }}>Total</div>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700 }}>{rupee(total)}</div>
                </div>
              </div>
              <Btn onClick={goToPayment} full style={{ marginTop: 14 }} disabled={preview.length === 0}>
                {qrCode ? "Continue to payment" : "Place order (Cash on Delivery)"}
              </Btn>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

function InvoiceModal({ order, config, onClose }) {
  // A dedicated container living outside the app's own root, created once
  // and reused. During print, CSS hides the entire app root and shows only
  // this container -- so there's exactly one copy of the invoice on the
  // page, and nothing else around it that could span multiple pages.
  const [portalEl] = useState(() => {
    let el = document.getElementById("invoice-print-portal");
    if (!el) {
      el = document.createElement("div");
      el.id = "invoice-print-portal";
      document.body.appendChild(el);
    }
    return el;
  });

  if (!order) return null;

  return (
    <>
      <Modal onCancel={onClose} maxWidth={520}>
        <InvoiceContent order={order} config={config} />
        <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
          <Btn full onClick={() => window.print()}><Download size={15} /> Print</Btn>
          <Btn full variant="ghost" onClick={onClose}>Close</Btn>
        </div>
      </Modal>
      {createPortal(<InvoiceContent order={order} config={config} />, portalEl)}
    </>
  );
}

// Automatically opens the print dialog for one order's invoice, without
// needing InvoiceModal open on screen -- used for "auto-print on confirm".
// Browsers do not allow a webpage to silently send a print job to a
// specific printer without a person confirming a system dialog; there is
// no client-side way around that, by design (it'd otherwise let any page
// print to your printer without asking). This gets you as close as a
// browser allows: the print dialog opens on its own the moment an order
// is confirmed, with that order's invoice already loaded and ready --
// whoever's at the till still needs to click "Print" in that dialog.
function SilentPrintTrigger({ order, config, onDone }) {
  const [portalEl] = useState(() => {
    let el = document.getElementById("invoice-print-portal");
    if (!el) {
      el = document.createElement("div");
      el.id = "invoice-print-portal";
      document.body.appendChild(el);
    }
    return el;
  });

  useEffect(() => {
    const t = setTimeout(() => {
      window.print();
      onDone?.();
    }, 250); // give the portal content a moment to actually paint first
    return () => clearTimeout(t);
  }, []);

  return createPortal(<InvoiceContent order={order} config={config} />, portalEl);
}

                    {o.paymentMethod === "cod" && <> <Pill>COD</Pill></>}

                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--ring-strong)", marginTop: 3 }}>

                  </div>
                </div>
                <Pill tone={cancelled ? "bad" : pending ? "warn" : "good"}>{STATUS_LABEL[o.status]}</Pill>
              </div>

              {pending && (
                <div style={{ marginTop: 12 }}>
                  <p style={{ fontSize: 13, color: "var(--muted)", margin: "0 0 10px" }}>We&apos;re verifying your payment. If you haven&apos;t paid yet, you can view the QR code again below.</p>

                </div>

            </Card>
          );
        })}
      </div>
    </div>
  );
}

function ResetPasswordView({ token, config }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  const submit = async () => {
    if (pw.length < 4) { setError("Password must be at least 4 characters."); return; }
    if (pw !== pw2) { setError("Passwords don't match."); return; }
    setBusy(true); setError("");
    try {
      await resetPasswordWithToken(token, pw);
      setDone(true);
    } catch (err) {
      setError(err?.message || "That reset link is invalid or has expired. Request a new one from the login screen.");
    }
    setBusy(false);
  };

  return (
    <Shell theme="light">
      <div style={{ maxWidth: 440, margin: "60px auto", padding: "0 20px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          {config.logoDataUrl ? (
            <img src={config.logoDataUrl} alt="" style={{ width: 36, height: 36, borderRadius: 10, objectFit: "cover" }} />
          ) : (
            <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex" }}><Dog size={18} color="#fff" /></div>
          )}
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 19 }}>{config.serviceName}</div>
        </div>
        <Card>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 14 }}>Set a new password</div>
          {done ? (
            <p style={{ fontSize: 14, lineHeight: 1.6 }}>Your password has been reset. You can close this page and log in with your new password.</p>
          ) : (
            <>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Field label="New password">
                  <input autoFocus type="password" style={inputStyle} value={pw} onChange={(e) => setPw(e.target.value)} placeholder="At least 4 characters" />
                </Field>
                <Field label="Confirm new password">
                  <input type="password" style={inputStyle} value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Repeat password" />
                </Field>
              </div>
              {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{error}</div>}

}
