   CUSTOMER: Delivery address + radius/fee gate for an order
   ========================================================================= */

// Backward-compatible: a location saved before tiered pricing existed has a
// flat radiusKm/deliveryFee instead of a tiers array. Synthesize a single
// tier from those old fields so nothing already configured breaks.
function getTiers(loc) {
  if (Array.isArray(loc.tiers) && loc.tiers.length > 0) return [...loc.tiers].sort((a, b) => a.maxKm - b.maxKm);
  return [{ maxKm: loc.radiusKm ?? 3, fee: loc.deliveryFee ?? 0 }];
}

function evaluateAddress(addr, locations) {
  const activeLocations = locations.filter((l) => l.active);
  if (activeLocations.length === 0) return { ok: true, deliveryFee: 0, name: null, distance: null };
  let best = null;
  for (const loc of activeLocations) {
    const dist = haversineKm(addr.lat, addr.lng, loc.lat, loc.lng);
    if (!best || dist < best.dist) best = { dist, loc };
  }
  const tiers = getTiers(best.loc);
  const matchedTier = tiers.find((t) => best.dist <= t.maxKm);
  const maxRadius = tiers[tiers.length - 1].maxKm;
  const ok = !!matchedTier;
  return { ok, distance: best.dist, name: best.loc.name, radius: maxRadius, deliveryFee: matchedTier ? matchedTier.fee : 0 };
}

function AddressGate({ myName, myCustomerId, locations, resolved, onResolved, addresses, loaded, onAddressesChange }) {
  const [selectedId, setSelectedId] = useState(null);
  const [form, setForm] = useState(null);
  const [geoBusy, setGeoBusy] = useState(false);
  const [error, setError] = useState("");

  const selectAddress = (addr) => {
    setSelectedId(addr.id);
    const info = evaluateAddress(addr, locations);
    onResolved(info.ok
      ? { ok: true, deliveryFee: info.deliveryFee, name: info.name, distance: info.distance, address: addr }
      : { ok: false, distance: info.distance, name: info.name, radius: info.radius, address: addr });
  };

  // Auto-pick the default address (or the only one on file) instead of
  // making the customer choose it every time -- only kicks in once, when
  // addresses first load and nothing's selected yet.
  useEffect(() => {
    if (!loaded || resolved) return;
    const def = addresses.find((a) => a.isDefault) || (addresses.length === 1 ? addresses[0] : null);
    if (def) selectAddress(def);
  }, [loaded, addresses]);

  const startNew = () => { setForm({ label: "", address: "", lat: "", lng: "" }); setError(""); };
  const useDeviceLocation = () => {
    setError(""); setGeoBusy(true);
    if (!navigator.geolocation) { setError("Your browser doesn't support location services — enter coordinates manually below."); setGeoBusy(false); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setForm((f) => ({ ...f, lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) })); setGeoBusy(false); },
      () => { setError("Couldn't access your location — you can enter coordinates manually below instead."); setGeoBusy(false); },
      { timeout: 8000 }
    );
  };
  const saveNewAddress = async () => {
    if (!form.label.trim() || !form.address.trim()) { setError("Add a label and the address."); return; }
    const lat = parseFloat(form.lat), lng = parseFloat(form.lng);
    if (Number.isNaN(lat) || Number.isNaN(lng)) { setError("Add coordinates — use the location button or enter them manually."); return; }
    const entry = { id: uid("addr_"), customerId: myCustomerId, label: form.label.trim(), address: form.address.trim(), lat, lng, isDefault: addresses.length === 0, createdAt: Date.now() };
    const next = [...addresses, entry];
    await onAddressesChange(next);
    setForm(null);
    selectAddress(entry);
  };
  const setDefault = async (id) => {
    await onAddressesChange(addresses.map((a) => ({ ...a, isDefault: a.id === id })));
  };

  if (!loaded) return null;

  if (resolved?.address && resolved.ok) {
    return (
      <Card style={{ marginBottom: 16, background: "var(--tone-good-bg)", border: "none" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, flexWrap: "wrap" }}>
          <MapPin size={16} />
          Delivering to <b>{resolved.address.label}</b> ({resolved.address.address}).
          {resolved.name && <> Within range of <b>{resolved.name}</b>.</>}
          {resolved.deliveryFee > 0 && <Pill>Delivery fee {rupee(resolved.deliveryFee)}</Pill>}
        </div>
        <button onClick={() => { setSelectedId(null); onResolved(null); }} style={{ background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 12.5, textDecoration: "underline", marginTop: 8 }}>Use a different address</button>
      </Card>
    );
  }

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <MapPin size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Deliver to</div>
      </div>

      {addresses.length > 0 && !form && !addresses.some((a) => a.isDefault) && (
        <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 10 }}>Choose an address below to continue — or set one as your default so it's picked automatically next time.</p>
      )}

      {addresses.length > 0 && !form && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          {addresses.map((a) => (
            <div key={a.id} style={{ position: "relative" }}>
              <button onClick={() => selectAddress(a)} className={"session-card" + (selectedId === a.id ? " selected" : "")} style={{ textAlign: "left", width: "100%" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 15 }}>{a.label}</div>
                  {a.isDefault && <Pill tone="good">Default</Pill>}
                </div>
                <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{a.address}</div>
              </button>
              {!a.isDefault && (
                <button onClick={(e) => { e.stopPropagation(); setDefault(a.id); }} style={{ position: "absolute", top: 10, right: 12, background: "none", border: "none", color: "var(--leaf)", cursor: "pointer", padding: 0, fontSize: 11.5, textDecoration: "underline" }}>Set as default</button>
              )}
            </div>
          ))}
        </div>
      )}

      {resolved?.address && !resolved.ok && (
        <div style={{ marginBottom: 12 }}>
          <Pill tone="bad">Outside delivery area</Pill>
          <p style={{ fontSize: 13.5, marginTop: 8 }}>
            <b>{resolved.address.label}</b> is outside our nearest delivery area, <b>{resolved.name}</b> (which delivers within {resolved.radius} km). We can&apos;t take an order there yet.
          </p>
        </div>
      )}

      {form ? (
        <div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label="Label"><input style={inputStyle} value={form.label} onChange={(e) => setForm({ ...form, label: e.target.value })} placeholder="Home" /></Field>
            <Field label="Address"><input style={inputStyle} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} placeholder="Flat 4B, 12 MG Road, Bengaluru" /></Field>
            <div><Btn small variant="ghost" onClick={useDeviceLocation} disabled={geoBusy}><Navigation size={13} /> {geoBusy ? "Locating…" : "Use my current location"}</Btn></div>
            <div className="form-grid-2">
              <Field label="Latitude"><input style={inputStyle} value={form.lat} onChange={(e) => setForm({ ...form, lat: e.target.value })} placeholder="12.9716" /></Field>
              <Field label="Longitude"><input style={inputStyle} value={form.lng} onChange={(e) => setForm({ ...form, lng: e.target.value })} placeholder="77.5946" /></Field>
            </div>
          </div>
          {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{error}</div>}
          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <Btn small onClick={saveNewAddress}>Save & use this address</Btn>
            <Btn small variant="ghost" onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <Btn small variant="ghost" onClick={startNew}><Plus size={13} /> Add a new address</Btn>
      )}
    </Card>
  );
}

/* ============================================================================
   CUSTOMER: Phone number -- required before ordering, re-confirmed each time
   ========================================================================= */

function PhoneGate({ myName, resolved, onResolved, phone, loaded, onPhoneChange }) {
  const [editing, setEditing] = useState(false);
  const [draftPhone, setDraftPhone] = useState("");
  const [error, setError] = useState("");

  // Once a phone is on file, resolve immediately -- no need to reconfirm
  // it on every order. Only asks if it's genuinely missing.
  useEffect(() => {
    if (!loaded || resolved?.ok) return;
    if (phone) onResolved({ ok: true, phone });
    else setEditing(true);
  }, [loaded, phone]);

  const validatePhone = (p) => /^[0-9+\-\s()]{7,15}$/.test(p.trim());

  const savePhone = async () => {
    const cleaned = draftPhone.trim();
    if (!validatePhone(cleaned)) { setError("Enter a valid phone number."); return; }
    setError("");
    await saveCustomerPhone(myName, cleaned);
    onPhoneChange(cleaned);
    setEditing(false);
    onResolved({ ok: true, phone: cleaned });
  };

  if (!loaded) return null;

  // Once resolved with a phone already on file, there's nothing to show --
  // it's used silently. Changing it lives on the Profile page now, not here.
  if (resolved?.ok && phone && !editing) return null;

  return (
    <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Phone size={17} color="var(--leaf)" />
        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Contact number</div>
      </div>
      <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "0 0 12px" }}>We&apos;ll use this number to reach you about your order.</p>
      <Field label="Phone number">
        <input style={inputStyle} value={draftPhone} onChange={(e) => setDraftPhone(e.target.value)} placeholder="9876543210" />
      </Field>
      {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <Btn small onClick={savePhone} loadingText="Saving…">Save number</Btn>
        {phone && <Btn small variant="ghost" onClick={() => setEditing(false)}>Cancel</Btn>}
      </div>
    </Card>
  );
}

/* ============================================================================
   CUSTOMER: Order food (meal builder → payment → confirmation)
   ========================================================================= */

function OrderFoodView({ myName, myCustomerId, myPhone, myPhoneLoaded, onMyPhoneChange, dogs, ingredients, breeds, engine, config, orders, cancelledSlots, forceOpenSlots, slotOverrides, locations, qrCode, initialDogId, setOrders, allAddresses, setAllAddresses, goToOrders }) {
  const myDogs = dogs.filter((d) => d.owner === myName);
  const [dogId, setDogId] = useState(initialDogId || myDogs[0]?.id || "");
  const [dateIdx, setDateIdx] = useState(0);
  const [session, setSession] = useState(null);
  const [selected, setSelected] = useState(new Set(ingredients.filter((i) => i.autoIncluded && i.available).map((i) => i.id)));
  const [customQty, setCustomQty] = useState(() => {
    const m = {};
    ingredients.forEach((i) => { if (i.quantityAdjustable) m[i.id] = i.default; });
    return m;
  });
  const [locationResolved, setLocationResolved] = useState(null);
  const [phoneResolved, setPhoneResolved] = useState({ ok: false });

  // Addresses come from the app-level collection now (loaded once at
  // startup alongside orders/dogs), filtered to just this customer.
  const gateAddresses = allAddresses.filter((a) => a.customerId === myCustomerId);
  const gateAddressesLoaded = !!myCustomerId;
  const onGateAddressesChange = async (next) => {
    const others = allAddresses.filter((a) => a.customerId !== myCustomerId);
    const combined = [...others, ...next];
    setAllAddresses(combined);
    await persist(K.addresses, combined);
  };
  const [deliveryNote, setDeliveryNote] = useState("");
  const [leaveAtDoor, setLeaveAtDoor] = useState(false);
  const [uncheckedItems, setUncheckedItems] = useState(new Set()); // items the customer has unchecked (default: all checked)
  const [placingCod, setPlacingCod] = useState(false);
  const [stage, setStage] = useState("build"); // build -> payment -> done
  const [draftOrder, setDraftOrder] = useState(null);
  const [placed, setPlaced] = useState(null);

  useEffect(() => { if (!dogId && myDogs[0]) setDogId(myDogs[0].id); }, [myDogs.length]);

  // A scroll position carried over from the meal builder (which can get
  // fairly long) otherwise leaves the top of the next screen -- e.g. the QR
  // code on the payment screen -- rendered off the top of the viewport,
  // especially noticeable on mobile where there's no way to see "above" the
  // current scroll position without manually scrolling up.
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [stage]);

  const dog = myDogs.find((d) => d.id === dogId);
  const dogForCalc = dog ? { ...dog, ageMonths: effectiveAgeMonths(dog) } : dog;
  const dates = Array.from({ length: 14 }, (_, i) => addDays(todayStr(), i));
  const date = dates[dateIdx];

  const nextSlot = useMemo(() => nextAvailableSlot(config, orders, cancelledSlots, forceOpenSlots, slotOverrides), [config, orders, cancelledSlots, forceOpenSlots, slotOverrides]);
  const bothFullToday = ["morning", "evening"].every((k) => {
    const st = sessionState(todayStr(), k, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
    return st === "FULL" || st === "CLOSED" || st === "CANCELLED";
  });

  const toggleIngredient = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  const preview = useMemo(() => {
    if (!dog) return [];
    return ingredients
      .filter((i) => selected.has(i.id) && i.available)
      .sort((a, b) => a.displayOrder - b.displayOrder)
      .map((i) => {
        const qty = i.quantityAdjustable ? (customQty[i.id] ?? i.default) : calcAutoQty(i, dogForCalc, breeds, engine);
        return { id: i.id, name: i.name, unit: i.unit, qty, pricePerUnit: i.pricePerUnit };
      });
  }, [dog, dogForCalc, selected, customQty, ingredients, breeds, engine]);

  const foodTotal = preview.reduce((s, p) => s + p.qty * p.pricePerUnit, 0);
  const deliveryFee = locationResolved?.deliveryFee || 0;
  const subtotal = foodTotal + deliveryFee;
  const gstAmount = config.gstEnabled ? Math.round(subtotal * (config.gstPercent || 0)) / 100 : 0;
  const total = subtotal + gstAmount;

  const buildDraft = () => {
    if (!dog || !session) return null;
    const sessInfo = config.sessions[session];
    return {
      id: uid("ord_"),
      customerName: myName,
      customerId: myCustomerId,
      dogId: dog.id,
      dogSnapshot: { name: dog.name, breed: dog.breed, ageMonths: effectiveAgeMonths(dog), weightKg: dog.weightKg, activity: dog.activity },
      date, session, servingTime: sessInfo.servingTime,
      ingredients: preview,
      foodTotal: Math.round(foodTotal),
      deliveryFee: Math.round(deliveryFee),
      locationName: locationResolved?.name || null,
      customerAddress: locationResolved?.address ? {
        label: locationResolved.address.label,
        address: locationResolved.address.address,
        lat: locationResolved.address.lat,
        lng: locationResolved.address.lng,
      } : null,
      distanceKm: typeof locationResolved?.distance === "number" ? Math.round(locationResolved.distance * 10) / 10 : null,
      gstAmount: Math.round(gstAmount),
      gstPercent: config.gstEnabled ? (config.gstPercent || 0) : 0,
      totalPrice: Math.round(total),
      currencySymbol: config.currencySymbol || "₹",
      mealChecklist: (config.mealChecklist || []).map((item) => ({ id: item.id, text: item.text, accepted: !uncheckedItems.has(item.id) })),
      customerPhone: phoneResolved.phone || "",
      leaveAtDoor,
      deliveryNote: deliveryNote.trim(),
      createdAt: Date.now(),
    };
  };

  const goToPayment = () => {
    const draft = buildDraft();
    if (!draft) return;
    if (qrCode && config.codEnabled) {
      setDraftOrder(draft);
      setStage("choosePayment");
    } else if (qrCode) {
      setDraftOrder(draft);
      setStage("payment");
    } else if (config.codEnabled) {
      return finalizeOrder(draft, "CONFIRMED", "cod");
    }
  };

  const finalizeOrder = async (draft, status, paymentMethod = "upi") => {
    const order = { ...draft, status, paymentMethod, paymentClaimedAt: status === "PENDING_PAYMENT" ? Date.now() : null };
    const next = [...orders, order];
    setOrders(next);
    await persist(K.orders, next);

    // Record each ingredient as its own OrderItems row too (a real
    // orderId + ingredientId relationship), built alongside the existing
    // embedded snapshot rather than replacing it -- nothing that already
    // reads order.ingredients needs to change. Best-effort: the order
    // itself is already safely saved above regardless of this succeeding.
    try {
      const existingItems = await loadOrSeed(K.orderItems, []);
      const newItems = order.ingredients.map((ing) => ({
        id: uid("item_"), orderId: order.id, ingredientId: ing.id, ingredientName: ing.name,
        qty: ing.qty, unit: ing.unit, pricePerUnit: ing.pricePerUnit, lineTotal: Math.round(ing.qty * ing.pricePerUnit * 100) / 100,
      }));
      await persist(K.orderItems, [...existingItems, ...newItems]);
    } catch {}

    setPlaced(order);
    setStage("done");
  };

  if (!myName) return <Card><p style={{ margin: 0 }}>Sign in up top before ordering.</p></Card>;
  if (myDogs.length === 0) return <Card><p style={{ margin: 0 }}>Add a dog profile first — head to <b>My Dogs</b>.</p></Card>;
  if (config.orderingPaused) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <Ban size={17} color="var(--clay)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Not taking new orders right now</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>{config.orderingPausedMessage || "We're not taking new orders right now. Please check back soon."}</p>
        </Card>
      </div>
    );
  }
  if (!qrCode && !config.codEnabled) {
    return (
      <div>
        <SectionTitle eyebrow="Customer" title="Order food" />
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <QrCode size={17} color="var(--turmeric)" />
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>Ordering isn&apos;t open yet</div>
          </div>
          <p style={{ fontSize: 14, color: "var(--muted)", margin: 0 }}>Payment isn&apos;t set up yet, so orders can&apos;t be placed right now. Please check back soon.</p>
        </Card>
      </div>
    );
  }

  if (stage === "choosePayment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="How would you like to pay?" />
        <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700, marginBottom: 18 }}>{rupee(draftOrder.totalPrice)}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <button onClick={() => setStage("payment")} className="session-card" style={{ textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <QrCode size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>Pay online now</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Scan a QR code to pay via any UPI app</div>
              </div>
            </div>
          </button>
          <button
            onClick={async () => {
              if (placingCod) return;
              setPlacingCod(true);
              try { await finalizeOrder(draftOrder, "CONFIRMED", "cod"); } finally { setPlacingCod(false); }
            }}
            disabled={placingCod}
            className="session-card"
            style={{ textAlign: "left", opacity: placingCod ? 0.6 : 1, cursor: placingCod ? "not-allowed" : "pointer" }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Banknote size={20} color="var(--leaf)" />
              <div>
                <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>{placingCod ? "Placing order…" : "Cash on Delivery"}</div>
                <div style={{ fontSize: 13, color: "var(--muted)" }}>Pay in cash when your order arrives</div>
              </div>
            </div>
          </button>
        </div>
        <Btn full variant="ghost" style={{ marginTop: 14 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
      </div>
    );
  }

  if (stage === "payment" && draftOrder) {
    return (
      <div style={{ maxWidth: 440 }}>
        <SectionTitle eyebrow="Customer" title="Scan to pay" />
        <Card style={{ textAlign: "center" }}>
          <img src={qrCode} alt="Payment QR code" style={{ width: "100%", maxWidth: 260, borderRadius: 16, border: "1px solid var(--ring)", margin: "0 auto 16px" }} />
          <div style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700, marginBottom: 4 }}>{rupee(draftOrder.totalPrice)}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", marginBottom: 18 }}>
            {draftOrder.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(draftOrder.date)} &middot; {config.sessions[draftOrder.session].label}
            {draftOrder.deliveryFee > 0 && <> &middot; incl. {rupee(draftOrder.deliveryFee)} delivery</>}
            {draftOrder.gstAmount > 0 && <> &middot; incl. {rupee(draftOrder.gstAmount)} GST</>}
          </div>
          <Btn full variant="outline" onClick={() => downloadDataUrl(qrCode, "payment-qr-code.png")} style={{ marginBottom: 10 }}><Download size={15} /> Download QR code</Btn>
          <Btn full onClick={() => finalizeOrder(draftOrder, "PENDING_PAYMENT")}>I&apos;ve completed the payment</Btn>
          <Btn full variant="ghost" style={{ marginTop: 8 }} onClick={() => { setStage("build"); setDraftOrder(null); }}>Back</Btn>
          <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 14 }}>Your order is held in your slot as soon as you confirm payment here &mdash; our team verifies it and moves your order to Confirmed.</p>
        </Card>
      </div>
    );
  }

  if (stage === "done" && placed) {
    const pending = placed.status === "PENDING_PAYMENT";
    return (
      <div style={{ maxWidth: 480 }}>
        <Card style={{ textAlign: "center", padding: 32 }}>
          <div style={{ display: "inline-flex", background: pending ? "var(--turmeric)" : "var(--leaf)", borderRadius: "50%", padding: 14, marginBottom: 12 }}>
            {pending ? <CreditCard size={26} color="#1d1d1f" /> : <Check size={26} color="#fff" />}
          </div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 22, fontWeight: 600, marginBottom: 6 }}>{pending ? "Order submitted" : "Order confirmed"}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>
            {placed.dogSnapshot.name}&apos;s meal &middot; {fmtDateLabel(placed.date)} &middot; {config.sessions[placed.session].label} ({fmtTime(placed.servingTime)})
          </div>
          {pending && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Awaiting payment confirmation from our team.</p>}
          {placed.paymentMethod === "cod" && <p style={{ fontSize: 13.5, color: "var(--muted)", marginBottom: 14 }}>Have {rupee(placed.totalPrice)} ready in cash when your order arrives.</p>}
          <Btn onClick={goToOrders}>View my orders <ChevronRight size={15} /></Btn>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="Order food" />
      <AddressGate myName={myName} myCustomerId={myCustomerId} locations={locations} resolved={locationResolved} onResolved={setLocationResolved} addresses={gateAddresses} loaded={gateAddressesLoaded} onAddressesChange={onGateAddressesChange} />
      <PhoneGate myName={myName} resolved={phoneResolved} onResolved={setPhoneResolved} phone={myPhone} loaded={myPhoneLoaded} onPhoneChange={onMyPhoneChange} />

      {!(locationResolved?.ok && phoneResolved.ok) ? null : (
        <>
          {bothFullToday && nextSlot && (
            <Card style={{ marginBottom: 16, background: "var(--tone-warn-bg)", border: "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
                <AlertTriangle size={16} />
                Today&apos;s servings are fully booked. Next available: <b>{fmtDateLabel(nextSlot.date)} &middot; {config.sessions[nextSlot.session].label}</b>.
              </div>
            </Card>
          )}

          <Card style={{ marginBottom: 16 }}>
            <Field label="Dog">
              <select style={inputStyle} value={dogId} onChange={(e) => setDogId(e.target.value)}>
                {myDogs.map((d) => <option key={d.id} value={d.id}>{d.name} &middot; {d.breed}</option>)}
              </select>
            </Field>
          </Card>

          <Card style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Pick a date</div>
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
              {dates.map((d, i) => (
                <button key={d} onClick={() => { setDateIdx(i); setSession(null); }} className={"date-chip" + (i === dateIdx ? " active" : "")}>{fmtDateLabel(d)}</button>
              ))}
            </div>
            <div className="session-grid" style={{ marginTop: 16 }}>
              {["morning", "evening"].map((key) => {
                const st = sessionState(date, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
                const sess = config.sessions[key];
                const capacity = resolveCapacity(date, key, config, slotOverrides);
                const count = slotCount(date, key, orders);
                const disabled = st === "FULL" || st === "CLOSED" || st === "CANCELLED";
                const isSelected = session === key;
                return (
                  <button key={key} disabled={disabled} onClick={() => setSession(key)} className={"session-card" + (isSelected ? " selected" : "")} style={{ opacity: disabled ? 0.55 : 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 16 }}>{sess.label}</div>
                        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>{fmtTime(sess.servingTime)}</div>
                      </div>
                      <BowlGauge used={count} capacity={capacity} size={52} />
                    </div>
                    <div style={{ marginTop: 8 }}><Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill></div>
                  </button>
                );
              })}
            </div>
          </Card>

          {session && dog && (
            <Card>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Build {dog.name}&apos;s meal</div>
              <InfoNote>
                Staples like chicken and rice are portioned automatically from {dog.name}&apos;s weight, breed size, age and activity level, then billed by weight. Egg and other customizable extras are billed per unit you choose.
              </InfoNote>
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 2, marginTop: 14 }}>
                {ingredients.filter((i) => i.available).sort((a, b) => a.displayOrder - b.displayOrder).map((ing) => {
                  const isSel = selected.has(ing.id);
                  const qty = ing.quantityAdjustable ? (customQty[ing.id] ?? ing.default) : calcAutoQty(ing, dog, breeds, engine);
                  const subtotal = qty * ing.pricePerUnit;
                  return (
                    <div key={ing.id} className="ingredient-row">
                      <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flex: 1, minWidth: 0 }}>
                        <input type="checkbox" checked={isSel} onChange={() => toggleIngredient(ing.id)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                        <span style={{ fontFamily: "var(--font-body)", fontSize: 14.5 }}>{ing.name}</span>
                        {ing.quantityAdjustable && <Pill>Customizable</Pill>}
                      </label>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                        {isSel ? (
                          <>
                            {ing.quantityAdjustable ? (() => {
                              const step = ing.unit === "count" ? 1 : 5;
                              return (
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                  <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.max(ing.min, (customQty[ing.id] ?? ing.default) - step) })} className="stepper-btn"><Minus size={13} /></button>
                                  <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, width: 18, textAlign: "center" }}>{customQty[ing.id] ?? ing.default}</span>
                                  <button onClick={() => setCustomQty({ ...customQty, [ing.id]: Math.min(ing.max, (customQty[ing.id] ?? ing.default) + step) })} className="stepper-btn"><Plus size={13} /></button>
                                </div>
                              );
                            })() : (
                              <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700 }}>{qty} {ing.unit}</span>
                            )}
                            <span style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", minWidth: 44, textAlign: "right" }}>{rupee(subtotal)}</span>
                          </>
                        ) : (
                          <span style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--ring-strong)" }}>&mdash;</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {(config.mealChecklist || []).length > 0 && (
                <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                  {config.mealChecklist.map((item) => {
                    const checked = !uncheckedItems.has(item.id);
                    return (
                      <label key={item.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
                        <input
                          type="checkbox" checked={checked}
                          onChange={(e) => {
                            setUncheckedItems((prev) => {
                              const next = new Set(prev);
                              e.target.checked ? next.delete(item.id) : next.add(item.id);
                              return next;
                            });
                          }}
                          style={{ width: 17, height: 17, marginTop: 2, accentColor: "var(--leaf)", flexShrink: 0 }}
                        />
                        <span style={{ fontSize: 13.5, color: "var(--muted)" }}>{item.text}</span>
                      </label>
                    );
                  })}
                </div>
              )}

              <div style={{ marginTop: 18, paddingTop: 16, borderTop: "1.5px dashed var(--ring-strong)" }}>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 10 }}>Delivery instructions</div>
                <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", marginBottom: 12 }}>
                  <input type="checkbox" checked={leaveAtDoor} onChange={(e) => setLeaveAtDoor(e.target.checked)} style={{ width: 17, height: 17, accentColor: "var(--leaf)", flexShrink: 0 }} />
                  <span style={{ fontSize: 14 }}>Leave at the door</span>
                </label>
                <Field label="Additional requests (optional)">
                  <input style={inputStyle} value={deliveryNote} onChange={(e) => setDeliveryNote(e.target.value)} placeholder="Anything else we should know?" />
                </Field>
              </div>

              <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1.5px dashed var(--ring-strong)", display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Food</span><span>{rupee(foodTotal)}</span></div>
                {deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>Delivery{locationResolved?.name ? ` (${locationResolved.name})` : ""}</span><span>{rupee(deliveryFee)}</span></div>}
                {config.gstEnabled && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, color: "var(--muted)" }}><span>GST ({config.gstPercent}%)</span><span>{rupee(gstAmount)}</span></div>}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: "var(--muted)" }}>Total</div>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700 }}>{rupee(total)}</div>
                </div>
              </div>
              <Btn onClick={goToPayment} full style={{ marginTop: 14 }} disabled={preview.length === 0}>
                {qrCode ? "Continue to payment" : "Place order (Cash on Delivery)"}
              </Btn>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

function InvoiceContent({ order, config }) {
  const currency = order.currencySymbol || config.currencySymbol || "₹";
  const money = (n) => `${currency}${Math.round(n).toLocaleString("en-IN")}`;
  const rateMoney = (n) => {
    const rounded = Math.round(n * 100) / 100;
    const str = rounded % 1 === 0 ? String(rounded) : rounded.toFixed(2).replace(/0$/, "");
    return `${currency}${str}`;
  };
  return (
    <div className="invoice-print">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18, gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {config.logoDataUrl ? (
            <img src={config.logoDataUrl} alt="" style={{ width: 40, height: 40, borderRadius: 10, objectFit: "cover" }} />
          ) : (
            <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex" }}><Dog size={18} color="#fff" /></div>
          )}
          <div>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 18 }}>{config.serviceName}</div>
            {config.gstNumber && <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)" }}>GSTIN: {config.gstNumber}</div>}
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase" }}>Invoice</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5 }}>#{order.id.slice(-8)}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--muted)" }}>{fmtDateTime(order.createdAt)}</div>
        </div>
      </div>

      <div className="form-grid-2" style={{ marginBottom: 16 }}>
        <div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 4 }}>Billed to</div>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{order.customerName}</div>
          {order.customerPhone && <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.customerPhone}</div>}
          {order.customerAddress && <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.customerAddress.address}</div>}
        </div>
        <div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", textTransform: "uppercase", marginBottom: 4 }}>Order</div>
          <div style={{ fontSize: 13 }}>{order.dogSnapshot.name}&apos;s meal</div>
          <div style={{ fontSize: 13, color: "var(--muted)" }}>{fmtDateLabel(order.date)} &middot; {config.sessions?.[order.session]?.label || order.session}</div>
          <div style={{ fontSize: 13, color: "var(--muted)" }}>{order.paymentMethod === "cod" ? "Cash on Delivery" : "UPI / QR"} &middot; {STATUS_LABEL[order.status]}</div>
        </div>
      </div>

      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 14 }}>
        <thead>
          <tr style={{ borderBottom: "1.5px solid var(--ring-strong)", textAlign: "left" }}>
            <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)" }}>Item</th>
            <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Qty</th>
            <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Rate</th>
            <th style={{ padding: "6px 4px", fontFamily: "var(--font-mono)", fontSize: 11, textTransform: "uppercase", color: "var(--muted)", textAlign: "right" }}>Amount</th>
          </tr>
        </thead>
        <tbody>
          {order.ingredients.map((ing) => (
            <tr key={ing.id} style={{ borderBottom: "1px solid var(--ring)" }}>
              <td style={{ padding: "6px 4px" }}>{ing.name}</td>
              <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{ing.qty} {ing.unit}</td>
              <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{rateMoney(ing.pricePerUnit)}/{ing.unit}</td>
              <td style={{ padding: "6px 4px", textAlign: "right", fontFamily: "var(--font-mono)" }}>{money(ing.qty * ing.pricePerUnit)}</td>
            </tr>
          ))}
        </tbody>
      </table>

      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginLeft: "auto", maxWidth: 220 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>Food</span><span>{money(order.foodTotal)}</span></div>
        {order.deliveryFee > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>Delivery</span><span>{money(order.deliveryFee)}</span></div>}
        {order.gstAmount > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}><span>GST ({order.gstPercent}%)</span><span>{money(order.gstAmount)}</span></div>}
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700, marginTop: 6, paddingTop: 6, borderTop: "1.5px solid var(--ring-strong)" }}><span>Total</span><span>{money(order.totalPrice)}</span></div>
      </div>

      {(order.leaveAtDoor || order.deliveryNote) && (
        <div style={{ marginTop: 16, paddingTop: 12, borderTop: "1px dashed var(--ring-strong)", fontSize: 12.5, color: "var(--muted)" }}>
          {order.leaveAtDoor && <div>Leave at the door</div>}
          {order.deliveryNote && <div>{order.deliveryNote}</div>}
        </div>
      )}
    </div>
  );
}

function InvoiceModal({ order, config, onClose }) {
  // A dedicated container living outside the app's own root, created once
  // and reused. During print, CSS hides the entire app root and shows only
  // this container -- so there's exactly one copy of the invoice on the
  // page, and nothing else around it that could span multiple pages.
  const [portalEl] = useState(() => {
    let el = document.getElementById("invoice-print-portal");
    if (!el) {
      el = document.createElement("div");
      el.id = "invoice-print-portal";
      document.body.appendChild(el);
    }
    return el;
  });

  if (!order) return null;

  return (
    <>
      <Modal onCancel={onClose} maxWidth={520}>
        <InvoiceContent order={order} config={config} />
        <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
          <Btn full onClick={() => window.print()}><Download size={15} /> Print</Btn>
          <Btn full variant="ghost" onClick={onClose}>Close</Btn>
        </div>
      </Modal>
      {createPortal(<InvoiceContent order={order} config={config} />, portalEl)}
    </>
  );
}

// Automatically opens the print dialog for one order's invoice, without
// needing InvoiceModal open on screen -- used for "auto-print on confirm".
// Browsers do not allow a webpage to silently send a print job to a
// specific printer without a person confirming a system dialog; there is
// no client-side way around that, by design (it'd otherwise let any page
// print to your printer without asking). This gets you as close as a
// browser allows: the print dialog opens on its own the moment an order
// is confirmed, with that order's invoice already loaded and ready --
// whoever's at the till still needs to click "Print" in that dialog.
function SilentPrintTrigger({ order, config, onDone }) {
  const [portalEl] = useState(() => {
    let el = document.getElementById("invoice-print-portal");
    if (!el) {
      el = document.createElement("div");
      el.id = "invoice-print-portal";
      document.body.appendChild(el);
    }
    return el;
  });

  useEffect(() => {
    const t = setTimeout(() => {
      window.print();
      onDone?.();
    }, 250); // give the portal content a moment to actually paint first
    return () => clearTimeout(t);
  }, []);

  return createPortal(<InvoiceContent order={order} config={config} />, portalEl);
}

function MyOrdersView({ myName, orders, config, qrCode }) {
  const mine = orders.filter((o) => o.customerName === myName).sort((a, b) => b.createdAt - a.createdAt);
  const [viewingQrOrder, setViewingQrOrder] = useState(null);
  const [viewingInvoice, setViewingInvoice] = useState(null);
  if (!myName) return <Card><p style={{ margin: 0 }}>Sign in up top to see your orders.</p></Card>;
  if (mine.length === 0) return <Card><p style={{ margin: 0 }}>No orders yet — place one from <b>Order Food</b>.</p></Card>;

  return (
    <div>
      <SectionTitle eyebrow="Customer" title="My orders" />
      {viewingInvoice && <InvoiceModal order={viewingInvoice} config={config} onClose={() => setViewingInvoice(null)} />}
      {viewingQrOrder && (
        <Modal onCancel={() => setViewingQrOrder(null)} maxWidth={340}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 12 }}>Scan to pay</div>
            {qrCode ? (
              <>

function ResetPasswordView({ token, config }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  const submit = async () => {
    if (pw.length < 4) { setError("Password must be at least 4 characters."); return; }
    if (pw !== pw2) { setError("Passwords don't match."); return; }
    setBusy(true); setError("");
    try {
      await resetPasswordWithToken(token, pw);
      setDone(true);
    } catch (err) {
      setError(err?.message || "That reset link is invalid or has expired. Request a new one from the login screen.");
    }
    setBusy(false);
  };

  return (
    <Shell theme="light">
      <div style={{ maxWidth: 440, margin: "60px auto", padding: "0 20px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          {config.logoDataUrl ? (
            <img src={config.logoDataUrl} alt="" style={{ width: 36, height: 36, borderRadius: 10, objectFit: "cover" }} />
          ) : (
            <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 8, display: "flex" }}><Dog size={18} color="#fff" /></div>
          )}
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 19 }}>{config.serviceName}</div>
        </div>
        <Card>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18, marginBottom: 14 }}>Set a new password</div>
          {done ? (
            <p style={{ fontSize: 14, lineHeight: 1.6 }}>Your password has been reset. You can close this page and log in with your new password.</p>
          ) : (
            <>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Field label="New password">
                  <input autoFocus type="password" style={inputStyle} value={pw} onChange={(e) => setPw(e.target.value)} placeholder="At least 4 characters" />
                </Field>
                <Field label="Confirm new password">
                  <input type="password" style={inputStyle} value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Repeat password" />

              {error && <div style={{ color: "var(--clay)", fontSize: 13, marginTop: 10 }}>{error}</div>}
              <Btn full style={{ marginTop: 16 }} onClick={submit} disabled={busy}>{busy ? "Resetting…" : "Reset password"}</Btn>
            </>
          )}
        </Card>
      </div>
    </Shell>
  );
}

/* ============================================================================
   ADMIN: Data (customer directory + exports/backup)
   A browser page can't read or write arbitrary files on disk on its own --
   that's a security boundary, not a limitation of this app. What it *can*
   do, which covers the same need, is generate a real file for you to save
   (CSV/JSON) and read one back in. Everything below is otherwise already
   durably saved as it's created -- this tab is about getting it out as a
   file you can open, back up, or move to another browser.
   ========================================================================= */

function downloadTextFile(filename, mime, text) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCsvValue(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows, columns) {
  const header = columns.map((c) => toCsvValue(c.label)).join(",");
  const body = rows.map((r) => columns.map((c) => toCsvValue(c.get(r))).join(",")).join("\n");
  return header + "\n" + body;
}

function AdminDashboard({ config, orders, cancelledSlots, forceOpenSlots, slotOverrides, locations, onGoToOrders, onRefresh }) {
  const [newCustomersToday, setNewCustomersToday] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [dateIdx, setDateIdx] = useState(0);
  const [showIngredientsNeeded, setShowIngredientsNeeded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const list = await window.storage.list("dfp:customer:", true);
        const today = todayStr();
        let count = 0;
        await Promise.all((list?.keys || []).map(async (k) => {
          try {
            const r = await window.storage.get(k, true);
            const rec = JSON.parse(r.value);
            if (rec?.createdAt && toDateStr(new Date(rec.createdAt)) === today) count++;
          } catch {}
        }));
        setNewCustomersToday(count);
      } catch { setNewCustomersToday(0); }
    })();
  }, [orders.length]);

  const handleRefresh = async () => {
    setRefreshing(true);
    await onRefresh?.();
    setRefreshing(false);
  };

  const date = todayStr();
  const mealsToday = orders.filter((o) => o.date === date && o.status !== "CANCELLED");
  const ordersCreatedToday = orders.filter((o) => toDateStr(new Date(o.createdAt)) === date);
  const revenueToday = mealsToday.filter((o) => STATUS_FLOW.includes(o.status)).reduce((s, o) => s + (o.totalPrice || 0), 0);
  const pendingDelivery = mealsToday.filter((o) => ["CONFIRMED", "PREPARING", "COOKED", "PACKED", "OUT_FOR_DELIVERY"].includes(o.status)).length;
  const morningMeals = mealsToday.filter((o) => o.session === "morning").length;
  const eveningMeals = mealsToday.filter((o) => o.session === "evening").length;

  const next = nextServingWindow(config, orders);
  const nextCount = slotCount(next.date, next.session, orders);

  const activeToday = mealsToday;
  const counts = {};
  DASHBOARD_STATUSES.forEach((s) => (counts[s] = activeToday.filter((o) => o.status === s).length));

  const todaysOrders = [...ordersCreatedToday].sort((a, b) => b.createdAt - a.createdAt);

  const stats = [
    { label: "Orders", value: ordersCreatedToday.length },
    { label: "Revenue", value: rupee(revenueToday) },
    { label: "Meals", value: mealsToday.length },
    { label: "Morning", value: morningMeals },
    { label: "Evening", value: eveningMeals },
    { label: "New customers", value: newCustomersToday === null ? "…" : newCustomersToday },
    { label: "Pending delivery", value: pendingDelivery },
  ];

  // The morning/evening capacity cards below can look at any of the next
  // three days -- kept separate from "today" above, which drives the
  // stats, next-serving card, and today's order list.
  const dashDates = [todayStr(), addDays(todayStr(), 1), addDays(todayStr(), 2)];
  const dashDateLabels = ["Today", "Tomorrow", "Day after"];
  const selectedDate = dashDates[dateIdx];
  const mealsForSelectedDate = orders.filter((o) => o.date === selectedDate && o.status !== "CANCELLED");

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <SectionTitle eyebrow="Admin" title="Today's operations" />
        <Btn small variant="ghost" onClick={handleRefresh} loadingText={<><RefreshCw size={13} /> Refreshing…</>}><RefreshCw size={13} /> Refresh</Btn>
      </div>
      {config.orderingPaused && (
        <Card style={{ marginBottom: 16, background: "var(--tone-bad-bg)", border: "none" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14 }}>
            <Ban size={16} color="var(--clay)" />
            Ordering is currently <b>paused</b> &mdash; customers can&apos;t place new orders. Resume it from Settings.
          </div>
        </Card>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10, marginBottom: 18 }}>
        {stats.map((s) => (
          <Card key={s.label} style={{ padding: "16px 18px" }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase", marginBottom: 6 }}>{s.label}</div>
            <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 24 }}>{s.value}</div>
          </Card>
        ))}
      </div>

      <Card
        style={{ marginBottom: 18, display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", cursor: "pointer" }}
        onClick={() => onGoToOrders?.(next.date, next.session)}
      >
        <div style={{ background: "var(--leaf)", borderRadius: 10, padding: 9, display: "flex" }}><Clock size={17} color="#fff" /></div>
        <div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em", color: "var(--muted)", textTransform: "uppercase" }}>Next up to be served</div>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 17 }}>
            {fmtDateLabel(next.date)} &middot; {config.sessions[next.session].label} at {fmtTime(config.sessions[next.session].servingTime)}
          </div>
        </div>
        <Pill>{nextCount} booked</Pill>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={(e) => { e.stopPropagation(); setShowIngredientsNeeded(true); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12.5, color: "var(--turmeric)", fontFamily: "var(--font-mono)", padding: 0 }}>Ingredients needed</button>
          <span style={{ fontSize: 12.5, color: "var(--leaf)", fontFamily: "var(--font-mono)" }}>View orders &rarr;</span>
        </div>
      </Card>
      {showIngredientsNeeded && (
        <IngredientsNeededModal date={next.date} session={next.session} orders={orders} config={config} onClose={() => setShowIngredientsNeeded(false)} />
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {dashDates.map((d, i) => (
          <button key={d} onClick={() => setDateIdx(i)} className={"date-chip" + (i === dateIdx ? " active" : "")}>
            {dashDateLabels[i]}
          </button>
        ))}
      </div>

      <div className="session-grid" style={{ marginBottom: 18 }}>
        {["morning", "evening"].map((key) => {
          const sess = config.sessions[key];
          const capacity = resolveCapacity(selectedDate, key, config, slotOverrides);
          const count = slotCount(selectedDate, key, orders);
          const st = sessionState(selectedDate, key, config, orders, cancelledSlots, forceOpenSlots, slotOverrides);
          const outForDelivery = mealsForSelectedDate.filter((o) => o.session === key && o.status === "OUT_FOR_DELIVERY");

          // Group by which service area each order matched at order time, so
          // each area gets its own round-trip route instead of one combined
          // route with no fixed starting point.
          const groups = {};
          outForDelivery.forEach((o) => {
            const groupKey = o.locationName || "\u2014no area\u2014";
            (groups[groupKey] = groups[groupKey] || []).push(o);
          });

          return (
            <Card key={key}>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                <BowlGauge used={count} capacity={capacity} />
                <div>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 18 }}>{sess.label}</div>
                  <div style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--muted)", margin: "3px 0 6px" }}>Serving {fmtTime(sess.servingTime)}</div>
                  <Pill tone={STATE_STYLE[st].tone}>{STATE_STYLE[st].label}</Pill>
                </div>
              </div>
              {Object.keys(groups).length > 0 && (
                <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed var(--ring-strong)", display: "flex", flexDirection: "column", gap: 8 }}>
                  {Object.entries(groups).map(([areaName, groupOrders]) => {
                    const area = locations.find((l) => l.name === areaName);
                    const origin = area ? { lat: area.lat, lng: area.lng } : null;
                    const routeUrl = buildRouteUrl(groupOrders, origin);
                    return (
                      <div key={areaName}>
                        {routeUrl ? (
                          <a href={routeUrl} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                            <Btn small variant="accent"><MapPin size={13} /> {areaName} &mdash; route for {groupOrders.length} {origin ? "(round trip)" : ""}</Btn>
                          </a>
                        ) : (
                          <span style={{ fontSize: 12.5, color: "var(--muted)" }}>{areaName} &mdash; {groupOrders.length} for delivery (no coordinates to route)</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

  const update = (id, patch) => setIngredients(ingredients.map((i) => (i.id === id ? { ...i, ...patch } : i)));

    const next = ingredients.filter((i) => i.id !== id);
    setIngredients(next);
    await persist(K.ingredients, next);

  const addIngredient = async () => {
    if (!newIng.name.trim()) return;
    const id = slugify(newIng.name) + "_" + uid();
